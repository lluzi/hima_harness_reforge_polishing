schema: "mage.consumer-model/1"
id: "wat"
version: "0.2.0"
scope:
  blockTypes:
    - "TSK/MPAD"
requirements:
  - id: "placed"
    kind: "cost"
    predicate: "placed"
    parameters: {}
    cost: "dropped ordinary test key; acceptability is the Run's target_dropped_count (drops-within-goal), WAT may Request placement"
    source:
      type: "rule-file"
      ref: "-setNumMin"
    confidence: "high"
  - id: "rigid-unit"
    kind: "hard"
    predicate: "rigid_unit"
    parameters: {}
    source:
      type: "public-research"
      ref: "consumer-requirements-research#6"
    confidence: "high"
  - id: "no-rotation"
    kind: "hard"
    predicate: "orientation_unchanged"
    parameters: {}
    source:
      type: "public-research"
      ref: "consumer-requirements-research#6"
    confidence: "medium"
  - id: "move-cost"
    kind: "cost"
    predicate: "move_in_pitch_units"
    parameters:
      pad_pitch_um:
        from: "consumerContext"
        key: "wat.pad_pitch_um"
    cost: "test-program coordinate update per moved key; wrong-pad risk at >= 0.5 pitch"
    source:
      type: "assumption"
    confidence: "low"
