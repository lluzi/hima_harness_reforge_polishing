id: no-open-requests
version: "1"
# I3: `evaluate-placement` evaluates this rule against the DELIVERED state,
# not only `mage_open_request_count`: it FAILs when the final round-decision
# still carries open Requests OR outstanding Decision Requests, OR the best
# round's own reviews carried any consumer hard-fail Finding. A quantified
# trade-off is a complete delivery with `goalMet` false, never a silent PASS.
title: No open Request, Decision Request, or best-state hard fail remains against the delivered state
requires: [{ type: mage_open_request_count }]
subject: { type: mage_open_request_count }
predicate: { op: eq, threshold: 0, unit: count }
