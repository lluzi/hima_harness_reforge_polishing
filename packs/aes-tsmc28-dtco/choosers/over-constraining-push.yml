# The chooser of this pack's timing push: it over-constrains on purpose and reads the violation the
# tool answers with. Data, never code. It is the same over-constraining push the reference
# opene902-timing-probe pack uses, for the same kind of business — a clock period judged against a
# setup constraint — with the step this pack binds in its graph to 0.01 ns.
#
# Why it never asks a met period what it had to spare. A synthesis tool that reports no margin for a
# met period does not answer that question: it stops optimizing the moment the constraint is
# satisfied and states a setup slack of exactly 0.00. A clause that read `period - slack + guardBand`
# would therefore loosen the period every generation and converge on nothing. This chooser never asks
# a met period what it had to spare:
#
# - The constraint PASSED — the tool said nothing about the margin, because a met period is all it
#   says. Take one step tighter and ask again; that is the over-constraining, and `stepNs` is how
#   coarse the walk in is.
# - The constraint FAILED — now the tool has stated something: the design missed by |slack|, so
#   `period + |slack|` is the period it was asked for plus the shortfall it reported. Ask for one step
#   less than that. The next generation misses by that same step, states the same achievable period
#   and asks for the same number again — two successive generations measuring the same period, which
#   is what this pack's converge block calls having stopped learning. The violation is on record,
#   which is the fact the Campaign was run to find.
# - Both the constraint and the goal PASSED — the design closed and reached what the Run was for.
#   There is no next strategy; the decision is that the Goal is met.
#
# So a Campaign on this chooser ends goal-met when the Goal is reachable, and converged one step
# below the achievable period when it is not — on a tool that reports zero slack for a met period and
# on one that reports a real margin alike, because the PASS clause never reads the margin.
id: over-constraining-push
version: '1'
title: Over-constrain the clock period by one step and read the violation

# The one number the pack binds, in its explore node's `bind:`: how far the walk in moves each
# generation while nothing is violated, and how far above the violated period the exploration settles.
parameter:
  name: stepNs
  unit: ns

# What is read out of the Run's latest observation. The period is the one the measurement states and
# never the one the Run asked for, so a tool that clamped the period is not pushed against as if it
# had honoured the request.
reads:
  period: { type: clock_period, unit: ns }
  slack: { type: setup_wns, unit: ns }

# First matching `when` wins. `constraint` is the verdict of the judge node's first rule — the one the
# outgoing edge was chosen by — and `goal` the verdict of its goal rule. `next` sets this pack's own
# strategy knob by name; a knob it does not name carries over.
decide:
  - when: { constraint: PASS, goal: PASS }
    goalMet: true
  - when: { constraint: PASS }
    next:
      periodNs: { sum: [period, { neg: stepNs }] }
  - when: { constraint: FAIL }
    next:
      periodNs: { sum: [period, { abs: slack }, { neg: stepNs }] }
