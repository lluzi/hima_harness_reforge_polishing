rules:
  - setup-wns-all-nonnegative
  - clock-period-at-most
  - full-evidence-valid
  - route-selection-known
knowledge:
  - file: aes-probe-method.md
    purpose: "How to read this pack's numbers and what they do not say: the
      zero-slack and violation reading, the measured period versus an estimated
      one, matching conditions and the manifest's hashes, the two constraints,
      and the finite hashed timing and netlist samples for later analysis."
  - file: full-mining-method.md
    purpose: Six-route candidate research, exact Boolean provenance, bounded
      selection, library gates and limits of paired measurements.
goal:
  target_period_ns:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.5
strategy:
  periodNs:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.35
    precision: 3
  algorithmRevision:
    type: number
    unit: count
    min: 0
    max: 99
    default: 0
    precision: 0
words:
  target_period_ns:
    label: clock period at most
    unit: ns
  periodNs:
    label: clock period
    unit: ns
  algorithmRevision:
    label: selection algorithm revision
    unit: count
workshops:
  - id: select-timing-criticality
    purpose: First read research_timing_criticality for all candidate identities and
      source-held evidence. The full raw report can exceed the chat read cap;
      use the complete file in your executable. Read raw_timing_criticality,
      source_timing_criticality and full-mining-method.md. Write a
      data-dependent selection algorithm over actual generation_requests, using
      evidence for timing_criticality. Preserve exact candidate ids and Boolean
      contracts. Write selected.json in the declared route directory with
      sourceSha256, selected and codeSha256 (the source miner identity from the
      source record). Do not fabricate metrics or claim PPA. At most two
      buildable candidates per route; an empty selection is honest. Algorithm
      revision is for adapting your code after evidence feedback; preserve
      previous CodeRecords. Read selectionTemplate, copy it as entry.py and
      implement choose(candidates, route). Preserve its main() input/output and
      validation code. Do not launch diagnostic-only entries. The fixed I/O
      scaffold is not research innovation; your data-dependent choose()
      algorithm is.
    directory: research/timing_criticality
    entry: entry.py
    language: python
    inputs:
      - REVISION
    reads:
      - raw_timing_criticality
      - source_timing_criticality
      - research_timing_criticality
      - selectionTemplate
    knowledge:
      - full-mining-method.md
    produces: selected_timing_criticality
    argv:
      - /usr/bin/python3
      - ${ENTRY}
      - ${WORKSPACE}
      - timing_criticality
      - ${REVISION}
