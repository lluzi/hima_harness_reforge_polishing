id: aes-tsmc28-dtco
version: "3"
title: AES TSMC28 custom Cell research and matched physical implementation
inputs:
  - name: flowRoot
    description: "The Site's separately staged Golden Flow root: the directory
      holding probe.py, synth.tcl, read-probe.py and a private inputs.json.
      Read-only to a Campaign — a generation runs in the Campaign's own copy of
      it, never here."
  - name: design
    description: "The design the flow builds: aes_cipher_top, spelled as the flow's
      own inputs.json spells it. probe.py refuses any other value."
  - name: workspaceRoot
    description: Where Campaign workspaces are created. The Site's Permit must allow
      writes under it; nothing the pack does writes anywhere else.
outputs:
  - name: probe
    path: flow/probe.json
    reader: aes-probe-reading
    description: "The manifest the synthesis wrote and the judged output: read as
      clock_period, setup_wns (setup/all) and cell_area."
  - name: timingManifest
    path: flow/probe.json
    description: The same current manifest, unparsed, for evidence access. It names
      the generation's metrics, timing report, qor report, netlist, constraints,
      reference and check_timing reports, dc log and entry script with a sha256
      for each.
  - name: raw_timing_criticality
    path: flow/mining/timing_criticality/raw.json
    description: Source-linked timing_criticality candidate requests; no PPA claim.
  - name: source_timing_criticality
    path: flow/records/mine-timing_criticality.json
    description: Executed miner and raw candidate hashes.
  - name: selected_timing_criticality
    path: flow/mining/timing_criticality/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-timing-criticality
  - name: raw_timing_context
    path: flow/mining/timing_context/raw.json
    description: Source-linked timing_context candidate requests; no PPA claim.
  - name: source_timing_context
    path: flow/records/mine-timing_context.json
    description: Executed miner and raw candidate hashes.
  - name: selected_timing_context
    path: flow/mining/timing_context/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-timing-context
  - name: raw_structure_frequency
    path: flow/mining/structure_frequency/raw.json
    description: Source-linked structure_frequency candidate requests; no PPA claim.
  - name: source_structure_frequency
    path: flow/records/mine-structure_frequency.json
    description: Executed miner and raw candidate hashes.
  - name: selected_structure_frequency
    path: flow/mining/structure_frequency/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-structure-frequency
  - name: raw_structure_compaction
    path: flow/mining/structure_compaction/raw.json
    description: Source-linked structure_compaction candidate requests; no PPA claim.
  - name: source_structure_compaction
    path: flow/records/mine-structure_compaction.json
    description: Executed miner and raw candidate hashes.
  - name: selected_structure_compaction
    path: flow/mining/structure_compaction/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-structure-compaction
  - name: raw_mapper_compatibility
    path: flow/mining/mapper_compatibility/raw.json
    description: Source-linked mapper_compatibility candidate requests; no PPA claim.
  - name: source_mapper_compatibility
    path: flow/records/mine-mapper_compatibility.json
    description: Executed miner and raw candidate hashes.
  - name: selected_mapper_compatibility
    path: flow/mining/mapper_compatibility/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-mapper-compatibility
  - name: raw_functional_diversity
    path: flow/mining/functional_diversity/raw.json
    description: Source-linked functional_diversity candidate requests; no PPA claim.
  - name: source_functional_diversity
    path: flow/records/mine-functional_diversity.json
    description: Executed miner and raw candidate hashes.
  - name: selected_functional_diversity
    path: flow/mining/functional_diversity/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-functional-diversity
  - name: record_merge
    path: flow/records/merge.json
    reader: read-merge
    description: Fresh merge stage evidence; reader verifies held raw artifacts.
  - name: record_generate
    path: flow/records/generate.json
    reader: read-generate
    description: Fresh generate stage evidence; reader verifies held raw artifacts.
  - name: record_layout
    path: flow/records/layout.json
    reader: read-layout
    description: Fresh layout stage evidence; reader verifies held raw artifacts.
  - name: record_characterize
    path: flow/records/characterize.json
    reader: read-characterize
    description: Fresh characterize stage evidence; reader verifies held raw artifacts.
  - name: record_compile
    path: flow/records/compile.json
    reader: read-compile
    description: Fresh compile stage evidence; reader verifies held raw artifacts.
  - name: record_foundry_synth
    path: flow/records/foundry-synth.json
    reader: read-foundry-synth
    description: Fresh foundry-synth stage evidence; reader verifies held raw artifacts.
  - name: record_custom_synth
