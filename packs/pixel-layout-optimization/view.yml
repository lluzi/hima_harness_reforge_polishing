# Display only: how the Live tab draws this Pack's Run (packs.ts packView). It never reaches the
# flow, a task or a judge. The round's checks (DRC, LVS, extraction, transmittance) run as one task
# today, so they are a checklist, not a team; split them into a team only if they ever become
# separate graph tasks.
title: "OLED pixel layout: lower coupling"
stations:
  - id: case
    label: Case and baseline
    about: The case manifest and Site capabilities, and today's judged coupling ratio before any edit.
    checklist:
      - { label: Check the case files, nodes: [prepare-case], rounds: first }
      - { label: Judge the original pixel, nodes: [judge-original], rounds: first }
  - id: design
    label: Design space
    about: Maps the moves available in this case and learns how each one shifts the ratio.
    checklist:
      - { label: Map the design space, nodes: [map-design-space], rounds: first }
      - { label: Learn move sensitivities, nodes: [learn-sensitivities], rounds: first }
  - id: team
    label: Engineering team
    about: Two AI engineers work each round side by side. The layout engineer plans new moves; the repair engineer turns the last round's near-misses into legal layouts with small verified edits.
    team:
      - { node: plan-round, label: Layout engineer, role: plans new moves }
      - { node: repair-round, label: Repair engineer, role: fixes near-misses }
  - id: checks
    label: Checks
    about: Runs the candidate through DRC, LVS, extraction and transmittance, then judges it.
    checklist:
      - { label: "DRC, LVS, extraction / RCE, transmittance", nodes: [solve-and-judge] }
  - id: decision
    label: Round decision
    about: Weighs the judged candidate against the Goal and routes to the next round or to a stop.
    checklist:
      - { label: Decide the round, nodes: [decide-round] }
  - id: delivery
    label: Delivery
    about: Evaluates the best candidate against the Goal and delivers the result.
    checklist:
      - { label: Evaluate the best candidate, nodes: [evaluate] }
      - { label: Deliver the result, nodes: [deliver] }
edges:
  - { from: case, to: design }
  - { from: design, to: team }
  - { from: team, to: checks, label: candidates and repairs }
  - { from: checks, to: decision, label: judged }
  - { from: decision, to: team, label: next round and near-misses, back: true }
  - { from: decision, to: delivery }
metrics:
  - { label: Ct/Cs today, node: judge-original, path: [originalValues, pixel_ratio_judged_pct], unit: "%" }
  - { label: Best Ct/Cs, node: decide-round, path: [best, values, pixel_ratio_judged_pct], unit: "%", better: lower, goal: ratio_target_pct }
  - { label: "Best C(N1,N4)", node: decide-round, path: [best, values, pixel_ct_anode_ff], unit: fF, better: lower, goal: anode_coupling_max_ff }
  - { label: "Best C(N1,Gate)", node: decide-round, path: [best, values, pixel_ct_lines_ff], unit: fF, better: lower, goal: scan_coupling_max_ff }
