# Changes only the round counter. It cannot change the Goal, a build or a measured fact. The owner
# cites the current round and goal verdicts when it asks for another round.
id: andes-next
version: "0.1.0"
title: End at the Goal, stop when two rounds add nothing, else run another design round
parameter: { name: roundStep, unit: count }
reads:
  bestFmax: { type: best_fmax_mhz, unit: mhz }
decide:
  - when: { constraint: PASS, goal: PASS }
    goalMet: true
  - when: { constraint: PASS, goal: FAIL }
    next: { roundRevision: roundStep }
  - when: { constraint: FAIL }
    next: { roundRevision: roundStep }
  - when: { constraint: UNDETERMINED }
    next: { roundRevision: roundStep }
