# Reference build once, then rounds of: HimaTime loads the latest build -> two resident agents in
# parallel propose (HimaTime agent: the high-value cells and the cell what-if, as arcs; Qualib agent:
# the cells the stock libraries cannot make faster, with the custom-cell constraints) -> join -> the
# AndesCell agent (resident) plans the arcs to generate and AndesCell's settings -> AndesCell
# generates them -> two resident agents in parallel verify (HimaTime agent: the cell-level check,
# which cells are kept; Qualib agent: the screen of the kept cells) -> join (at least one cell kept
# and screened) -> the full flow with the custom cells -> round record at route -> checks -> next
# round (owner decision). One round is expected to reach the default Goal (+1 % of the clock period
# in reg2reg worst slack at route); the Site has build data for that one custom-cell set, so a second
# round's rebuild would be refused: the round limit (2) is a safety margin and the chooser ends at the Goal.
#
# Both forks' branch nodes and the AndesCell agent are outsourced resident tasks. Under DBOS the
# compiled flow drives the whole graph itself: it dispatches each node, runs each fork's two branches
# in parallel and joins them when both have delivered their verified result, and advances round to
# round by the graph's own chooser. The `autopilot:` segments below are display-only labels for the
# Live strip and drive nothing. The round record is read twice: once for the usage and improvement
# checks and once, fresh, for the validity/Goal judge the next-round chooser weighs (an explore node
# after a join needs a fresh reading and its own judge).
id: andes-cell-fmax
version: "0.4.0"
entry: bind-inputs
autopilot:
  - from: [bind-inputs]
    until: [himatime-agent, qualib-agent, blocked]
    label: Reference build and timing
    about: The full flow to route on the stock libraries, then HimaTime loads the routed design, reports the worst paths and lists the high-value cells.
  - from: [requirements-joined]
    until: [andescell-agent, blocked]
    label: Requirement check
    about: Both agents' requirements passed the check against the tools; the AndesCell agent plans the arcs next.
  - from: [generate-cells]
    until: [himatime-verify, qualib-screen, blocked]
    label: Cell generation
    about: AndesCell generates the planned arcs' cells; HimaTime and Qualib check them next.
  - from: [cells-verified]
    until: [next-round, blocked]
    label: Rebuild and comparison
    about: The full flow again with the kept and screened cells, then the comparison with the reference build at route.

nodes:
  - id: bind-inputs
    kind: act
    label: Check tools and design
    about: Checks that Synthesis and APR, HimaTime, Qualib, AndesCell and XTop answer on the Site, and records the design data.
    parameters:
      tool: bind-inputs
      arguments:
        EDA_ROOT: { from: input, name: edaRoot }
        DESIGN_ROOT: { from: input, name: designRoot }
        LIBRARY: { from: input, name: stockLibrary }
  - id: reference-build
    kind: act
    label: Reference build
    about: The OpenC910 netlist through placement, CTS and route on the stock libraries at 0.500 ns (2 GHz).
    parameters:
      tool: reference-build
      arguments:
        TIMEOUT_MIN: { from: strategy, name: buildTimeoutMin }
  - id: read-reference
    kind: act
    label: Read the reference build
    about: Reads the reg2reg worst slack, total negative slack, violating paths and density at route.
    parameters: { observes: referenceBuild }
  - id: check-reference
    kind: judge
    label: Reference build finished
    about: The reference build finished the flow through route and wrote its timing summary.
    parameters: { rules: [reference-valid] }
  - id: load-timing
    kind: act
    label: Load into HimaTime
    about: HimaTime loads the latest routed build, reports the worst reg2reg paths and lists the high-value cells.
    parameters:
      tool: load-timing
  - id: read-timing
    kind: act
    label: Read the timing
    about: Reads this round's starting worst slack, then hands the timing to both agents at once.
    parameters: { observes: timingState }
  - id: himatime-agent
    kind: act
    label: HimaTime agent
    about: AI agent. Finds the high-value cells and ranks their arcs with HimaTime's what-if, and asks for the arcs to customize.
    parameters:
      tool: himatime-agent
  - id: qualib-agent
    kind: act
    label: Qualib agent
    about: AI agent. Checks with Qualib that the stock libraries cannot make these cells faster, and sets the custom-cell constraints.
    parameters:
      tool: qualib-agent
  - id: requirements-joined
    kind: judge
    label: Both requirement lists ready
    about: Both agents delivered requirements that agree with the tools.
    parameters: { rules: [requirements-valid] }
  - id: andescell-agent
    kind: act
    label: AndesCell agent
    about: AI agent. Plans the arcs both lists allow and AndesCell's settings (iterations per arc, delay target).
    parameters:
      tool: andescell-agent
  - id: generate-cells
    kind: act
    label: Generate the cells
    about: AndesCell generates a custom cell for every planned arc and keeps the best versions of each.
    parameters:
      tool: generate-cells
  - id: himatime-verify
    kind: act
    label: HimaTime agent (verify)
    about: AI agent. Checks each new cell against its stock cell with HimaTime and keeps the cells with a positive cell-level gain.
    parameters:
      tool: himatime-verify
  - id: qualib-screen
    kind: act
    label: Qualib agent (screen)
    about: AI agent. Screens every kept cell for footprint, input capacitance and LVS, and passes or fails each.
    parameters:
      tool: qualib-screen
  - id: cells-verified
    kind: judge
    label: Cell-level gain confirmed
    about: HimaTime kept at least one new cell for its cell-level gain, and at least one kept cell passed the screen.
    parameters: { rules: [cells-gain-positive, cells-screened] }
  - id: new-library-build
    kind: act
    label: Rebuild with custom cells
    about: The full flow through route with the stock libraries plus every kept and screened custom cell.
    parameters:
      tool: new-library-build
      arguments:
        TIMEOUT_MIN: { from: strategy, name: buildTimeoutMin }
  - id: compare-round
    kind: act
    label: Compare with the reference
    about: Writes the round's comparison at route and the summary.
    parameters:
      tool: compare-round
  - id: read-round
    kind: act
    label: Read the round result
    about: Reads the custom-cell build's worst slack, TNS, violating paths and custom-cell instances, and the gain over the reference build.
    parameters: { observes: roundRecord }
  - id: check-round
    kind: judge
    label: New cells used and faster
    about: The build placed custom cells, and its worst slack is better than every earlier build's.
    parameters: { rules: [cells-used, round-improved] }
  - id: read-round-goal
    kind: act
    label: Read the round for the goal
    about: Reads the round result again for the goal check.
    parameters: { observes: roundRecord }
  - id: judge-round
    kind: judge
    label: Clean build and timing goal
    about: The build finished with kept and screened cells only, and the best worst-slack gain reaches the target.
    parameters:
      rules: [round-valid, timing-goal]
      bind:
        target_timing_gain_pct: { from: goal, name: target_timing_gain_pct }
  - id: next-round
    kind: explore
    label: Next round
    about: Decide whether the target is met, or the agents get another round with this round's results.
    parameters:
      chooser: andes-next
      bind: { roundStep: 1 }
      converge: { read: bestWns, band: 0.5, generations: 2, generationLimit: 2 }
  - id: blocked
    kind: wait
    label: Needs a person
    about: A build, a delivery check or the cell-level check failed in a way the flow cannot repair by itself.
    parameters: { blocker: hard-blocker }

edges:
  - { from: bind-inputs, to: reference-build }
  - { from: reference-build, to: read-reference }
  - { from: read-reference, to: check-reference }
  - { from: check-reference, to: load-timing, outcome: PASS }
  - { from: check-reference, to: blocked, outcome: FAIL }
  - { from: check-reference, to: blocked, outcome: UNDETERMINED }
  - { from: load-timing, to: read-timing }
  - { from: read-timing, to: himatime-agent }
  - { from: read-timing, to: qualib-agent }
  - { from: himatime-agent, to: requirements-joined }
  - { from: qualib-agent, to: requirements-joined }
  - { from: requirements-joined, to: andescell-agent, outcome: PASS }
  - { from: requirements-joined, to: blocked, outcome: FAIL }
  - { from: requirements-joined, to: blocked, outcome: UNDETERMINED }
  - { from: andescell-agent, to: generate-cells }
  - { from: generate-cells, to: himatime-verify }
  - { from: generate-cells, to: qualib-screen }
  - { from: himatime-verify, to: cells-verified }
  - { from: qualib-screen, to: cells-verified }
  - { from: cells-verified, to: new-library-build, outcome: PASS }
  - { from: cells-verified, to: blocked, outcome: FAIL }
  - { from: cells-verified, to: blocked, outcome: UNDETERMINED }
  - { from: new-library-build, to: compare-round }
  - { from: compare-round, to: read-round }
  - { from: read-round, to: check-round }
  - { from: check-round, to: read-round-goal, outcome: PASS }
  - { from: check-round, to: read-round-goal, outcome: FAIL }
  - { from: check-round, to: read-round-goal, outcome: UNDETERMINED }
  - { from: read-round-goal, to: judge-round }
  - { from: judge-round, to: next-round, outcome: PASS }
  - { from: judge-round, to: next-round, outcome: FAIL }
  - { from: judge-round, to: next-round, outcome: UNDETERMINED }
  - { from: next-round, to: load-timing, revisit: true }
loops: {}
