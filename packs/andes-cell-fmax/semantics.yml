values:
  reference_valid:
    unit: count
    description: "One when the reference build (stock library) finished with zero route DRC errors."
  design_fmax_mhz:
    unit: mhz
    description: "Fmax of a build, 1000 / (clock period - worst setup slack), from the sapr post-route summary."
  design_wns_ns:
    unit: ns
    description: "Worst setup slack of a build (negative when violated)."
  design_tns_ns:
    unit: ns
    description: "Total negative setup slack of a build over its violating endpoints."
  design_area_um2:
    unit: um2
    description: "Standard-cell area of a build."
  new_cell_instances:
    unit: count
    description: "Instances of AndesCell cells in a build's routed netlist (zero in the reference build)."
  route_drc_errors:
    unit: count
    description: "Detailed-route DRC errors of a build."
  timing_loaded:
    unit: count
    description: "One when HimaTime loaded the build this round starts from."
  timing_fmax_mhz:
    unit: mhz
    description: "Fmax of the build this round starts from, as HimaTime reports it."
  timing_wns_ns:
    unit: ns
    description: "Worst setup slack of the build this round starts from."
  timing_critical_families:
    unit: count
    description: "Stock cell families with a positive HimaTime estimated slack recovery: the candidates for new cells."
  requirements_valid:
    unit: count
    description: "One when an agent's cell requirements passed the Pack's check (schema, round, AndesCell families, targets, evidence, report)."
  requirements_count:
    unit: count
    description: "Number of cell requirements in an agent's delivery."
  requirements_on_critical_path:
    unit: count
    description: "Informational. Requirements naming a stock family that is on the worst paths with a positive estimated recovery."
  plan_valid:
    unit: count
    description: "One when the AndesCell agent's generation plan passed the Pack's check (round, 1-2 requested new families with reasons and HimaTime's estimated recovery, every other requested family skipped with a reason, report)."
  plan_families:
    unit: count
    description: "Families the generation plan builds this round."
  plan_follows_ranking:
    unit: count
    description: "Informational. One when the plan took the requested new families with the highest HimaTime estimated recovery."
  verify_delivery_valid:
    unit: count
    description: "One when a verify delivery (HimaTime cell timing or Qualib cell screen) agreed with the tools' own answer for this round's cells."
  local_gain_ps:
    unit: ps
    description: "HimaTime: how much faster the worst path of the build this round started from gets with this round's new cells (ps), from himatime verify; the same on both verify branches."
  cells_passed_screen:
    unit: count
    description: "This round's new cells that pass the Qualib screen, from qualib screen; the same on both verify branches."
  cells_faster_than_stock:
    unit: count
    description: "Informational. This round's new cells whose FO4 delay is below their stock cell's, from himatime verify."
  round_valid:
    unit: count
    description: "One when the new-library build finished at the reference clock with zero route DRC and used only new cells that passed the Qualib screen and HimaTime verification."
  fmax_gain_pct:
    unit: percent
    description: "100 x (new-library build Fmax / reference build Fmax - 1) for this round."
  best_gain_pct:
    unit: percent
    description: "Largest Fmax gain over the reference build of any valid round so far."
  round_improved:
    unit: count
    description: "One when this round's build is valid and faster than every earlier build."
  best_fmax_mhz:
    unit: mhz
    description: "Best Fmax of a valid build so far (the reference build's before the first)."
  new_families_used:
    unit: count
    description: "Informational. Cell families this round added to the delivered library."
