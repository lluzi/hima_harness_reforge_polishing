id: library-intelligence
version: "0.2.0"
entry: qualify-api
nodes:
  - id: qualify-api
    kind: act
    parameters:
      tool: qualify-api
      arguments:
        QUALIFICATION_MANIFEST: { from: input, name: qualificationManifest }
        QUALIFICATION_PYTHON: { from: input, name: qualificationPython }
  - id: read-qualification
    kind: act
    parameters: { observes: qualification }
  - id: qualification-gate
    kind: judge
    parameters:
      rules: [library-api-qualified]
      bind: { qualification_required: { from: goal, name: qualification_required } }
  - id: blocked
    kind: wait
    parameters: { blocker: hard-blocker }
edges:
  - { from: qualify-api, to: read-qualification }
  - { from: read-qualification, to: qualification-gate }
  - { from: qualification-gate, to: blocked, outcome: FAIL }
  - { from: qualification-gate, to: blocked, outcome: UNDETERMINED }
loops: {}
