id: library-intelligence
version: "0.3.1"
title: Library Intelligence qualification, facts, insight and bounded proposal
status: development
minimumHarnessVersion: 0.1.0
inputs:
  - name: qualificationManifest
    description: Site-owned exact runtime, Permit and three-source qualification manifest.
  - name: qualificationPython
    description: Site-owned qualified Python executable, also pinned in the qualification manifest.
  - name: analysisManifest
    description: Site-owned baseline/candidate roles, source hashes and comparable family/corner/view conditions.
  - name: workspaceRoot
    description: Site-permitted Campaign private workspace root.
outputs:
  - name: qualification
    path: flow/qualification/receipt.json
    reader: library-qualification
    description: Typed per-input read/query/copy/re-read evidence; no Library facts.
  - name: baselineFacts
    path: flow/library/baseline-facts.json
    reader: library-facts
    description: Hash-bound representative E2 facts from the qualified source.
  - name: candidateFacts
    path: flow/library/candidate-facts.json
    reader: library-facts
    description: Hash-bound candidate E2 facts; Wave 2 starts with the same qualified source.
  - name: libraryDelta
    path: flow/library/delta.json
    reader: library-delta
    description: Comparable-condition delta; same-source Wave 2 evidence is explicitly zero.
  - name: libraryInsight
    path: flow/library/insight-report.json
    reader: library-insight
    description: Versioned, read-only Library Insight report.
  - name: libraryProposal
    path: flow/library/proposal.json
    reader: library-proposal
    description: Versioned E4 method proposal with no write authorization.
  - name: libraryRuleResult
    path: flow/library/rule-result.json
    reader: library-rule-result
    description: Typed private-workspace E4 analysis result; it recommends no mutation for the same-source control.
tools:
  - id: qualify-api
    file: tools/libapi_worker.py
    description: Run the bounded, Host-attested three-source native API qualification.
    inputs: [QUALIFICATION_MANIFEST, QUALIFICATION_PYTHON, WORKSPACE]
    licences: { QuaLib-2026-new-59099: 1 }
    argv:
      - /usr/local/bin/edarun
      - ${QUALIFICATION_PYTHON}
      - ${WORKSPACE}/flow/tools/libapi_worker.py
      - ${QUALIFICATION_MANIFEST}
      - ${WORKSPACE}
  - id: index-baseline
    file: tools/library-stages.py
    description: Derive bounded baseline facts from the passed E1 receipt without re-reading native objects.
    inputs: [WORKSPACE, ANALYSIS_MANIFEST]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', facts, '${WORKSPACE}/flow/qualification/receipt.json', '${ANALYSIS_MANIFEST}', baseline, '${WORKSPACE}/flow/library/baseline-facts.json']
  - id: index-candidate
    file: tools/library-stages.py
    description: Derive candidate facts from the same qualified source for an explicit zero-delta control.
    inputs: [WORKSPACE, ANALYSIS_MANIFEST]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', facts, '${WORKSPACE}/flow/qualification/receipt.json', '${ANALYSIS_MANIFEST}', candidate, '${WORKSPACE}/flow/library/candidate-facts.json']
  - id: semantic-delta
    file: tools/library-stages.py
    description: Compare only hash-bound facts under exactly matching available conditions.
    inputs: [WORKSPACE]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', delta, '${WORKSPACE}/flow/library/baseline-facts.json', '${WORKSPACE}/flow/library/candidate-facts.json', '${WORKSPACE}/flow/library/delta.json']
  - id: library-insight
    file: tools/library-stages.py
    description: Produce a versioned read-only insight report from the typed delta.
    inputs: [WORKSPACE]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', report, '${WORKSPACE}/flow/library/delta.json', '${WORKSPACE}/flow/library/insight-report.json']
  - id: propose-library-rule
    file: tools/library-stages.py
    description: Produce a bounded E4 proposal; it cannot execute a customer algorithm or write Library inputs.
    inputs: [WORKSPACE]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', proposal, '${WORKSPACE}/flow/library/insight-report.json', '${WORKSPACE}/flow/library/rule-result.json', '${WORKSPACE}/flow/tools/library-stages.py', '${WORKSPACE}/flow/library/proposal.json']
  - id: evaluate-library-rule
    file: tools/library-stages.py
    description: Produce a typed no-mutation E4 result from the versioned report within the private workspace.
    inputs: [WORKSPACE]
    argv: [/usr/bin/python3, '${WORKSPACE}/flow/tools/library-stages.py', result, '${WORKSPACE}/flow/library/insight-report.json', '${WORKSPACE}/flow/library/rule-result.json']
environment:
  wrappers: [/usr/local/bin/edarun, /usr/bin/python3]
workspace:
  source: pack
  copy: [tools]
rules: [library-api-qualified]
goal:
  qualification_required: { type: number, unit: count, min: 1, max: 1, default: 1 }
strategy:
  qualificationRevision: { type: number, unit: count, min: 0, max: 0, default: 0 }
words:
  qualification_required: { label: qualified API gate, unit: count }
  qualificationRevision: { label: qualification method revision, unit: count }
