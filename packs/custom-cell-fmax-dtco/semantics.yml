values:
  reg2reg_wns:
    unit: ns
    description: Worst setup slack from an explicit reg2reg-only Design Compiler path group.
    mode: [setup]
    scope: [reg2reg]
  reg2reg_path_count:
    unit: count
    description: Number of complete paths retained in the explicit reg2reg pressure report.
  candidate_count:
    unit: count
    description: "candidate count: independently read evidence; missing facts stay unknown."
  generated_cell_count:
    unit: count
    description: "generated cell count: independently read evidence; missing facts
      stay unknown."
  abstract_cell_count:
    unit: count
    description: "abstract cell count: independently read evidence; missing facts
      stay unknown."
  layout_refused_count:
    unit: count
    description: Candidate Cells excluded from the common library after a recorded abstract-layout failure or timeout.
  predicted_cell_count:
    unit: count
    description: "predicted cell count: independently read evidence; missing facts
      stay unknown."
  lc_accepted:
    unit: count
    description: "lc accepted: independently read evidence; missing facts stay unknown."
  library_visible:
    unit: count
    description: "library visible: independently read evidence; missing facts stay unknown."
  adopted_instance_count:
    unit: count
    description: "adopted instance count: independently read evidence; missing facts
      stay unknown."
  adopted_candidate_count:
    unit: count
    description: Number of distinct generated candidate Cells instantiated by the one pressured custom synthesis screen.
  pnr_completed:
    unit: count
    description: "pnr completed: independently read evidence; missing facts stay unknown."
  clock_tree_cell_count:
    unit: count
    description: CCOpt-inserted CTS_ instances in the routed netlist, all independently checked against the Site-declared DCCK buffer and inverter sets.
  verification_error_count:
    unit: count
    description: Errors in final-database restore, timing, library visibility or instance-census verification; successful verified execution is zero.
  cell_checker_diagnostic_count:
    unit: count
    description: Innovus cell-only checker findings retained as diagnostics; the foundry-only arm also flags abstract-library geometry, so this is not a generated-Cell validity claim.
  comparison_valid:
    unit: count
    description: One when the two final databases are matched, the generated library is live, a generated Cell is adopted, and identity/timing verification completed.
  hold_wns:
    unit: ns
    description: Post-route hold WNS reread from the retained arm report.
    mode: [hold]
    scope: [all]
  hold_violating_paths:
    unit: count
    description: Post-route hold violating paths reread from the retained arm report.
  route_drc_violations:
    unit: count
    description: Route DRC violations reread from the uncapped retained arm report.
  connectivity_violations:
    unit: count
    description: Connectivity violations reread from the retained arm report.
  postroute_power:
    unit: mw
    description: Total post-route power from the retained Innovus report whose unit is 1mW.
  gate_count:
    unit: count
    description: Equivalent gate count from the retained Innovus gate-count report.
  cell_count:
    unit: count
    description: Cell count from the retained Innovus gate-count report.
  postroute_cell_area:
    unit: um2
    description: Cell area in square micrometres from the retained Innovus gate-count report.
  route_instance_count:
    unit: count
    description: Routed instance count from the retained Innovus summary report.
  route_density:
    unit: percent
    description: Pure gate density number 6 from the retained Innovus summary report.
  effective_site_occupancy:
    unit: fraction
    description: All instantiated standard-cell master area divided by the frozen placeable core area, including fixed tap and DCAP cells; values above 1.0 are invalid.
  floorplan_requested_utilization:
    unit: fraction
    description: Strategy utilization requested by the Campaign before the fixed area-expansion policy.
  floorplan_effective_utilization:
    unit: fraction
    description: Utilization actually passed to Innovus after applying the Pack's fixed floorplan-area expansion.
  floorplan_area_expansion:
    unit: ratio
    description: Frozen core-area multiplier applied identically to the foundry and generated arms.
  innovus_route_top_layer_index:
    unit: count
    description: Positive integer route layer level rendered into Innovus routeTopRoutingLayer.
  dcap_count:
    unit: count
    description: Fixed deterministic checkerboard DCAP instances admitted before placement.
  pg_special_wire_count:
    unit: count
    description: PG special-wire objects observed after the matched ring/stripe/sroute method.
  v5_setup_endpoint_count:
    unit: count
    description: Register data endpoints explicitly enumerated by the V5 endpoint-complete Innovus export.
  v5_active_frontier_count:
    unit: count
    description: Endpoints at or beyond the frozen V5 q target under the arm's complete setup endpoint state.
  v5_q0:
    unit: ns
    description: Worst endpoint required-period indicator q_e = period - slack.
  v5_q_target:
    unit: ns
    description: Frozen reference target required-period indicator for the Campaign Fmax goal.
  v5_required_gain:
    unit: ns
    description: Difference between the arm q0 and the frozen q target; it is not a per-Action prediction.
  v5_frontier_reference_count:
    unit: count
    description: Reference endpoints at or beyond the frozen commercial q target.
  v5_frontier_generated_count:
    unit: count
    description: Generated endpoints at or beyond the same frozen commercial q target.
  v5_frontier_resolved_count:
    unit: count
    description: Reference active-frontier endpoints moved below the frozen target by the generated Portfolio.
  v5_frontier_entrant_count:
    unit: count
    description: Endpoints newly entering the frozen frontier after the generated Portfolio.
  v5_frontier_remaining_count:
    unit: count
    description: Generated endpoints still at or beyond the frozen q target and therefore explicit input to the next research generation.
  congestion_overflow:
    unit: count
    description: Congestion overflow when a verified report format is available; otherwise explicitly unknown.
  full_constraint_failures:
    unit: count
    description: Disclosed setup, hold, route-DRC and connectivity findings across both arms. They bound physical-signoff scope but do not erase a matched final-database Fmax comparison.
  matched_conditions:
    unit: count
    description: "matched conditions: independently read evidence; missing facts
      stay unknown."
  foundry_setup_wns:
    unit: ns
    description: Matched post-route setup timing; never inferred closed Fmax.
    mode:
      - setup
    scope:
      - all
  setup_wns_delta:
    unit: ns
    description: Matched post-route setup timing; never inferred closed Fmax.
    mode:
      - setup
    scope:
      - all
  foundry_fmax_mhz:
    unit: mhz
    description: Fmax derived from the foundry arm's restored final-database clock and setup slack.
  generated_fmax_mhz:
    unit: mhz
    description: Fmax derived from the generated arm's restored final-database clock and setup slack.
  fmax_delta_mhz:
    unit: mhz
    description: Generated minus foundry restored-final-database Fmax under matched conditions.
  fmax_improvement_pct:
    unit: percent
    description: Generated minus foundry Fmax, divided by foundry Fmax, from the matched restored final databases.
  fmax_improved:
    unit: count
    description: One only when generated restored-final-database Fmax is strictly higher.
  selected_count:
    unit: count
    description: Exact source-linked buildable candidate ids selected by the
      executed Workshop program.
  retained_candidate_count:
    unit: count
    description: Strongest previously adopted candidate Cells carried into the next common library before new discovery slots are filled.
  theoretical_gain_upper_pct:
    unit: percent
    description: Largest selected candidate upper-bound incremental Fmax gain derived from its observed reg2reg path-delay contribution; not a predicted realized gain.
  research_hypothesis_count:
    unit: count
    description: Distinct evidence-linked research lenses used to rank the one collaborative candidate set.
  proxy_boolean_equivalent:
    unit: count
    description: One only when every selected function has exact Boolean-equivalence evidence independently retained in the F0/F1 portfolio.
  proxy_interface_compatible:
    unit: count
    description: One only when every selected function has a complete canonical input/output interface matching its declared candidate identity.
  proxy_generator_feasible:
    unit: count
    description: One only when every selected function is admitted by the current deterministic generator contract.
  proxy_break_even_local_bound:
    unit: delay_unit
    description: Tightest selected local break-even Cell-delay bound in the source Library-relative delay unit. It is not expected route gain or commercial timing.
  proxy_local_level_delta:
    unit: count
    description: Overlap-aware local logic levels removed by the selected F1 portfolio; positive means less local depth and does not predict commercial timing.
  proxy_removed_node_count:
    unit: count
    description: Overlap-aware local logic nodes removed by the selected F1 portfolio.
  proxy_cut_width:
    unit: count
    description: Largest selected local cut boundary width retained by the independently recomputed F1 portfolio.
  proxy_reconvergence_coverage:
    unit: percent
    description: Largest selected local reconvergence coverage, converted from the F1 fraction to percent.
  proxy_mapped_instance_delta:
    unit: count
    description: Augmented minus reference mapped instance count under one invariant license-free mapping plan.
  proxy_logic_depth_p95_delta:
    unit: count
    description: Augmented minus reference 95th-percentile combinational logic level, recomputed from the retained level histograms.
  proxy_buffer_inverter_pressure_delta:
    unit: count
    description: Augmented minus reference buffer and inverter instance count in the mapped netlists.
  proxy_fanout_load_delta:
    unit: index
    description: Augmented minus reference product of mean fanout and mean load indicator under one declared capacitance unit.
  proxy_adopted_candidate_count:
    unit: count
    description: Number of declared candidate Cell masters instantiated by the license-free augmented mapper; this is not commercial adoption.
  proxy_worst_reg2reg_delay_indicator:
    unit: ns
    description: Augmented-arm worst reg2reg delay from the nominal proxy-STA scenario, converted from ps; it is not commercial timing.
  proxy_negative_slack_mass_indicator:
    unit: ns
    description: Augmented-arm endpoint-family-deduplicated negative-slack mass from the nominal proxy-STA scenario, converted from ps.
  new_library_cell_count:
    unit: count
    description: Physical custom Cell variants introduced by the current immutable Library delta.
  cumulative_library_cell_count:
    unit: count
    description: Unique physical custom Cell variants in the independently validated cumulative Library manifest.
  proxy_metric_vector_complete:
    unit: count
    description: One only when the Reader can recompute all mandatory indicators for the current evaluation scope; missing evidence remains zero or unknown at its source value.
  function_local_structure_effective:
    unit: count
    description: One only when the exact-function, interface and generator gates pass and the selected overlap-aware F1 portfolio contains an explainable positive structural change.
  proxy_pairwise_relation:
    unit: relation_code
    description: Current two-arm indicator relation code recomputed from all declared objectives; 0 equal, 1 augmented-dominates, 2 tradeoff and 3 reference-dominates. It is not a frontier or benefit prediction.
  proxy_pairwise_relation_valid:
    unit: count
    description: One only when every scenario is comparable and the declared two-arm relation exactly matches independent recomputation.
  portfolio_frontier_membership:
    unit: count
    description: One only when the current evaluation is a member of the independently recomputed FW-07 cross-round Pareto frontier.
  e0_library_validation_candidate:
    unit: count
    description: One only when the candidate Library has valid F0 evidence, is a current frontier member, and its parallel F1/F2/F3 factors are not all explicitly negative. E0 eligibility never states expected gain.
