id: custom-cell-fmax-dtco
version: "1"
title: Portable custom Cell Fmax research and matched physical implementation
status: development
minimumHarnessVersion: 0.1.0
ontology:
  aliases:
    campaign: [study, project]
    customCell: [custom cell, generated cell]
    matchedComparison: [A/B, apple-to-apple comparison]
knowledgeManifest: knowledge/manifest.yml
budget:
  closingReserveMs: 60000
  attemptLimit: 120
inputs:
  - name: designRoot
    description: "Read-only design root containing the RTL and constraints named by
      the Site binding."
  - name: rtlGlob
    description: "Site-bound RTL glob for the selected design; candidates are mined
      from the resulting current netlist and timing report."
  - name: designTop
    description: "Site-bound elaboration top. No Pack-owned top-name invariant exists."
  - name: constraints
    description: "Site-bound timing constraints used identically by both comparison arms."
  - name: foundryLibrary
    description: "Site-bound Liberty/DB inputs for the baseline library."
  - name: physicalInputs
    description: "Site-bound LEF, extraction, layer-map, row-site, tap/filler and process
      profile used identically by both route arms. Every path and scalar consumed by the
      physical method is validated before the Campaign writes inputs.json."
  - name: toolStack
    description: "A Site-local JSON profile with the EDA wrapper and bounded tool timeouts.
      HimaGuide can construct it from Site discovery; the user does not write Pack YAML."
  - name: workspaceRoot
    description: Where Campaign workspaces are created. The Site's Permit must allow
      writes under it; nothing the pack does writes anywhere else.
outputs:
  - name: probe
    path: flow/probe.json
    reader: custom-cell-fmax-probe-reading
    description: "The manifest the synthesis wrote and the judged output: read as
      clock_period, setup_wns (setup/all) and cell_area."
  - name: timingManifest
    path: flow/probe.json
    description: The same current manifest, unparsed, for evidence access. It names
      the generation's metrics, timing report, qor report, netlist, constraints,
      reference and check_timing reports, dc log and entry script with a sha256
      for each.
  - name: raw_timing_criticality
    path: flow/mining/timing_criticality/raw.json
    description: Source-linked timing_criticality candidate requests; no PPA claim.
  - name: source_timing_criticality
    path: flow/records/mine-timing_criticality.json
    description: Executed miner and raw candidate hashes.
  - name: selected_timing_criticality
    path: flow/mining/timing_criticality/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-timing-criticality
  - name: raw_timing_context
    path: flow/mining/timing_context/raw.json
    description: Source-linked timing_context candidate requests; no PPA claim.
  - name: source_timing_context
    path: flow/records/mine-timing_context.json
    description: Executed miner and raw candidate hashes.
  - name: selected_timing_context
    path: flow/mining/timing_context/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-timing-context
  - name: raw_structure_frequency
    path: flow/mining/structure_frequency/raw.json
    description: Source-linked structure_frequency candidate requests; no PPA claim.
  - name: source_structure_frequency
    path: flow/records/mine-structure_frequency.json
    description: Executed miner and raw candidate hashes.
  - name: selected_structure_frequency
    path: flow/mining/structure_frequency/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-structure-frequency
  - name: raw_structure_compaction
    path: flow/mining/structure_compaction/raw.json
    description: Source-linked structure_compaction candidate requests; no PPA claim.
  - name: source_structure_compaction
    path: flow/records/mine-structure_compaction.json
    description: Executed miner and raw candidate hashes.
  - name: selected_structure_compaction
    path: flow/mining/structure_compaction/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-structure-compaction
  - name: raw_mapper_compatibility
    path: flow/mining/mapper_compatibility/raw.json
    description: Source-linked mapper_compatibility candidate requests; no PPA claim.
  - name: source_mapper_compatibility
    path: flow/records/mine-mapper_compatibility.json
    description: Executed miner and raw candidate hashes.
  - name: selected_mapper_compatibility
    path: flow/mining/mapper_compatibility/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-mapper-compatibility
  - name: raw_functional_diversity
    path: flow/mining/functional_diversity/raw.json
    description: Source-linked functional_diversity candidate requests; no PPA claim.
  - name: source_functional_diversity
    path: flow/records/mine-functional_diversity.json
    description: Executed miner and raw candidate hashes.
  - name: selected_functional_diversity
    path: flow/mining/functional_diversity/selected.json
    description: Agent program selects exact source ids; merge independently
      validates provenance.
    reader: read-select-functional-diversity
  - name: record_merge
    path: flow/records/merge.json
    reader: read-merge
    description: Fresh merge stage evidence; reader verifies held raw artifacts.
  - name: record_generate
    path: flow/records/generate.json
    reader: read-generate
    description: Fresh generate stage evidence; reader verifies held raw artifacts.
  - name: record_layout
    path: flow/records/layout.json
    reader: read-layout
    description: Fresh layout stage evidence; reader verifies held raw artifacts.
  - name: record_characterize
    path: flow/records/characterize.json
    reader: read-characterize
    description: Fresh characterize stage evidence; reader verifies held raw artifacts.
  - name: record_compile
    path: flow/records/compile.json
    reader: read-compile
    description: Fresh compile stage evidence; reader verifies held raw artifacts.
  - name: record_foundry_synth
    path: flow/records/foundry-synth.json
    reader: read-foundry-synth
    description: Fresh foundry-synth stage evidence; reader verifies held raw artifacts.
  - name: record_custom_synth
    path: flow/records/custom-synth.json
    reader: read-custom-synth
    description: Fresh custom-synth stage evidence; reader verifies held raw artifacts.
  - name: record_adoption
    path: flow/records/adoption.json
    reader: read-adoption
    description: Fresh adoption stage evidence; reader verifies held raw artifacts.
  - name: record_pnr_foundry
    path: flow/records/pnr-foundry.json
    reader: read-pnr-foundry
    description: Fresh pnr-foundry stage evidence; reader verifies held raw artifacts.
  - name: record_pnr_generated
    path: flow/records/pnr-generated.json
    reader: read-pnr-generated
    description: Fresh pnr-generated stage evidence; reader verifies held raw artifacts.
  - name: record_verify
    path: flow/records/verify.json
    reader: read-verify
    description: Fresh verify stage evidence; reader verifies held raw artifacts.
  - name: record_compare
    path: flow/records/compare.json
    reader: read-compare
    description: Fresh compare stage evidence; reader verifies held raw artifacts.
  - name: research_timing_criticality
    path: flow/mining/timing_criticality/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-timing-criticality
  - name: research_timing_context
    path: flow/mining/timing_context/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-timing-context
  - name: research_structure_frequency
    path: flow/mining/structure_frequency/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-structure-frequency
  - name: research_structure_compaction
    path: flow/mining/structure_compaction/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-structure-compaction
  - name: research_mapper_compatibility
    path: flow/mining/mapper_compatibility/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-mapper-compatibility
  - name: research_functional_diversity
    path: flow/mining/functional_diversity/research.json
    description: Compact source-hashed projection of every emitted candidate; raw
      remains the executable and reader authority.
    reader: read-research-functional-diversity
  - name: aiResearchSelection
    path: flow/research/research.json
    reader: read-ai-research-selection
    description: Source-hashed report from the one AI-authored cross-route discovery
      algorithm. It records hypotheses and exact candidate identities but makes no
      mapper-adoption or PPA claim.
  - name: researchTemplate
    path: flow/research-template.py
    description: Small fixed entry scaffold. The Campaign Agent implements only
      research(candidates, context); the Pack runner owns I/O and validation.
environment:
  wrappers:
    - /usr/bin/python3
  commands:
    - eda
workspace:
  source: pack
  copy:
    - bind-inputs.py
    - probe.py
    - synth.tcl
    - read-probe.py
    - stages.py
    - domain
    - read-stage.py
    - research-template.py
    - ai_research_runner.py
tools:
  - id: bind-inputs
    file: tools/bind-inputs.py
    description: Materialize this Campaign's declared design, process and tool inputs into
      its private flow/inputs.json. It consumes the selected Site bindings and never reads
      a pre-staged customer flow or overwrites an existing input identity.
    inputs:
      - WORKSPACE
      - DESIGN_ROOT
      - RTL_GLOB
      - DESIGN_TOP
      - CONSTRAINTS
      - FOUNDRY_LIBRARY
      - PHYSICAL_INPUTS
      - TOOL_STACK
    argv:
      - /usr/bin/python3
      - ${WORKSPACE}/flow/bind-inputs.py
      - --workspace
      - ${WORKSPACE}
      - --design-root
      - ${DESIGN_ROOT}
      - --rtl-glob
      - ${RTL_GLOB}
      - --design-top
      - ${DESIGN_TOP}
      - --constraints
      - ${CONSTRAINTS}
      - --foundry-library
      - ${FOUNDRY_LIBRARY}
      - --physical-inputs
      - ${PHYSICAL_INPUTS}
      - --tool-stack
      - ${TOOL_STACK}
  - id: synthesize
    recommendedVersion: "Design Compiler current Site-supported release"
    file: tools/probe.py
    description: One bounded Site-bound synthesis of the selected design at the
      strategy's clock period, in a fresh trial directory of the Campaign's own
      copy of the flow. Publishes flow/probe.json only on success; a failed run
      publishes no new result and keeps its trial and log.
    inputs:
      - WORKSPACE
      - PERIOD_NS
    licences:
      Design-Compiler: 1
    argv:
      - /usr/bin/python3
      - ${WORKSPACE}/flow/probe.py
      - --workspace
      - ${WORKSPACE}
      - --period
      - ${PERIOD_NS}
  - id: mine-timing-criticality
    file: tools/stages.py
    description: Enumerate bounded candidates for timing_criticality from the
      retained probe netlist and Site Liberty.
    inputs:
      - WORKSPACE
    argv:
      - /usr/bin/python3
      - ${WORKSPACE}/flow/stages.py
      - mine
      - ${WORKSPACE}
      - timing_criticality
  - id: mine-timing-context
    file: tools/stages.py
    description: Enumerate bounded candidates for timing_context from the retained
      probe netlist and Site Liberty.
    inputs:
      - WORKSPACE
    argv:
      - /usr/bin/python3
      - ${WORKSPACE}/flow/stages.py
      - mine
      - ${WORKSPACE}
      - timing_context
  - id: mine-structure-frequency
    file: tools/stages.py
    description: Enumerate bounded candidates for structure_frequency from the
      retained probe netlist and Site Liberty.
    inputs:
      - WORKSPACE
    argv:
      - /usr/bin/python3
      - ${WORKSPACE}/flow/stages.py
