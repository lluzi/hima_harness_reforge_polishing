rules:
  - reg2reg-pressure-at-least-100ps
  - clock-period-at-most
  - comparison-evidence-valid
  - fmax-improved
  - fmax-improvement-at-least-target
  - custom-cell-adopted
  - route-candidate-pool-known
  - proxy-metric-vector-complete
  - function-local-structure-effective
  - proxy-pairwise-relation-valid
  - portfolio-frontier-member
  - e0-library-validation-candidate
knowledge:
  - file: custom-cell-fmax-probe-method.md
    purpose: "How to read this pack's numbers and what they do not say: the
      explicit -0.1 ns reg2reg pressure target, the measured period versus a
      next-trial hypothesis, matching conditions and the manifest's hashes, the
      two constraints, and the finite hashed timing and netlist samples for later analysis."
  - file: full-mining-method.md
    purpose: Six-route candidate research, exact Boolean provenance, bounded
      selection, library gates and limits of paired measurements.
  - file: library-richness-evaluation.md
    purpose: F0 feasibility, parallel F1/F2/F3 factors and E0 expensive observation;
      pairwise-versus-frontier authority, cumulative Library evidence and residual research boundaries.
  - file: active-frontier-v5.md
    purpose: Endpoint-complete Active Frontier control, grounded innovation lenses, break-even reasoning and commercial feedback for every research generation.
  - file: site-profile.md
    purpose: Complete Site-local physical and tool profile fields, types, ownership, discovery sources and readiness rules used before a Campaign starts.
goal:
  target_period_ns:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.5
  target_fmax_improvement_pct:
    type: number
    unit: percent
    min: 0.1
    max: 25
    default: 5
strategy:
  floorplanUtilization:
    type: number
    unit: fraction
    min: 0.2
    max: 0.8
    default: 0.25
    precision: 3
  periodNs:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.5
    precision: 3
  algorithmRevision:
    type: number
    unit: count
    min: 0
    max: 99
    default: 0
    precision: 0
words:
  floorplanUtilization:
    label: initial floorplan utilization shared by both PNR arms
    unit: fraction
  target_period_ns:
    label: clock period at most
    unit: ns
  target_fmax_improvement_pct:
    label: matched post-route Fmax improvement at least
    unit: percent
  periodNs:
    label: clock period
    unit: ns
  algorithmRevision:
    label: AI discovery algorithm revision
    unit: count
workshops:
  - id: research-candidates
    purpose: Read the current hash-bound residual context prepared by the function/local
      evaluation, every source projection needed to inspect it, the fixed template and the
      layered evaluation method. This is the Campaign's one creative discovery node. Copy
      researchTemplate as entry.py and implement only residual_research(context). Author
      several evidence-linked F0-F3 lenses and one bounded pure candidate program that
      selects immutable proposal_key values from the supplied candidate pool. Respond to
      the current residual graph, Pareto frontier, cumulative Library, known failures and
      remaining budget. Do not assign identity, alter the Goal or evidence, predict
      commercial QoR, launch EDA, create parallel validation arms, repeat a fixed ranking,
      or write Judge facts. The returned list must never exceed
      budget["max_candidate_proposals"]; slice or stop the loop at that exact runtime value.
      Include one onsite-inspiration lens as the sequential seventh strategy above the six
      fixed miners. It analyzes their combined evidence and, from generation two onward,
      must cite and respond to the current commercial frontier response. It may contribute
      at most budget["max_onsite_inspiration_proposals"] proposals to the same cumulative
      Library and the same E0 validation; it never opens a separate commercial arm.
      Invalid output is retained as a refusal. A later revision must
      answer new retained evidence, especially the hash-bound commercial frontier response. It must propose several grounded hypotheses before selecting a bounded program; Run results never auto-promote into Pack knowledge.
    directory: research/ai-discovery
    entry: entry.py
    language: python
    inputs: []
    reads:
      - record_evaluation_baseline
      - record_function_local_evaluation
      - raw_timing_criticality
      - source_timing_criticality
      - research_timing_criticality
      - raw_timing_context
      - source_timing_context
      - research_timing_context
      - raw_structure_frequency
      - source_structure_frequency
      - research_structure_frequency
      - raw_structure_compaction
      - source_structure_compaction
      - research_structure_compaction
      - raw_mapper_compatibility
      - source_mapper_compatibility
      - research_mapper_compatibility
      - raw_functional_diversity
      - source_functional_diversity
      - research_functional_diversity
      - researchTemplate
    knowledge:
      - full-mining-method.md
      - library-richness-evaluation.md
      - active-frontier-v5.md
    produces: aiResearchSelection
    argv:
      - /usr/bin/python3
      - ${ENTRY}
      - --lfr-residual
      - ${WORKSPACE}
      - ${WORKSPACE}/flow/research/research.json
