rules:
  - reg2reg-wns-nonnegative
  - clock-period-at-most
  - comparison-evidence-valid
  - fmax-improved
  - custom-cell-adopted
  - route-candidate-pool-known
knowledge:
  - file: custom-cell-fmax-probe-method.md
    purpose: "How to read this pack's numbers and what they do not say: the
      zero-slack and violation reading, the measured period versus an estimated
      one, matching conditions and the manifest's hashes, the two constraints,
      and the finite hashed timing and netlist samples for later analysis."
  - file: full-mining-method.md
    purpose: Six-route candidate research, exact Boolean provenance, bounded
      selection, library gates and limits of paired measurements.
  - file: site-profile.md
    purpose: Complete Site-local physical and tool profile fields, types, ownership, discovery sources and readiness rules used before a Campaign starts.
goal:
  target_period_ns:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.5
strategy:
  floorplanUtilization:
    type: number
    unit: fraction
    min: 0.2
    max: 0.8
    default: 0.25
    precision: 3
  periodNs:
    type: number
    unit: ns
    min: 0.1
    max: 5
    default: 0.5
    precision: 3
  algorithmRevision:
    type: number
    unit: count
    min: 0
    max: 99
    default: 0
    precision: 0
words:
  floorplanUtilization:
    label: initial floorplan utilization shared by both PNR arms
    unit: fraction
  target_period_ns:
    label: clock period at most
    unit: ns
  periodNs:
    label: clock period
    unit: ns
  algorithmRevision:
    label: AI discovery algorithm revision
    unit: count
workshops:
  - id: research-candidates
    purpose: Read every research_ROUTE projection, raw_ROUTE source, mine record,
      researchTemplate and full-mining-method.md. This is the Campaign's one
      creative discovery node. The six Pack miners are broad evidence generators,
      not the selection authority. Copy researchTemplate as entry.py and implement
      only research(candidates, context). Author a cross-route, data-dependent
      algorithm from the current design's explicit reg2reg path membership,
      incremental delay, Boolean function, occurrence, implementation route and
      any retained synthesis/adoption feedback. Examine at least three competing
      hypotheses. Each candidate supplies stable route, evidence, interface,
      equivalence_digest and implementation_route aliases alongside the complete
      source request. Fill min(MAX_CELLS, distinct Boolean functions), using at least
      two hypotheses when selecting more than one Cell. Cell creation is
      cheap, while the next pressured DC screen is the scarce experiment. Do not
      embed candidate ids, reproduce a fixed ranking, claim adoption/PPA, or hide
      a negative result. On a later algorithmRevision, change the algorithm in
      response to recorded evidence and preserve the prior CodeRecord.
    directory: research/ai-discovery
    entry: entry.py
    language: python
    inputs:
      - REVISION
    reads:
      - probe
      - timingManifest
      - raw_timing_criticality
      - source_timing_criticality
      - research_timing_criticality
      - raw_timing_context
      - source_timing_context
      - research_timing_context
      - raw_structure_frequency
      - source_structure_frequency
      - research_structure_frequency
      - raw_structure_compaction
      - source_structure_compaction
      - research_structure_compaction
      - raw_mapper_compatibility
      - source_mapper_compatibility
      - research_mapper_compatibility
      - raw_functional_diversity
      - source_functional_diversity
      - research_functional_diversity
      - researchTemplate
    knowledge:
      - full-mining-method.md
    produces: aiResearchSelection
    argv:
      - /usr/bin/python3
      - ${ENTRY}
      - ${WORKSPACE}
      - ${REVISION}
