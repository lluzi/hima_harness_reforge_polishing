# This chooser changes only the Pack's research-strategy revision. It cannot change the Goal,
# select a commercial result, alter a Library shard or write a proxy/Judge fact. The owner cites
# the current independently read constraint and Goal verdicts when requesting another generation.
id: research-next
version: "1"
title: Conclude from current evidence or revise the residual research strategy
parameter:
  name: revisionStep
  unit: count
reads:
  relation:
    type: proxy_pairwise_relation
    unit: relation_code
decide:
  - when:
      constraint: PASS
      goal: PASS
    goalMet: true
  - when:
      constraint: FAIL
    next:
      algorithmRevision: revisionStep
  - when:
      constraint: PASS
      goal: FAIL
    next:
      algorithmRevision: revisionStep
