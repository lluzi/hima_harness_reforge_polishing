id: research-next
version: "1"
title: Conclude from current physical evidence or revise selection
parameter:
  name: revisionStep
  unit: count
reads:
  gain:
    type: fmax_improvement_pct
    unit: percent
decide:
  - when:
      constraint: PASS
      goal: PASS
    goalMet: true
  - when:
      constraint: FAIL
    next:
      algorithmRevision: revisionStep
  - when:
      constraint: PASS
      goal: FAIL
    next:
      algorithmRevision: revisionStep
