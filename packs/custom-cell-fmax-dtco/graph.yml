id: custom-cell-fmax-dtco
version: "1"
entry: bind-inputs
nodes:
  - id: bind-inputs
    kind: act
    parameters:
      tool: bind-inputs
      arguments:
        DESIGN_ROOT: { from: input, name: designRoot }
        RTL_GLOB: { from: input, name: rtlGlob }
        DESIGN_TOP: { from: input, name: designTop }
        CONSTRAINTS: { from: input, name: constraints }
        FOUNDRY_LIBRARY: { from: input, name: foundryLibrary }
        PHYSICAL_INPUTS: { from: input, name: physicalInputs }
        TOOL_STACK: { from: input, name: toolStack }
  - id: evaluation-baseline
    kind: act
    parameters:
      tool: evaluate-library-richness
      arguments:
        EVALUATION_PHASE: baseline
  - id: read-evaluation-baseline
    kind: act
    parameters:
      observes: record_evaluation_baseline
  - id: mine-timing-criticality
    kind: act
    parameters:
      tool: mine-timing-criticality
  - id: select-timing-criticality
    kind: act
    parameters:
      observes: research_timing_criticality
  - id: mine-timing-context
    kind: act
    parameters:
      tool: mine-timing-context
  - id: select-timing-context
    kind: act
    parameters:
      observes: research_timing_context
  - id: mine-structure-frequency
    kind: act
    parameters:
      tool: mine-structure-frequency
  - id: select-structure-frequency
    kind: act
    parameters:
      observes: research_structure_frequency
  - id: mine-structure-compaction
    kind: act
    parameters:
      tool: mine-structure-compaction
  - id: select-structure-compaction
    kind: act
    parameters:
      observes: research_structure_compaction
  - id: mine-mapper-compatibility
    kind: act
    parameters:
      tool: mine-mapper-compatibility
  - id: select-mapper-compatibility
    kind: act
    parameters:
      observes: research_mapper_compatibility
  - id: mine-functional-diversity
    kind: act
    parameters:
      tool: mine-functional-diversity
  - id: select-functional-diversity
    kind: act
    parameters:
      observes: research_functional_diversity
  - id: merge-join
    kind: judge
    parameters:
      rules:
        - route-candidate-pool-known
  - id: research-candidates
    kind: act
    parameters:
      workshop: research-candidates
  - id: read-research-selection
    kind: act
    parameters:
      observes: aiResearchSelection
  - id: function-local-evaluation
    kind: act
    parameters:
      tool: evaluate-library-richness
      arguments:
        EVALUATION_PHASE: function-local
  - id: read-function-local-evaluation
    kind: act
    parameters:
      observes: record_function_local_evaluation
  - id: function-local-gate
    kind: judge
    parameters:
      rules:
        - proxy-metric-vector-complete
  - id: merge
    kind: act
    parameters:
      tool: merge
  - id: read-merge
    kind: act
    parameters:
      observes: record_merge
  - id: generate
    kind: act
    parameters:
      tool: generate
  - id: read-generate
    kind: act
    parameters:
      observes: record_generate
  - id: layout
    kind: act
    parameters:
      tool: layout
  - id: read-layout
    kind: act
    parameters:
      observes: record_layout
  - id: characterize
    kind: act
    parameters:
      tool: characterize
  - id: read-characterize
    kind: act
    parameters:
      observes: record_characterize
  - id: design-mapping-timing-evaluation
    kind: act
    parameters:
      tool: evaluate-library-richness
      arguments:
        EVALUATION_PHASE: design-mapping-timing
  - id: read-design-mapping-timing-evaluation
    kind: act
    parameters:
      observes: record_design_mapping_timing_evaluation
  - id: portfolio-gate
    kind: judge
    parameters:
      rules:
        - proxy-metric-vector-complete
        - proxy-pairwise-relation-valid
        - portfolio-frontier-member
        - e0-library-validation-candidate
  - id: freeze-cumulative-library
    kind: act
    parameters:
      tool: freeze-cumulative-library
  - id: read-cumulative-library
    kind: act
    parameters:
      observes: record_cumulative_library
  - id: compile
    kind: act
    parameters:
      tool: compile
  - id: read-compile
    kind: act
    parameters:
      observes: record_compile
  - id: foundry-synth
    kind: act
    parameters:
      tool: foundry-synth
      arguments:
        PERIOD_NS:
          from: strategy
          name: periodNs
  - id: read-foundry-synth
    kind: act
    parameters:
      observes: record_foundry_synth
  - id: custom-synth
    kind: act
    parameters:
      tool: custom-synth
      arguments:
        PERIOD_NS:
          from: strategy
          name: periodNs
  - id: read-custom-synth
    kind: act
    parameters:
      observes: record_custom_synth
  - id: adoption
    kind: act
    parameters:
      tool: adoption
  - id: read-adoption
    kind: act
    parameters:
      observes: record_adoption
  - id: adoption-gate
    kind: judge
    parameters:
      rules:
        - custom-cell-adopted
  - id: pnr-foundry
    kind: act
    parameters:
      tool: pnr-foundry
      arguments:
        FLOORPLAN_UTILIZATION:
          from: strategy
          name: floorplanUtilization
  - id: read-pnr-foundry
    kind: act
    parameters:
      observes: record_pnr_foundry
  - id: pnr-generated
    kind: act
    parameters:
      tool: pnr-generated
      arguments:
        FLOORPLAN_UTILIZATION:
          from: strategy
          name: floorplanUtilization
  - id: read-pnr-generated
    kind: act
    parameters:
      observes: record_pnr_generated
  - id: verify
    kind: act
    parameters:
      tool: verify
  - id: read-verify
    kind: act
    parameters:
      observes: record_verify
  - id: compare
    kind: act
    parameters:
      tool: compare
  - id: read-compare
    kind: act
    parameters:
      observes: record_compare
  - id: final-judge
    kind: judge
    parameters:
      rules:
        - comparison-evidence-valid
        - fmax-improvement-at-least-target
        - fmax-improved
        - clock-period-at-most
      bind:
        target_fmax_improvement_pct:
          from: goal
          name: target_fmax_improvement_pct
        target_period_ns:
          from: goal
          name: target_period_ns
  - id: next-research
    kind: explore
    parameters:
      growth: true
      chooser: research-next
      bind:
        revisionStep: 1
      converge:
        read: relation
        band: 0.01
        generations: 1
        generationLimit: 4
  - id: blocked
    kind: wait
    parameters:
      blocker: hard-blocker
edges:
  - from: bind-inputs
    to: evaluation-baseline
  - from: evaluation-baseline
    to: read-evaluation-baseline
  - from: read-evaluation-baseline
    to: mine-timing-criticality
  - from: mine-timing-criticality
    to: select-timing-criticality
  - from: select-timing-criticality
    to: mine-timing-context
  - from: mine-timing-context
    to: select-timing-context
  - from: select-timing-context
    to: mine-structure-frequency
  - from: mine-structure-frequency
    to: select-structure-frequency
  - from: select-structure-frequency
    to: mine-structure-compaction
  - from: mine-structure-compaction
    to: select-structure-compaction
  - from: select-structure-compaction
    to: mine-mapper-compatibility
  - from: mine-mapper-compatibility
    to: select-mapper-compatibility
  - from: select-mapper-compatibility
    to: mine-functional-diversity
  - from: mine-functional-diversity
    to: select-functional-diversity
  - from: select-functional-diversity
    to: merge-join
  - from: merge-join
    to: function-local-evaluation
    outcome: PASS
  - from: merge-join
    to: blocked
    outcome: FAIL
  - from: function-local-evaluation
    to: read-function-local-evaluation
  - from: read-function-local-evaluation
    to: function-local-gate
  - from: function-local-gate
    to: research-candidates
    outcome: PASS
  - from: function-local-gate
    to: next-research
    outcome: FAIL
  - from: research-candidates
    to: read-research-selection
  - from: read-research-selection
    to: merge
  - from: merge
    to: read-merge
  - from: read-merge
    to: generate
  - from: generate
    to: read-generate
  - from: read-generate
    to: layout
  - from: layout
    to: read-layout
  - from: read-layout
    to: characterize
  - from: characterize
    to: read-characterize
  - from: read-characterize
    to: design-mapping-timing-evaluation
  - from: design-mapping-timing-evaluation
    to: read-design-mapping-timing-evaluation
  - from: read-design-mapping-timing-evaluation
    to: portfolio-gate
  - from: portfolio-gate
    to: freeze-cumulative-library
    outcome: PASS
  - from: portfolio-gate
    to: next-research
    outcome: FAIL
  - from: freeze-cumulative-library
    to: read-cumulative-library
  - from: read-cumulative-library
    to: compile
  - from: compile
    to: read-compile
  - from: read-compile
    to: foundry-synth
  - from: foundry-synth
    to: read-foundry-synth
  - from: read-foundry-synth
    to: custom-synth
  - from: custom-synth
    to: read-custom-synth
  - from: read-custom-synth
    to: adoption
  - from: adoption
    to: read-adoption
  - from: read-adoption
    to: adoption-gate
  - from: adoption-gate
    to: pnr-foundry
    outcome: PASS
  - from: adoption-gate
    to: blocked
    outcome: FAIL
  - from: pnr-foundry
    to: read-pnr-foundry
  - from: read-pnr-foundry
    to: pnr-generated
  - from: pnr-generated
    to: read-pnr-generated
  - from: read-pnr-generated
    to: verify
  - from: verify
    to: read-verify
  - from: read-verify
    to: compare
  - from: compare
    to: read-compare
  - from: read-compare
    to: final-judge
  - from: final-judge
    to: next-research
    outcome: FAIL
  - from: next-research
    to: evaluation-baseline
    revisit: true
loops: {}
