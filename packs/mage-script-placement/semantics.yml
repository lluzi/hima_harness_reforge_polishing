values:
  mage_candidate_error_count:
    unit: count
    description: Structural, identity, recompute-mismatch or session-log/stage-binding errors found while re-verifying one round's script-candidate delivery; 0 only once every reference and recomputation agrees.
  mage_priority_unplaced_count:
    unit: count
    description: Count of Group-placed (priority) marks the candidate's own pending list still carries (never actually placed as a Fit).
  mage_dropped_count:
    unit: count
    description: Count of test structures the candidate's PLA itself records as dropped (placedFlag not null).
  mage_dropped_length_um:
    unit: um
    description: Total long-side length of every dropped structure in the candidate.
  mage_dropped_ordinary_count:
    unit: count
    description: Count of dropped structures with an empty inGroup (not Group-placed); this is the half of mage_dropped_count the external benchmark's comparison objective scores against a baseline/reference method.
  mage_dropped_ordinary_length_um:
    unit: um
    description: Total long-side length of the ordinary (non-Group) dropped structures; the external benchmark's comparison objective. Always <= mage_dropped_length_um.
  mage_target_distance_max_um:
    unit: um
    description: Maximum along-lane distance from a bound target's CT point to its placed Fit's box centre, over every bound target in the candidate.
  mage_target_over_limit_count:
    unit: count
    description: Count of bound targets whose along-lane distance exceeds the Goal's max_target_distance_um limit.
  mage_order_deviation_max:
    unit: rank
    description: Maximum placement-order deviation (customer check_dev) over the TB/LR/IN partitions.
  mage_order_deviation_max_lr:
    unit: rank
    description: Maximum placement-order deviation over the two LR sides (left, right) by the customer's per-side check_dev; the reference script flags a deviation of 3 or more.
  mage_order_deviation_max_tb:
    unit: rank
    description: Maximum placement-order deviation over the two TB sides (bottom, top) by the customer's per-side check_dev; the reference script flags a deviation of 2 or more.
  mage_priority_move_max_um:
    unit: um
    description: Largest movement (|dx| + |dy| of the box centre) of any priority (Group-placed) mark from the frozen start state, i.e. movement introduced by optimisation; never the distance from the CT target. Unknown when a start priority mark cannot be matched to exactly one candidate mark (identity-unknown).
  mage_priority_moved_count:
    unit: count
    description: Count of priority marks whose box moved from the frozen start state.
  mage_native_overlap_rows:
    unit: rows
    description: MAGE's own instance count from the candidate's native OVERLAP check (frbCheckOverlap).
  mage_native_space_rows:
    unit: rows
    description: MAGE's own instance count from the candidate's native SPACE check (frbCheckSpace); each row is one offending instance, not a pair count.
  mage_native_boundary_rows:
    unit: rows
    description: MAGE's own instance count from the candidate's native BOUNDARY check (frbCheckBoundary).
  mage_native_violation_total:
    unit: rows
    description: Sum of the three native check instance counts (OVERLAP, SPACE, BOUNDARY); unknown whenever any one is unknown.
