values:
  tc_required_input_missing_count:
    unit: count
    description: Verified required design/Site input items missing from inputReadiness.
  tc_lifecycle_available:
    unit: count
    description: Verified full-flow lifecycle availability; informational on this XTop-only route.
  tc_engineering_result_error_count:
    unit: count
    description: Structural, identity, raw-evidence or required-artifact errors; 0 only after complete Reader verification.
  tc_engineering_setup_wns_ns:
    unit: ns
    mode: [setup]
    description: Actual native XTop setup WNS of the selected resident-engineering state.
  tc_engineering_hold_wns_ns:
    unit: ns
    mode: [hold]
    description: Actual native XTop hold WNS of the selected resident-engineering state.
  tc_engineering_setup_tns_ns:
    unit: ns
    mode: [setup]
    description: Actual native XTop setup TNS of the selected resident-engineering state.
  tc_engineering_hold_tns_ns:
    unit: ns
    mode: [hold]
    description: Actual native XTop hold TNS of the selected resident-engineering state.
  tc_engineering_remaining_violation_count:
    unit: count
    description: Reader-derived known remaining setup/hold plus raw-native collateral lower bound; a positive lower bound is known, while zero is unknown unless required global raw scope is proved.
  tc_engineering_regression_count:
    unit: count
    description: Reader-derived Goal/residual timing modes and witnessed raw-native blocker findings that worsened; positive already-satisfied margin is expendable, and the model list length is ignored.
  tc_engineering_collateral_unknown_count:
    unit: count
    description: Required global transition, capacitance, fanout or legality checks whose full violation count is unknown; bounded fail-reason samples remain unknown even when they prove blockers.
  tc_engineering_timing_remaining_violation_count:
    unit: count
    description: Sum of raw-verified selected setup and hold violation counts only. Global collateral and adoption are separate checks and may remain unknown.
  tc_engineering_setup_violation_count:
    unit: count
    mode: [setup]
    description: Raw-verified selected native XTop setup violation count.
  tc_engineering_hold_violation_count:
    unit: count
    mode: [hold]
    description: Raw-verified selected native XTop hold violation count.
  tc_engineering_before_setup_violation_count:
    unit: count
    mode: [setup]
    description: Raw-verified before setup violation count at the fixed common R1 engineering start.
  tc_engineering_before_setup_wns_ns:
    unit: ns
    mode: [setup]
    description: Raw-verified before setup WNS at the fixed common R1 engineering start.
  tc_engineering_before_setup_tns_ns:
    unit: ns
    mode: [setup]
    description: Raw-verified before setup TNS at the fixed common R1 engineering start.
  tc_engineering_before_hold_violation_count:
    unit: count
    mode: [hold]
    description: Raw-verified before hold violation count at the fixed common R1 engineering start.
  tc_engineering_before_hold_wns_ns:
    unit: ns
    mode: [hold]
    description: Raw-verified before hold WNS at the fixed common R1 engineering start.
  tc_engineering_before_hold_tns_ns:
    unit: ns
    mode: [hold]
    description: Raw-verified before hold TNS at the fixed common R1 engineering start.
