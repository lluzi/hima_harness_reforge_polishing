values:
  tc_required_input_missing_count:
    unit: count
    description: Verified required design/Site input items missing from inputReadiness.
  tc_lifecycle_available:
    unit: count
    description: Verified full-flow lifecycle availability; informational on this XTop-only route.
  tc_engineering_result_error_count:
    unit: count
    description: Structural, identity, raw-evidence or required-artifact errors; 0 only after complete Reader verification.
  tc_engineering_setup_wns_ns:
    unit: ns
    mode: [setup]
    description: Actual native XTop setup WNS of the selected resident-engineering state.
  tc_engineering_hold_wns_ns:
    unit: ns
    mode: [hold]
    description: Actual native XTop hold WNS of the selected resident-engineering state.
  tc_engineering_setup_tns_ns:
    unit: ns
    mode: [setup]
    description: Actual native XTop setup TNS of the selected resident-engineering state.
  tc_engineering_hold_tns_ns:
    unit: ns
    mode: [hold]
    description: Actual native XTop hold TNS of the selected resident-engineering state.
  tc_engineering_remaining_violation_count:
    unit: count
    description: Known remaining setup, hold and required collateral violations; unknown when a required collateral check is unknown.
  tc_engineering_regression_count:
    unit: count
    description: Required checks or constraints recorded as regressed by the actual before/after comparison.
  tc_engineering_collateral_unknown_count:
    unit: count
    description: Required transition, capacitance, fanout or legality checks whose violation count is unknown.
  tc_engineering_effect_vs_autofix:
    unit: count
    description: 1 resident-dominant, 0 exact tie, -1 AutoFix-dominant; unknown for mixed or incomparable timing effects.
