# One complete engineering task: retained native input -> common R1 -> matched ordinary AutoFix
# reference -> resident engineering delivery -> honest XTop goal/effect verdict. PrimeTime, Innovus,
# StarRC, six Hima seats and physical-referee tails are not on this version's reference route.
id: agentic-timing-closure-system
version: "0.3.0"
entry: bind-inputs
autopilot:
  - { from: [bind-inputs], until: [fix-timing, wait-for-person] }
  - { from: [read-engineering-result], until: [check-engineering-goal, wait-for-person] }

nodes:
  - id: bind-inputs
    kind: act
    parameters:
      tool: bind-inputs
      arguments:
        DESIGN_STATE_MANIFEST: { from: input, name: designStateManifest }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        NATIVE_TIMING_CONTEXT: { from: input, name: nativeTimingContext }
  - id: read-readiness
    kind: act
    parameters: { observes: inputReadiness }
  - id: check-inputs
    kind: judge
    parameters: { rules: [inputs-ready] }
  - id: baseline
    kind: act
    parameters:
      tool: baseline
      arguments:
        DESIGN_STATE_MANIFEST: { from: input, name: designStateManifest }
  - id: prepare-native-context
    kind: act
    parameters:
      tool: prepare-native-context
      arguments:
        NATIVE_TIMING_CONTEXT: { from: input, name: nativeTimingContext }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: common-autofix
    kind: act
    parameters:
      tool: common-autofix
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        NATIVE_REPORT_PATHS: { from: strategy, name: nativeReportPaths }
  - id: auto-fix-reference
    kind: act
    parameters:
      tool: auto-fix-reference
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: fix-timing
    kind: act
    parameters:
      tool: fix-timing
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        NATIVE_TIMING_CONTEXT: { from: input, name: nativeTimingContext }
        TARGET_SETUP_NS: { from: goal, name: target_setup_wns_ns }
        TARGET_HOLD_NS: { from: goal, name: target_hold_wns_ns }
  - id: read-engineering-result
    kind: act
    parameters: { observes: engineeringResult }
  - id: check-engineering-delivery
    kind: judge
    parameters: { rules: [engineering-delivery-ready] }
  - id: check-engineering-goal
    kind: judge
    parameters:
      rules: [engineering-setup-goal, engineering-hold-goal, engineering-no-remaining, engineering-no-regression, engineering-beats-autofix]
      bind:
        target_setup_wns_ns: { from: goal, name: target_setup_wns_ns }
        target_hold_wns_ns: { from: goal, name: target_hold_wns_ns }
  - id: wait-for-person
    kind: wait
    parameters: { blocker: scope-input-or-engineering-delivery-required }

edges:
  - { from: bind-inputs, to: read-readiness }
  - { from: read-readiness, to: check-inputs }
  - { from: check-inputs, to: baseline, outcome: PASS }
  - { from: check-inputs, to: wait-for-person, outcome: FAIL }
  - { from: check-inputs, to: wait-for-person, outcome: UNDETERMINED }
  - { from: baseline, to: prepare-native-context }
  - { from: prepare-native-context, to: common-autofix }
  - { from: common-autofix, to: auto-fix-reference }
  - { from: auto-fix-reference, to: fix-timing }
  - { from: fix-timing, to: read-engineering-result }
  - { from: read-engineering-result, to: check-engineering-delivery }
  - { from: check-engineering-delivery, to: check-engineering-goal, outcome: PASS }
  - { from: check-engineering-delivery, to: wait-for-person, outcome: FAIL }
  - { from: check-engineering-delivery, to: wait-for-person, outcome: UNDETERMINED }
