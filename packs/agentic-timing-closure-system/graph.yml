# Reference graph (SPEC "Run contract", reference-graph behaviour 1-9).
#
# Harness facts this graph is shaped by (packages/harness/src/packs.ts, node-turns.ts):
# - a Judge routes on its FIRST rule only, so every compound SPEC rule is a chain of single-rule Judges;
# - a graph holds at most one wait node, and an unlabelled UNDETERMINED goes there;
# - ordinary edges never cycle; every way back is one `revisit: true` edge from an Explore node, and an
#   Explore node with a chooser has at most one outgoing edge, so each domain route has its own Explore;
# - an Explore node weighs the last Judge of its Generation, which must list at least two rules whose
#   verdicts all cite the Generation's latest reading (hence the two-rule routing Judges and re-reads);
# - there is no `converge` block: SPEC disables score-based convergence; the budget ending is the Runtime's;
# - `prepare-workers` forks into six worker branches joined at the judge `check-worker-results`
#   (Issue #64 Task 5). A branch holds act nodes only, and because the join sits upstream of every
#   Explore node once the Run loops, the Harness requires each Explore's own Judge to follow a fresh
#   unbranched reading directly (packs.ts `exploreAfter`): a routing Judge that follows another Judge
#   first re-reads the output it judges (the `reread-*` nodes before route-* and gm-*). The goal-met
#   re-reads are of finalEvaluation, whose values every gm-* rule requires (artifact-ready reads
#   tc_final_setup_wns_ns too), so every verdict still cites the Generation's latest reading.
id: agentic-timing-closure-system
version: "0.2.0"
entry: bind-inputs
nodes:
  # 1. Bind and verify inputs; strict scope.
  - id: bind-inputs
    kind: act
    parameters:
      tool: bind-inputs
      arguments:
        DESIGN_STATE_MANIFEST: { from: input, name: designStateManifest }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: read-readiness
    kind: act
    parameters: { observes: inputReadiness }
  - id: check-inputs
    kind: judge
    parameters: { rules: [inputs-ready] }

  # 2. Common baseline, initial observation, and the stamped acceptance policy (Goal bound here).
  - id: baseline
    kind: act
    parameters:
      tool: baseline
      arguments:
        DESIGN_STATE_MANIFEST: { from: input, name: designStateManifest }
  - id: observe-baseline
    kind: act
    parameters:
      tool: observe-baseline
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        MAX_PATHS: { from: strategy, name: maxPaths }
  - id: policy
    kind: act
    parameters:
      tool: policy
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        TARGET_SETUP_NS: { from: goal, name: target_setup_wns_ns }
        TARGET_HOLD_NS: { from: goal, name: target_hold_wns_ns }
  - id: physical-baseline
    kind: act
    parameters:
      tool: physical-baseline
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: risk-baseline
    kind: act
    parameters:
      tool: risk
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
  # The owner's first decision is taken on the baseline itself (SPEC behaviour 2 and Constraint 3):
  # residual works from the baseline observation, so earlier APR, observe, research or wait are all
  # choosable before any local ECO.
  - id: residual-baseline
    kind: act
    parameters:
      tool: residual
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }

  # 3. Diagnose, admit the request, observe.
  - id: diagnose
    kind: act
    parameters: { workshop: diagnose-and-observe }
  - id: read-observation-request
    kind: act
    parameters: { observes: observationRequest }
  - id: check-observation-request
    kind: judge
    parameters: { rules: [request-admissible, request-checked] }
  - id: retry-diagnose
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: observe-query
    kind: act
    parameters:
      tool: observe-query
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        MAX_PATHS: { from: strategy, name: maxPaths }
  - id: risk-query
    kind: act
    parameters:
      tool: risk
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }

  # 4. Plan six bounded slots, blockers first, and run them as six parallel fork branches.
  #    The Run's workerSlots knob is bound on every way into the plan; the campaign-plan Reader
  #    refuses overlapping slots, an uncovered worst setup/hold check and an active slot above the knob.
  - id: bind-worker-slots
    kind: act
    parameters:
      tool: worker-slots
      arguments:
        WORKER_SLOTS: { from: strategy, name: workerSlots }
  - id: plan
    kind: act
    parameters: { workshop: plan-campaign }
  - id: read-campaign-plan
    kind: act
    parameters: { observes: campaignPlan }
  - id: check-campaign-plan
    kind: judge
    parameters: { rules: [request-admissible] }
  - id: prepare-workers
    kind: act
    parameters:
      tool: prepare-workers
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }

  # Each branch is one slot's pure act chain and holds one Site Job at a time: its Workshop, its
  # Reader, its operate node (the worker Team Operator's interactive XTop session, or for a parked
  # slot the batch operate-parked no-op), its capture and its result Reader. Every slot reads and
  # writes its own paths (worker-request-wNN.json, contribution-wNN.json).
  - id: research-worker-01
    kind: act
    parameters: { workshop: research-worker-01 }
  - id: read-worker-request-01
    kind: act
    parameters: { observes: workerRequest01 }
  - id: operate-worker-01
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w01 } }
  - id: capture-worker-01
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w01 } }
  - id: read-worker-result-01
    kind: act
    parameters: { observes: workerResult01 }

  - id: research-worker-02
    kind: act
    parameters: { workshop: research-worker-02 }
  - id: read-worker-request-02
    kind: act
    parameters: { observes: workerRequest02 }
  - id: operate-worker-02
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w02 } }
  - id: capture-worker-02
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w02 } }
  - id: read-worker-result-02
    kind: act
    parameters: { observes: workerResult02 }

  - id: research-worker-03
    kind: act
    parameters: { workshop: research-worker-03 }
  - id: read-worker-request-03
    kind: act
    parameters: { observes: workerRequest03 }
  - id: operate-worker-03
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w03 } }
  - id: capture-worker-03
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w03 } }
  - id: read-worker-result-03
    kind: act
    parameters: { observes: workerResult03 }

  - id: research-worker-04
    kind: act
    parameters: { workshop: research-worker-04 }
  - id: read-worker-request-04
    kind: act
    parameters: { observes: workerRequest04 }
  - id: operate-worker-04
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w04 } }
  - id: capture-worker-04
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w04 } }
  - id: read-worker-result-04
    kind: act
    parameters: { observes: workerResult04 }

  - id: research-worker-05
    kind: act
    parameters: { workshop: research-worker-05 }
  - id: read-worker-request-05
    kind: act
    parameters: { observes: workerRequest05 }
  - id: operate-worker-05
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w05 } }
  - id: capture-worker-05
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w05 } }
  - id: read-worker-result-05
    kind: act
    parameters: { observes: workerResult05 }

  - id: research-worker-06
    kind: act
    parameters: { workshop: research-worker-06 }
  - id: read-worker-request-06
    kind: act
    parameters: { observes: workerRequest06 }
  - id: operate-worker-06
    kind: act
    parameters: { tool: xtop-operator, arguments: { SLOT: w06 } }
  - id: capture-worker-06
    kind: act
    parameters: { tool: capture-contribution, arguments: { SLOT: w06 } }
  - id: read-worker-result-06
    kind: act
    parameters: { observes: workerResult06 }

  # The join: every branch's sealed result, judged on its own reading. Both outcomes collect; a
  # refused slot is excluded from the ranked recipe by composition, not by the route.
  - id: check-worker-results
    kind: judge
    parameters: { rules: [worker-result-admissible] }

  # 5. Collect, compose, replay from the common base, reconcile.
  - id: collect
    kind: act
    parameters: { tool: collect }
  - id: read-contribution-index
    kind: act
    parameters: { observes: contributionIndex }
  - id: compose-facts
    kind: act
    parameters: { tool: compose-facts }
  - id: read-composition-facts
    kind: act
    parameters: { observes: compositionFacts }
  - id: compose
    kind: act
    parameters: { workshop: compose-contributions }
  - id: read-integration-plan
    kind: act
    parameters: { observes: integrationPlan }
  - id: check-integration-plan
    kind: judge
    parameters: { rules: [request-admissible] }
  - id: compose-facts-admitted
    kind: act
    parameters: { tool: compose-facts-admitted }
  - id: read-composition-facts-admitted
    kind: act
    parameters: { observes: compositionFacts }
  - id: check-composition
    kind: judge
    parameters: { rules: [composition-ready] }
  - id: replay-prepare
    kind: act
    parameters:
      tool: replay-prepare
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        AUTO_FINISH: { from: strategy, name: autoFinish }
  - id: reconcile
    kind: act
    parameters: { tool: reconcile }
  - id: read-integration-state
    kind: act
    parameters: { observes: integrationState }
  - id: check-replay-mismatch
    kind: judge
    parameters: { rules: [replay-consistent-mismatch] }
  - id: check-replay-scope
    kind: judge
    parameters: { rules: [replay-consistent-scope] }

  # 6. Cheap pre-check; an unqualified model routes to the next decision, never to an ending.
  - id: presta
    kind: act
    parameters:
      tool: presta
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: read-precheck
    kind: act
    parameters: { observes: precheckEvidence }
  - id: check-presta-model
    kind: judge
    parameters: { rules: [presta-model-qualified] }
  # Physical-refresh budget (Issue #64 Track B, from #63): every Explore revisit consumes a Harness
  # generation whether or not it refreshes anything, so generationLimit bounds revisits, not
  # refreshes. Right before each refresh (implement here, apr-prepare below) the ledger is read
  # afresh -- a Judge takes a type's latest reading Run-wide, and sta records a refresh no later
  # node reads -- and refresh-budget holds tc_refreshes_completed below the Run's Goal value
  # max_physical_refreshes, fixed when the Run is created. FAIL and UNDETERMINED (an unverifiable
  # ledger) stop at wait-for-person, which has no outgoing edge: clearing it ends the Run. More
  # refreshes need a new Run created with a higher max_physical_refreshes.
  - id: read-refresh-budget
    kind: act
    parameters: { observes: workingState }
  - id: check-refresh-budget
    kind: judge
    parameters:
      rules: [refresh-budget]
      bind: { max_physical_refreshes: { from: goal, name: max_physical_refreshes } }

  # 7. One joint implementation and full refresh, then evidence before Goal.
  - id: implement
    kind: act
    parameters:
      tool: implement
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: extract
    kind: act
    parameters:
      tool: extract
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: sta
    kind: act
    parameters:
      tool: sta
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
        MAX_PATHS: { from: strategy, name: maxPaths }
  - id: physical-candidate
    kind: act
    parameters: { tool: physical-candidate }
  - id: evaluate
    kind: act
    parameters:
      tool: evaluate
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
  - id: read-final-evaluation
    kind: act
    parameters: { observes: finalEvaluation }
  - id: check-final-coverage
    kind: judge
    parameters: { rules: [final-evidence-ready-coverage] }
  - id: check-final-identity
    kind: judge
    parameters: { rules: [final-evidence-ready-identity] }
  - id: check-constraint-failures
    kind: judge
    parameters: { rules: [required-constraints-pass-failures] }
  - id: check-constraint-unknowns
    kind: judge
    parameters: { rules: [required-constraints-pass-unknowns] }
  - id: check-setup-goal
    kind: judge
    parameters:
      rules: [setup-goal]
      bind: { target_setup_wns_ns: { from: goal, name: target_setup_wns_ns } }
  - id: check-hold-goal
    kind: judge
    parameters:
      rules: [hold-goal]
      bind: { target_hold_wns_ns: { from: goal, name: target_hold_wns_ns } }
  - id: adopt
    kind: act
    parameters:
      tool: adopt
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
  - id: read-acceptance
    kind: act
    parameters: { observes: acceptanceRecord }
  - id: check-artifact-ready
    kind: judge
    parameters: { rules: [artifact-ready] }

  # 8. Residual, experience, next decision and its routing.
  - id: residual
    kind: act
    parameters:
      tool: residual
      arguments:
        ANALYSIS_CONTRACT: { from: input, name: analysisContract }
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }
  - id: record-experience
    kind: act
    parameters: { tool: record-experience }
  - id: decide-next
    kind: act
    parameters: { workshop: evaluate-next-investment }
  - id: read-next-decision
    kind: act
    parameters: { observes: nextDecision }
  - id: check-next-decision
    kind: judge
    parameters: { rules: [request-admissible, request-checked] }
  - id: revisit-next-decision
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: check-continue
    kind: judge
    parameters: { rules: [continue-or-wait] }

  - id: reread-next-decision-observe
    kind: act
    parameters: { observes: nextDecision }
  - id: route-observe
    kind: judge
    parameters: { rules: [next-action-observe, continue-or-wait] }
  - id: revisit-observe
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: reread-next-decision-research
    kind: act
    parameters: { observes: nextDecision }
  - id: route-research
    kind: judge
    parameters: { rules: [next-action-research, continue-or-wait] }
  - id: revisit-research
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: reread-next-decision-compose
    kind: act
    parameters: { observes: nextDecision }
  - id: route-compose
    kind: judge
    parameters: { rules: [next-action-compose, continue-or-wait] }
  - id: revisit-compose
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: reread-next-decision-revise
    kind: act
    parameters: { observes: nextDecision }
  - id: route-revise
    kind: judge
    parameters: { rules: [next-action-revise, continue-or-wait] }
  - id: revisit-revise
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: reread-next-decision-implement
    kind: act
    parameters: { observes: nextDecision }
  - id: route-implement
    kind: judge
    parameters: { rules: [next-action-implement, continue-or-wait] }
  - id: revisit-implement
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }

  # 9. Earlier APR: full-flow only, re-checked on a fresh readiness reading; apr-prepare takes the
  #    stage from the admitted next-decision, and the stage run joins the implement chain at extract
  #    (same refresh, evaluation, judges and adoption), so the revisit enters through the same
  #    refresh-budget gate as implement before apr-prepare.
  - id: route-earlier-apr
    kind: judge
    parameters: { rules: [next-action-earlier-apr, continue-or-wait] }
  - id: reread-readiness
    kind: act
    parameters: { observes: inputReadiness }
  - id: check-apr-scope
    kind: judge
    parameters: { rules: [lifecycle-available, inputs-ready] }
  - id: revisit-earlier-apr
    kind: explore
    parameters: { chooser: atcs-revisit, bind: { paths: 1000 } }
  - id: read-refresh-budget-apr
    kind: act
    parameters: { observes: workingState }
  - id: check-refresh-budget-apr
    kind: judge
    parameters:
      rules: [refresh-budget]
      bind: { max_physical_refreshes: { from: goal, name: max_physical_refreshes } }
  - id: apr-prepare
    kind: act
    parameters: { tool: apr-prepare }
  - id: apr-run
    kind: act
    parameters:
      tool: apr-run
      arguments:
        SITE_CAPABILITIES: { from: input, name: siteCapabilities }

  # Goal met: every final rule again, over fresh readings of the current acceptance record and final
  # evaluation, so the gate cites this Generation's readings even after a revisit.
  - id: route-goal-met
    kind: judge
    parameters: { rules: [next-action-goal-met, continue-or-wait] }
  - id: reread-acceptance
    kind: act
    parameters: { observes: acceptanceRecord }
  - id: reread-final-evaluation
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-coverage
    kind: judge
    parameters: { rules: [final-evidence-ready-coverage, final-evidence-ready-identity] }
  - id: reread-final-evaluation-identity
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-identity
    kind: judge
    parameters: { rules: [final-evidence-ready-identity, final-evidence-ready-coverage] }
  - id: reread-final-evaluation-failures
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-constraint-failures
    kind: judge
    parameters: { rules: [required-constraints-pass-failures, required-constraints-pass-unknowns] }
  - id: reread-final-evaluation-unknowns
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-constraint-unknowns
    kind: judge
    parameters: { rules: [required-constraints-pass-unknowns, required-constraints-pass-failures] }
  - id: reread-final-evaluation-setup
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-setup
    kind: judge
    parameters:
      rules: [setup-goal, hold-goal]
      bind:
        target_setup_wns_ns: { from: goal, name: target_setup_wns_ns }
        target_hold_wns_ns: { from: goal, name: target_hold_wns_ns }
  - id: reread-final-evaluation-hold
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-hold
    kind: judge
    parameters:
      rules: [hold-goal, setup-goal]
      bind:
        target_setup_wns_ns: { from: goal, name: target_setup_wns_ns }
        target_hold_wns_ns: { from: goal, name: target_hold_wns_ns }
  - id: reread-final-evaluation-artifact
    kind: act
    parameters: { observes: finalEvaluation }
  - id: gm-artifact
    kind: judge
    parameters: { rules: [artifact-ready, final-evidence-ready-coverage] }
  - id: reread-final-evaluation-gate
    kind: act
    parameters: { observes: finalEvaluation }
  - id: goal-met-gate
    kind: judge
    parameters:
      rules:
        - final-evidence-ready-coverage
        - setup-goal
        - hold-goal
        - final-evidence-ready-identity
        - required-constraints-pass-failures
        - required-constraints-pass-unknowns
        - artifact-ready
      bind:
        target_setup_wns_ns: { from: goal, name: target_setup_wns_ns }
        target_hold_wns_ns: { from: goal, name: target_hold_wns_ns }
  - id: close-on-goal
    kind: explore
    parameters: { chooser: atcs-goal-met, bind: { paths: 1000 } }

  # The one wait node: missing minimum inputs (inputs-ready FAIL), a next decision requiring an
  # external input/scope/capability (continue-or-wait FAIL), the Run's max_physical_refreshes
  # spent (refresh-budget FAIL), and every UNDETERMINED verdict. It has no outgoing edge, so a
  # person clearing it ends the Run.
  - id: wait-for-person
    kind: wait
    parameters: { blocker: scope-or-input-required }

edges:
  - { from: bind-inputs, to: read-readiness }
  - { from: read-readiness, to: check-inputs }
  - { from: check-inputs, to: baseline, outcome: PASS }
  - { from: check-inputs, to: wait-for-person, outcome: FAIL }
  - { from: baseline, to: observe-baseline }
  - { from: observe-baseline, to: policy }
  - { from: policy, to: physical-baseline }
  - { from: physical-baseline, to: risk-baseline }
  - { from: risk-baseline, to: residual-baseline }
  - { from: residual-baseline, to: decide-next }

  - { from: diagnose, to: read-observation-request }
  - { from: read-observation-request, to: check-observation-request }
  - { from: check-observation-request, to: observe-query, outcome: PASS }
  - { from: check-observation-request, to: retry-diagnose, outcome: FAIL }
  - { from: retry-diagnose, to: diagnose, revisit: true }
  - { from: observe-query, to: risk-query }
  - { from: risk-query, to: bind-worker-slots }
  - { from: bind-worker-slots, to: plan }

  - { from: plan, to: read-campaign-plan }
  - { from: read-campaign-plan, to: check-campaign-plan }
  - { from: check-campaign-plan, to: prepare-workers, outcome: PASS }
  - { from: check-campaign-plan, to: decide-next, outcome: FAIL }
  - { from: prepare-workers, to: research-worker-01 }
  - { from: prepare-workers, to: research-worker-02 }
  - { from: prepare-workers, to: research-worker-03 }
  - { from: prepare-workers, to: research-worker-04 }
  - { from: prepare-workers, to: research-worker-05 }
  - { from: prepare-workers, to: research-worker-06 }

  - { from: research-worker-01, to: read-worker-request-01 }
  - { from: read-worker-request-01, to: operate-worker-01 }
  - { from: operate-worker-01, to: capture-worker-01 }
  - { from: capture-worker-01, to: read-worker-result-01 }
  - { from: read-worker-result-01, to: check-worker-results }
  - { from: research-worker-02, to: read-worker-request-02 }
  - { from: read-worker-request-02, to: operate-worker-02 }
  - { from: operate-worker-02, to: capture-worker-02 }
  - { from: capture-worker-02, to: read-worker-result-02 }
  - { from: read-worker-result-02, to: check-worker-results }
  - { from: research-worker-03, to: read-worker-request-03 }
  - { from: read-worker-request-03, to: operate-worker-03 }
  - { from: operate-worker-03, to: capture-worker-03 }
  - { from: capture-worker-03, to: read-worker-result-03 }
  - { from: read-worker-result-03, to: check-worker-results }
  - { from: research-worker-04, to: read-worker-request-04 }
  - { from: read-worker-request-04, to: operate-worker-04 }
  - { from: operate-worker-04, to: capture-worker-04 }
  - { from: capture-worker-04, to: read-worker-result-04 }
  - { from: read-worker-result-04, to: check-worker-results }
  - { from: research-worker-05, to: read-worker-request-05 }
  - { from: read-worker-request-05, to: operate-worker-05 }
  - { from: operate-worker-05, to: capture-worker-05 }
  - { from: capture-worker-05, to: read-worker-result-05 }
  - { from: read-worker-result-05, to: check-worker-results }
  - { from: research-worker-06, to: read-worker-request-06 }
