schema: hima-flow/1
id: agentic-timing-closure-system
version: 0.4.4
flow:
  kind: sequence
  id: timing-closure
  steps:
  - kind: task
    id: prepare-inputs
    tool: prepare-inputs
    inputs:
      DESIGN_STATE_MANIFEST:
        source: runInput
        path:
        - designStateManifest
      SITE_CAPABILITIES:
        source: runInput
        path:
        - siteCapabilities
      NATIVE_TIMING_CONTEXT:
        source: runInput
        path:
        - nativeTimingContext
    contract:
      input:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/prepare-inputs-input
      output:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/prepare-inputs-output
  - kind: task
    id: prepare-baseline
    tool: prepare-baseline
    inputs:
      DESIGN_STATE_MANIFEST:
        source: committedOutput
        taskId: prepare-inputs
        path:
        - DESIGN_STATE_MANIFEST
      SITE_CAPABILITIES:
        source: committedOutput
        taskId: prepare-inputs
        path:
        - SITE_CAPABILITIES
      NATIVE_TIMING_CONTEXT:
        source: committedOutput
        taskId: prepare-inputs
        path:
        - NATIVE_TIMING_CONTEXT
      NATIVE_REPORT_PATHS:
        source: strategy
        path:
        - nativeReportPaths
    contract:
      input:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/prepare-baseline-input
      output:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/prepare-baseline-output
  - kind: task
    id: fix-timing
    tool: fix-timing
    inputs:
      SITE_CAPABILITIES:
        source: committedOutput
        taskId: prepare-baseline
        path:
        - SITE_CAPABILITIES
      NATIVE_TIMING_CONTEXT:
        source: committedOutput
        taskId: prepare-baseline
        path:
        - NATIVE_TIMING_CONTEXT
      TARGET_SETUP_NS:
        source: goal
        path:
        - target_setup_wns_ns
      TARGET_HOLD_NS:
        source: goal
        path:
        - target_hold_wns_ns
    contract:
      input:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/fix-timing-input
      output:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/fix-timing-output
  - kind: task
    id: evaluate-timing
    budget: closing
    tool: evaluate-timing
    inputs:
      READER_VALUE:
        source: committedOutput
        taskId: fix-timing
        path: []
      DOMAIN_REPORT:
        source: artifactRef
        taskId: fix-timing
        name: domain-report
      TARGET_SETUP_NS:
        source: goal
        path:
        - target_setup_wns_ns
      TARGET_HOLD_NS:
        source: goal
        path:
        - target_hold_wns_ns
    contract:
      input:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/evaluate-timing-input
      output:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/evaluate-timing-output
  - kind: task
    id: deliver
    budget: closing
    tool: deliver
    inputs:
      EVALUATION:
        source: committedOutput
        taskId: evaluate-timing
        path: []
      DOMAIN_REPORT:
        source: artifactRef
        taskId: fix-timing
        name: domain-report
    contract:
      input:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/deliver-input
      output:
        version: '1'
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          $ref: schemas/tasks.json#/$defs/deliver-output
