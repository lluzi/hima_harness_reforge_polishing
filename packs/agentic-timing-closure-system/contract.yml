id: agentic-timing-closure-system
version: "0.1.0"
title: Agentic timing closure system
status: development
minimumHarnessVersion: 0.1.0

ontology:
  aliases:
    contribution: [ECO contribution, worker contribution]
    campaign: [closure campaign, timing closure campaign]
    batch: [integration batch, merge batch]

# SPEC "Run contract" Budget: a finite Site default the user may override; the Pack never widens it.
# The Run's budget ending is the Runtime's own (SPEC Endings); no converge block exists anywhere.
budget:
  timeBoxMs: 86400000
  closingReserveMs: 1800000

inputs:
  - name: designStateManifest
    description: >-
      JSON manifest of the recoverable Innovus starting state: top, stage, database (.enc and .enc.dat),
      netlist, DEF, per-corner SPEF, SDC list, tool versions, scenarios, and the optional full-flow
      lifecycle index. Read by bind-inputs (M1 input_readiness) and baseline (M1 design_state).
  - name: analysisContract
    description: >-
      Read-only directory of the fixed analysis contract, one JSON document per concern, read by the
      tools at fixed names: query-spec.json (final PBA/coverage query: precision, requiredScenarios,
      nworst; maxPaths comes from the Strategy), scenario-corners.json ({scenario: RC corner}),
      corners.json ({"corners": [...]}), sdc.json ({"sdc": [...]}), recheck.json, policy.json (the static acceptance terms only:
      allowDegradedWorking, degradeLimitNs, maxNewConstraintFailures, scenarioCorners,
      requiredScenarios; the policy tool refuses a file setting goal or a run-time field),
      baseline-verify-drc.rpt and baseline-verify-connectivity.rpt (starting-state physical reports).
      The model never writes it.
  - name: siteCapabilities
    description: >-
      Site-owned JSON of qualified capabilities and bindings: edaShell (the Site's EDA launch prefix
      every EDA-launching subcommand runs through), design, techLef, cellLefGlob (XTop session
      inputs), pgVerification (whether PG-local edits are admissible) and the declared lifecycle
      capability. Read as siteCapabilities, siteProfile and edaProfile by atcs_cli.py.
  - name: workspaceRoot
    description: Campaign-private output root the Site Permit allows; every Campaign workspace lies under it.

outputs:
  - name: inputReadiness
    path: state/readiness.json
    reader: atcs-readiness
    description: M1 input-readiness (post-route minimum inputs, strict full-flow/post-route-only scope, lifecycle availability).
  - name: baselineState
    path: state/baseline.json
    description: M1 design-state of the starting database, fixed for the whole Campaign (policy anchor).
  - name: workingState
    path: state/working-state.json
    description: >-
      The design-state every batch is based on: seeded from the baseline by baseline, rewritten by
      adopt whenever the working pointer moves to an adopted candidate.
  - name: acceptancePolicy
    path: state/policy.json
    description: >-
      Stamped acceptance policy: the Site's static terms, the Run's Goal targets, and the baseline
      state id, baseline minimum WNS and Campaign root composed by the policy tool.
  - name: currentObservations
    path: state/observation.json
    description: M1 observation-set of the latest PT observation (baseline or query); raw reports stay under research/observe/.
  - name: baselinePhysical
    path: state/baseline-physical.json
    description: Starting-state DRC/connectivity report text the final evaluation compares candidate physical checks against.
  - name: riskAtlas
    path: state/risk.json
    description: M1 check-comparison of the previous observation against the current one (fixed/remaining/entrant/regressed/missing-prior).
  - name: observationRequest
    path: research/requests/observation-request.json
    reader: atcs-observation-request
    description: The diagnose Workshop's bounded PT query request; its shape is the observe tool's query spec.
  - name: campaignPlan
    path: research/requests/campaign-plan.json
    reader: atcs-campaign-plan
    description: >-
      The plan Workshop's one campaign-plan document, holding all three slot work packages under
      candidate.workPackages (with baseState and siteCapabilities alongside, for the Reader's own
      validation) and nowhere else. The campaign-plan Reader admits candidate.workPackages, and
      prepare-workers reads that exact same field; a top-level workPackages key is refused
      (ambiguous-plan) if present at all, since a second copy is never allowed to exist.
  - name: workerManifests
    path: state/workers.json
    description: M2 prepared private workspaces of the three worker slots (roots, name prefixes, session Tcl, ops logs).
  - name: workerRequest01
    path: research/requests/worker-request-w01.json
    reader: atcs-worker-request-01
    description: Slot w01's research request in the worker-request read envelope.
  - name: workerRequest02
    path: research/requests/worker-request-w02.json
    reader: atcs-worker-request-02
    description: Slot w02's research request in the worker-request read envelope.
  - name: workerRequest03
    path: research/requests/worker-request-w03.json
    reader: atcs-worker-request-03
    description: Slot w03's research request in the worker-request read envelope.
  - name: workerResult01
    path: state/contribution-w01.json
    reader: atcs-worker-result-01
    description: Slot w01's sealed M3 Contribution.
  - name: workerResult02
    path: state/contribution-w02.json
    reader: atcs-worker-result-02
    description: Slot w02's sealed M3 Contribution.
  - name: workerResult03
    path: state/contribution-w03.json
    reader: atcs-worker-result-03
    description: Slot w03's sealed M3 Contribution.
  - name: contributionIndex
    path: state/contributions-collected.json
    reader: atcs-contribution-index
    description: Every sealed Contribution plus the slots still pending; a batch does not wait for all of them.
  - name: compositionFacts
    path: state/composition-facts.json
    reader: atcs-composition-facts
    description: M4 duplicates, conflicts, interactions, stale bases and replay order of the collected Contributions.
  - name: integrationPlan
    path: research/requests/integration-plan.json
    reader: atcs-integration-plan
    description: >-
      The compose Workshop's integration plan in the integration-plan read envelope ({plan, facts});
      compose-facts (second pass), replay-prepare and record-experience read this same file.
  - name: replayRequest
    path: state/replay-request.json
    description: M5 replay request (batch id, common base, ordered steps with their XTop Tcl).
  - name: integrationState
    path: state/integration-state.json
    reader: atcs-integration-state
    description: M5 reconciled replay (applied, failed, pending, replay mismatches, out-of-scope edits).
  - name: precheckEvidence
    path: state/presta.json
    reader: atcs-precheck-evidence
    description: Stamped cheap pre-check evidence binding the batch's new nets to the SPEF net-name source.
  - name: mergeCommit
    path: state/merge-commit.json
    description: M5 sealed batch relative to its common parent state (operations, Innovus ECO Tcl, source map).
  - name: implementation
    path: state/implement.json
    description: >-
      Implementation receipt of the current candidate (database, netlist, DEF, DRC and connectivity
      report identities, parent state), written by implement or, on the earlier-apr route, apr-run.
  - name: extraction
    path: state/extract.json
    description: StarRC SPEF identities per corner for the implemented candidate.
  - name: finalTiming
    path: state/sta.json
    description: Per-scenario PT receipts and the implemented candidate's design-state id.
  - name: refreshLedger
    path: state/refresh-ledger.json
    description: atcs.refresh ledger of completed full physical refreshes (one entry per merge commit).
  - name: physicalDelta
    path: state/physical.json
    description: Candidate DRC/connectivity report text the final evaluation compares against baselinePhysical.
  - name: finalEvaluation
    path: state/evaluation.json
    reader: atcs-evaluation
    description: M6 evaluation of one candidate; the model never writes its measurements.
  - name: statePointers
    path: state/pointers.json
    description: M7 workingState, bestVerifiedState and deliveryState pointers with their history.
  - name: acceptanceRecord
    path: accepted/latest.json
    reader: atcs-acceptance-record
    description: Envelope naming the latest M7 acceptance record and the refresh ledger by workspace path.
  - name: residualCases
    path: state/residual-cases.json
    description: >-
      Residual cases of the checks still failing (PT path-detail evidence, attempts, limits, suggested
      stage), from the current evaluation or, before any, from the current observation.
  - name: aprTask
    path: state/apr-task.json
    description: >-
      The prepared single APR stage task (full-flow only) for the stage the admitted next-decision
      names; apr-run executes it.
  - name: campaignExperience
    path: state/experience.json
    description: M8 append-only experience entries (hypothesis, action, conditions, predicted, measured, verdict).
  - name: nextDecision
    path: research/requests/next-decision.json
    reader: atcs-next-decision
    description: The next-investment Workshop's decision; tc_next_action encodes its action for the routing Judges.

environment:
  wrappers:
    - python3
    - /usr/bin/python3
    - /data/eda/project/hima_harness/operator-admin/atcs-v1/atcs-xtop-operator.sh

workspace:
  source: pack
  copy:
    - atcs_cli.py
    - atcs
    - templates

tools:
  - id: bind-inputs
    file: flow/atcs_cli.py
    description: Bind and verify the declared inputs; decide full-flow or post-route-only (M1 input_readiness).
    inputs: [WORKSPACE, DESIGN_STATE_MANIFEST, SITE_CAPABILITIES]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', bind-inputs, '${WORKSPACE}', '${DESIGN_STATE_MANIFEST}', '${SITE_CAPABILITIES}']

  - id: baseline
    file: flow/atcs_cli.py
    description: Build the starting design-state from the manifest (M1 design_state).
    inputs: [WORKSPACE, DESIGN_STATE_MANIFEST]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', baseline, '${WORKSPACE}', '${DESIGN_STATE_MANIFEST}']

  - id: observe-baseline
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Run the four required PT scenarios on the starting state and capture the baseline observation.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES, MAX_PATHS]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - observe
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/query-spec.json
      - ${SITE_CAPABILITIES}
      - ${ANALYSIS_CONTRACT}/scenario-corners.json
      - ${MAX_PATHS}

  - id: policy
    file: flow/atcs_cli.py
    description: >-
      Compose the stamped acceptance policy from the Site's static terms, the Run's Goal targets and
      the baseline state and observation; refuses a static file that sets a Goal or run-time field.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, TARGET_SETUP_NS, TARGET_HOLD_NS]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - policy
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}
      - ${TARGET_SETUP_NS}
      - ${TARGET_HOLD_NS}

  - id: observe-query
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Run the admitted observation request as PT scenario queries and capture the new observation.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES, MAX_PATHS]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - observe
      - ${WORKSPACE}
      - ${WORKSPACE}/research/requests/observation-request.json
      - ${SITE_CAPABILITIES}
      - ${ANALYSIS_CONTRACT}/scenario-corners.json
      - ${MAX_PATHS}

  - id: physical-baseline
    file: flow/atcs_cli.py
    description: Package the starting state's DRC/connectivity reports for the final evaluation's comparison.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - physical
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/baseline-verify-drc.rpt
      - ${ANALYSIS_CONTRACT}/baseline-verify-connectivity.rpt
      - baseline

  - id: risk
    file: flow/atcs_cli.py
    description: >-
      Compare the previous observation with the current one into the risk atlas (M1 compare_checks);
      the Campaign's first observation is compared with itself.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - risk
      - ${WORKSPACE}
      - ${WORKSPACE}/state/observation-prev.json
      - ${WORKSPACE}/state/observation.json
      - ${ANALYSIS_CONTRACT}/recheck.json

  - id: prepare-workers
    file: flow/atcs_cli.py
    description: Validate the three slot work packages and prepare each slot's private workspace and XTop session Tcl (M2).
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - prepare-workers
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}
      - ${SITE_CAPABILITIES}
      - ${WORKSPACE}/research/requests/campaign-plan.json

  - id: xtop-operator
    recommendedVersion: XTop 2025.09.tmp15
    file: flow/templates/xtop-operator.tcl
    description: >-
      One worker slot's qualified XTop Operator session in its private workspace, driven only through
      the typed atcs_* procedures; every mutation is gated by the slot's edit domain and logged to its
      ops.jsonl. Interactive only: there is no batch path.
    inputs: [WORKSPACE, SLOT]
    licences: { xtop: 1 }
    interactive:
      mode: interactive-only
      adapter: hima-tcl-line-v1
      argv: [/data/eda/project/hima_harness/operator-admin/atcs-v1/atcs-xtop-operator.sh, '${WORKSPACE}', '${SLOT}']
      commands:
        read: [atcs_query_paths, atcs_query_cells]
        mutate: [atcs_size_cell, atcs_insert_buffer, atcs_delete_buffer]
        save: [atcs_dump_cells, atcs_export_changes]
        close: [atcs_close]
    argv: [/data/eda/project/hima_harness/operator-admin/atcs-v1/atcs-xtop-operator.sh, '${WORKSPACE}', '${SLOT}']

  - id: capture-contribution
    file: flow/atcs_cli.py
    description: >-
      Seal one slot's actual tool work into a Contribution (M3 seal), composed from state/workers.json
      and the slot's own workspace (before.dump, after.dump, ops.jsonl, optional summary.json).
    inputs: [WORKSPACE, SLOT]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', capture-contribution, '${WORKSPACE}', '${SLOT}']

  - id: collect
    file: flow/atcs_cli.py
    description: Collect every sealed Contribution so far and the slots still pending.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', collect, '${WORKSPACE}']

  - id: compose-facts
    file: flow/atcs_cli.py
    description: >-
      Deterministic composition facts over the collected Contributions (M4 analyze): with no
      resolutions before the compose Workshop, and with the admitted integration plan's resolutions
      on the second pass.
    inputs: [WORKSPACE]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - compose-facts
      - ${WORKSPACE}
      - ${WORKSPACE}/research/requests/integration-plan.json

  - id: replay-prepare
    recommendedVersion: XTop 2025.09.tmp15
    file: flow/atcs_cli.py
    description: Validate the integration plan, prepare the replay request and replay its steps in XTop from the common base (M5).
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    licences: { xtop: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - replay-prepare
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${WORKSPACE}/research/requests/integration-plan.json
      - ${SITE_CAPABILITIES}

  - id: reconcile
    file: flow/atcs_cli.py
    description: >-
      Reconcile replay receipts against expected deltas and each slot's admitted edit domain from
      state/workers.json (M5 reconcile).
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', reconcile, '${WORKSPACE}']

  - id: presta
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Cheap PT pre-check of the batch and its RC-qualification evidence for new nets.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - presta
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${ANALYSIS_CONTRACT}/scenario-corners.json
      - ${SITE_CAPABILITIES}

  - id: implement
    recommendedVersion: Innovus 23.14
    file: flow/atcs_cli.py
    description: Seal the merge commit and implement it once in Innovus, exporting DB, DEF and netlist.
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    licences: { innovus: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - implement
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}

  - id: extract
    recommendedVersion: StarRC X-2025.06-SP1
    file: flow/atcs_cli.py
    description: Extract every declared RC corner of the implemented DEF in a private work directory.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { starrc: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - extract
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/corners.json
      - ${SITE_CAPABILITIES}

  - id: sta
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Final STA of every required scenario on the new SPEF; records one completed physical refresh.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - sta
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/query-spec.json
      - ${ANALYSIS_CONTRACT}/sdc.json
      - ${ANALYSIS_CONTRACT}/scenario-corners.json
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}

  - id: physical-candidate
    file: flow/atcs_cli.py
    description: >-
      Package the current candidate's DRC/connectivity reports for the final evaluation, re-hashing
      the identities state/implement.json records.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', physical, '${WORKSPACE}', candidate]

  - id: evaluate
    file: flow/atcs_cli.py
    description: Plan the required checks and assemble the candidate's evaluation (M6).
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', evaluate, '${WORKSPACE}', '${WORKSPACE}/state/policy.json']

  - id: adopt
    file: flow/atcs_cli.py
    description: >-
      Publish the evaluation against the stamped policy and the current working state, move the
      working/best/delivery pointers (M7) and, when working moves, rewrite state/working-state.json.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', adopt, '${WORKSPACE}', '${WORKSPACE}/state/policy.json']

  - id: residual
    file: flow/atcs_cli.py
    description: >-
      Extract residual cases for the checks still failing (the evaluated candidate's, or the current
      observation's before any evaluation), with bounded PT path-detail queries on the working state.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - residual
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/scenario-corners.json
      - ${SITE_CAPABILITIES}

  - id: record-experience
    file: flow/atcs_cli.py
    description: >-
      Append the evaluated candidate's predicted and measured change against its parent state to the
      Campaign experience (M8), composed from state files; the hypothesis is the reason of whatever
      produced state/implement.json (the integration plan for a batch, the next-decision for an
      apr-run candidate).
    inputs: [WORKSPACE]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - record-experience
      - ${WORKSPACE}
      - ${WORKSPACE}/research/requests/integration-plan.json

  - id: apr-prepare
    file: flow/atcs_cli.py
    description: >-
      Compile residual cases into one bounded APR stage intervention task for the stage named by the
      admitted earlier-apr next-decision (full-flow only; refused for post-route-only).
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', apr-prepare, '${WORKSPACE}']

  - id: apr-run
    recommendedVersion: Innovus 23.14
    file: flow/atcs_cli.py
    description: >-
      Run the prepared APR stage task in Innovus, export the stage's database, DEF, netlist and physical
      reports, and write the same implementation receipt implement writes.
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    licences: { innovus: 1 }
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', apr-run, '${WORKSPACE}', '${SITE_CAPABILITIES}']

rules:
  - inputs-ready
  - lifecycle-available
  - request-admissible
  - request-checked
  - composition-ready
  - replay-consistent-mismatch
  - replay-consistent-scope
  - presta-model-qualified
  - final-evidence-ready-coverage
  - final-evidence-ready-identity
  - required-constraints-pass-failures
  - required-constraints-pass-unknowns
  - setup-goal
  - hold-goal
  - artifact-ready
  - continue-or-wait
  - next-action-observe
  - next-action-research
  - next-action-compose
  - next-action-revise
  - next-action-implement
  - next-action-earlier-apr
  - next-action-goal-met

goal:
  target_setup_wns_ns: { type: number, unit: ns, min: 0, max: 1, default: 0 }
  target_hold_wns_ns: { type: number, unit: ns, min: 0, max: 1, default: 0 }

strategy:
  maxPaths: { type: number, unit: paths, min: 100, max: 5000, default: 1000 }

words:
  target_setup_wns_ns: { label: target setup WNS, unit: ns }
  target_hold_wns_ns: { label: target hold WNS, unit: ns }
  maxPaths: { label: max paths per scenario query, unit: paths }

knowledge:
  - file: method-and-benchmark.md
    purpose: The confirmed business scope, the B_lazy comparison and the collaborative-merge method, so the Campaign does not collapse into a linear fix loop.
  - file: state-and-evidence.md
    purpose: States, coverage, precision, working/best/delivery and unknown, and which evidence may not be mixed.
  - file: observation-strategy.md
    purpose: GBA/PBA, path breadth and diversity, Nworst/max_paths and query cost, to decide what to observe next and when to stop.
  - file: mechanisms-and-falsifiers.md
    purpose: Cell, net, clock, SI and spatial root causes with their falsifiers and joint windows, for decomposition and real trials.
  - file: xtop-capabilities.md
    purpose: The XTop queries, attributes, manual/auto modes and the typed atcs_* procedures a worker session may use.
  - file: contribution-and-merge.md
    purpose: Base-relative changes, dependencies and atomic groups, rebase and recovery, for composing complementary Contributions.
  - file: cheap-verification.md
    purpose: When a PT pre-check is applicable, why new nets without RC are unqualified, and when a controlled physical trial is worth it.
  - file: innovus-stage-interventions.md
    purpose: The verified stage hooks and read-backs that turn a residual case into one bounded APR stage request.
  - file: lifecycle-and-input-modes.md
    purpose: The strict full-flow/post-route-only scopes, lifecycle completeness and when an earlier APR stage is justified.
  - file: experience-transfer.md
    purpose: Success and failure conditions, predicted versus measured, and version/region applicability of recorded experience.

workshops:
  - id: diagnose-and-observe
    purpose: >-
      Diagnose the current timing problem from the declared baseline state, current observation, risk
      atlas and experience: name the competing root causes and the cheapest query that separates them.
      Write the observation request to research/requests/observation-request.json as one JSON object
      {designStateId, precision (gba|pba), requiredScenarios, maxPaths, nworst} naming the working
      design-state it observes; the Run's maxPaths Strategy knob caps the value the observe tool
      uses; the tool builds every scenario's PT inputs from the working state itself. Every required scenario stays in the request; the request never
      changes frequency, exceptions or required checks. It is a plan, not a measurement.
    directory: research/diagnose
    entry: entry.py
    language: python
    reads: [workingState, inputReadiness, currentObservations, riskAtlas, campaignExperience, statePointers]
    knowledge: [observation-strategy.md, mechanisms-and-falsifiers.md, state-and-evidence.md, experience-transfer.md]
    produces: observationRequest
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: plan-campaign
    purpose: >-
      Decompose the current problem into exactly three bounded worker work packages (taskId w01, w02,
      w03), each against the baseline design-state: problem, target check keys, edit domain, protected
      objects, may-affect checks, admissible actions (size_cell, insert_buffer, delete_buffer, and
      pg_local_adjust only when siteCapabilities.pgVerification is true) and budget, all against the
      working design-state (workingState). Write one document, research/requests/campaign-plan.json:
      {candidate: {workPackages: {w01, w02, w03}, reason}, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. There is exactly one copy of workPackages, under
      candidate; never repeat it at the top level. The Reader admits candidate.workPackages, and
      prepare-workers prepares that same field. Do not repeat a failed trial without new evidence; a slot with nothing
      worth researching still gets a bounded package whose diagnosis-only outcome is a valid no-fix.
    directory: research/plan
    entry: entry.py
    language: python
    reads: [workingState, inputReadiness, currentObservations, riskAtlas, contributionIndex, campaignExperience, statePointers]
    knowledge: [method-and-benchmark.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, xtop-capabilities.md]
    produces: campaignPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

