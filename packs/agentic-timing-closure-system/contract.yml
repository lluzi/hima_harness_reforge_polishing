      Build the envelope in entry.py from those files, not by typing JSON by hand, and check it before
      writing. The Pack's flow copy is importable from the workspace; entry.py can build and check the
      candidate like this:
          import json, os, sys
          workspace, slot = sys.argv[1], "w06"
          sys.path.insert(0, os.path.join(workspace, "flow"))
          from atcs import workspaces
          def load(*parts):
              with open(os.path.join(workspace, *parts)) as handle:
                  return json.load(handle)
          working = load("state", "working-state.json")
          prepared = load("state", "workers.json")["workers"][slot]["workPackage"]
          candidate = {key: value for key, value in prepared.items() if key not in ("schema", "id")}
          site_capabilities = load("research", "requests", "campaign-plan.json")["siteCapabilities"]
          workspaces.validate_work_package(candidate, working, site_capabilities)  # raises, listing every problem
          assert workspaces.bound_view(candidate) == workspaces.bound_view(prepared)
      Never write a request that fails this check.

      Read knowledge example-worker-request.md: it holds admitted requests for an active slot, for an
      active slot with no safe move and for a parked slot; for this slot change their taskId to w06
      and only the values. When research finds no safe move for an active slot, never invent one
      and never write a placeholder command: state why in noSafeAction and leave sessionPlan empty.
    directory: research/worker-06
    entry: entry.py
    language: python
    reads: [workingState, workerManifests, campaignPlan, currentObservations, riskAtlas, campaignExperience, workerResult06, residualCases, workerRequest06Problems]
    knowledge: [xtop-capabilities.md, xtop-expert-operator.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, cheap-verification.md, experience-transfer.md, example-worker-request.md, endpoint-resolution.md]
    produces: workerRequest06
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']
    revision: { refusedWhen: tc_request_invalid_count, problems: workerRequest06Problems }

  - id: compose-contributions
    purpose: >-
      After a refusal, read output integrationPlanProblems first: the Reader wrote there, one line per problem,
      what it refused in your last integration-plan.json and the format each field needs; fix every line and write
      the whole document again.
      Compose the current batch from the ready Contributions and the deterministic composition facts:
      select, order, drop duplicates and resolve each conflict locally (keep, drop, or revise with a
      re-sealed revisedContribution); defer what is not worth waiting for. Write one file,
      research/requests/integration-plan.json, as {plan: {batchId, baseStateId, select, resolutions,
      deferred, reason}, facts: <the stamped compositionFacts>}. Never split an atomic group without a record;
      an empty select needs a stated waiting-value reason. Copy the shape of knowledge
      example-integration-plan.md and change only the values: a resolution only for a facts.conflicts
      key, exactly {conflictKey, decision}.
    directory: research/compose
    entry: entry.py
    language: python
    reads: [contributionIndex, compositionFacts, integrationState, campaignPlan, campaignExperience, integrationPlanProblems]
    knowledge: [contribution-and-merge.md, cheap-verification.md, method-and-benchmark.md, example-integration-plan.md]
    produces: integrationPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']
