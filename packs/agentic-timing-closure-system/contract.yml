workshops:
  - id: plan-campaign
    purpose: >-
      After a refusal, read output campaignPlanProblems first: the Reader wrote there, one line per problem,
      what it refused in your last campaign-plan.json and the format each field needs; fix every line and write
      the whole document again. Its Advice lines, after the counted ones, never refuse the plan: weigh them.
      Decompose the current problem into blocker clusters for the six worker slots w01..w06, blockers
      first, all against the working design-state (workingState). The slots run at once as parallel
      fork branches from the same base, each an XTop expert Team working one cluster. Read
      state/worker-slots.json (workerSlotPolicy): slots up to workerSlots may be active and every slot
      above workerSlots must be parked. Blockers first: the worst setup check and the worst hold check
      of every required scenario in the current observation (state/observation.json; the most negative
      known slack per scenario and mode) must each be covered by some active slot: its endpoint pin
      (the check key's, or PT's raw endpoint for a key <pin>@<group>) in the slot's targetPins, or,
      for a check ending at a top-level port, its check key in the slot's targets. The worst clusters
      take the lowest slots. Then fill the seats: while any violating check of a required scenario is
      covered by no active slot, every slot up to workerSlots works a cluster. After the worst checks,
      take the next worst violating checks (the checks of state/observation.json by slack, and the
      cases of state/residual-cases.json), resolve their endpoints, and give each seat one cluster whose
      leaf cells no other active slot claims; a check whose cells an active slot already holds goes into
      that slot's targets. Treatment attempt 1 made three clusters from the scenarios' single worst
      checks and parked three of six seats while many disjoint checks violated; the Reader never refuses
      a parked seat, but names each with the worst uncovered check in an advice line. Active slots share
      no instance: an instance in one active slot's
      editDomain.instances, or owning one of its targetPins, is in no other active slot's domain or
      target pins. Active slots also share no edit-domain net: a net in one active slot's
      editDomain.nets is in no other's. Read the prior batch's XTop fail reasons after auto-finish
      (state/residual-cases.json, batchFailReasons and each case's failReasons): the clusters plain
      auto-fix could not fix, and why, are the expert slots' work. The first generation has no
      evaluated batch, so it carries no batchFailReasons: plan from the observation's blockers; the
      missing fail reasons are no reason to park. A slot is parked only above workerSlots, or when every
      violating check of a required scenario is covered: its branch runs as a no-op and seals a parked
      no-fix. Write one document, research/requests/campaign-plan.json, in exactly the shape of knowledge
      example-campaign-plan.md. There is exactly one copy of workPackages, under candidate; never repeat it at the
      top level. The Reader admits candidate.workPackages, and prepare-workers prepares that same field.
      The Reader refuses a plan whose current observation is not of the working state, so observe again
      after the working state moves. Do not repeat a failed trial without new evidence.

      Checklist. The campaign-plan Reader counts one problem for every breach, and a single problem
      refuses the plan:
        1. candidate.workPackages has exactly the keys w01, w02, w03, w04, w05 and w06, and each
           package's taskId is exactly its key: "w01", never a description such as "w01-setup+hold" or
           "w04-parked". Describe the cluster in problem.
        2. An active package has every one of taskId, baseStateId, problem, targets, editDomain
           {instances, nets, regions}, protected {instances, nets}, mayAffect, actions, budget,
           targetPins and scope; observe (fast or full) is optional. protected and actions are required
           even when protected holds only empty lists. actions are drawn from size_cell, insert_buffer,
           delete_buffer, and pg_local_adjust only when siteCapabilities.pgVerification is true.
        3. scope is exactly {"commands": [...], "maxMutations": 120}. commands lists toolkit mutations
           only, each at most once, from atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer,
           atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer,
           atcs_fix_hold_pins, atcs_fix_setup_pins and atcs_undo, and always includes atcs_undo. The
           read procedures (atcs_ref, atcs_paths, atcs_gain, atcs_candidates, atcs_fail_reasons) and
           atcs_dump_cells are always available to the Operator and are never listed in scope. By
           default commands lists every toolkit mutation, so the Operator may try any move in its domain.
           maxMutations is exactly 120, the Pack cap and the Operator's wide default scope; the Host enforces it.
        4. targetPins are instance pins "<instance path>/<pin>" on leaf cells, full hierarchical paths
           from the top with no wildcard, never a top-level port (name a port check by its check key in
           targets). editDomain.instances are full hierarchical instance paths, never bare leaf names.
           regions are [x1, y1, x2, y2] boxes in microns with x1 <= x2 and y1 <= y2. Every
           editDomain instance is a leaf cell of the working netlist, never a module instance, a port
           or a net: resolve each PT endpoint with the Pack's resolver (knowledge
           endpoint-resolution.md) and pass the endpoint, not the check key (the part after the last |,
           without an @** path group suffix); copy the instances and pins it returns unchanged. The
           Reader writes a name that is not a leaf cell as advice, not as a counted problem: the
           Operator's XTop would find no such cell.
        5. No editDomain instance or net is also in protected.
        6. Edit domains are disjoint: no instance (in editDomain.instances or owning a targetPin) and no
           editDomain.nets entry belongs to two active slots.
        7. The worst setup check and the worst hold check of each required scenario is covered by an
           active slot, through its check key "<scenario>|<mode>|<endpoint>" in targets or its endpoint
           pin in targetPins.
        8. Every slot above workerSlots uses the parked shape exactly: {"taskId", "baseStateId",
           "parked": true, "problem": "<why it is parked>"} and no other key. A slot up to workerSlots is
           parked only when every violating check of a required scenario is covered by an active slot;
           otherwise each parked seat is an advice line (never a counted problem) naming the worst
           uncovered check.
        9. candidate.reason is a non-empty string.

      Where the values come from:
        - baseState is the whole JSON object in state/working-state.json, copied verbatim (schema and id
          included), and every baseStateId is its id.
        - siteCapabilities: this Workshop cannot read the Site profile, so write {"pgVerification": false}
          and plan no pg_local_adjust; prepare-workers checks every package again against the Site's own
          capabilities.
        - The blockers are the checks of state/observation.json (keys "<scenario>|<mode>|<endpoint>",
          each with slack and PT's raw endpoint) in the requiredScenarios of state/policy.json; the
          clusters and their fail reasons come from state/residual-cases.json.

      Build the envelope in entry.py from those files, not by typing JSON by hand, and check every
      package before writing. The Pack's flow copy is importable from the workspace; entry.py can check
      like this:
          import json, os, sys
          workspace = sys.argv[1]
          sys.path.insert(0, os.path.join(workspace, "flow"))
          from atcs import composition, workspaces
          def load(*parts):
              with open(os.path.join(workspace, *parts)) as handle:
                  return json.load(handle)
          working, policy = load("state", "working-state.json"), load("state", "policy.json")
          blockers = {key: pin for key, pin in composition.worst_check_endpoints(load("state", "observation.json")).items()
                      if key.split("|", 2)[0] in policy["requiredScenarios"]}
          # build packages = {"w01": {...}, .., "w06": {...}} and site_capabilities here
          for package in packages.values():
              workspaces.validate_work_package(package, working, site_capabilities)  # raises, listing every problem
          active = [p for p in packages.values() if not workspaces.is_parked(p)]
          for key, pin in blockers.items():
              assert any(composition.covers(key, pin, p["targets"], p["targetPins"]) for p in active), key
          seats = load("state", "worker-slots.json")["workerSlots"]
          parked_seats = [t for t, p in packages.items() if workspaces.is_parked(p) and int(t[1:]) <= seats]
          uncovered = [key for key, check in sorted(load("state", "observation.json")["checks"].items())
                       if key.split("|", 2)[0] in policy["requiredScenarios"]
                       and ((check.get("slack") or {}).get("value") or 0) < 0
                       and not any(composition.covers(key, check.get("endpoint"), p["targets"], p["targetPins"])
                                   for p in active)]
          if parked_seats and uncovered:
              print("advice: seats", parked_seats, "are parked while", uncovered[:len(parked_seats)], "are uncovered")
      Fix or park a package the check refuses; never write a plan that fails it.

      Read knowledge example-campaign-plan.md: it holds an admitted campaign-plan.json whose six active
      slots fill workerSlots 6, one cluster each, worst first, with the parked shape in its text. Copy
      its shape and change only the values.
    directory: research/plan
    entry: entry.py
    language: python
    reads: [workingState, workerSlotPolicy, inputReadiness, currentObservations, acceptancePolicy, riskAtlas, contributionIndex, campaignExperience, statePointers, residualCases, campaignPlanProblems]
    knowledge: [method-and-benchmark.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, xtop-capabilities.md, xtop-expert-operator.md, example-campaign-plan.md, endpoint-resolution.md]
    produces: campaignPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-01
    purpose: >-
      After a refusal (read-worker-request-01 counts a problem), read output workerRequest01Problems first: the
      Reader wrote there, one line per problem, what it refused in your last worker-request-w01.json and the
      format each field needs (its Advice lines, after the counted ones, never refuse the request: weigh
      them). Fix every counted line by revising this Workshop's code: the revision reruns this
      branch from here, in the same generation, while the other branches keep their results. Never park an
      active slot because its request was refused; the parked no-op is for a parked package.
      Research worker slot w01 inside its prepared private workspace. Read the slot's prepared
      manifest, its work package (targetPins, editDomain with regions, scope, observe) and the recorded
      evidence, including the prior generation's XTop fail reasons (the slot's own Contribution's
      failReasons, and the batch's after auto-finish in state/residual-cases.json); choose the
      ladder moves, falsifiers and typed atcs_* procedures the expert Operator session will try
      (knowledge xtop-expert-operator.md). Your request is the Operator's own brief: the Host embeds its
      candidate and sessionPlan in the Operator's task and binds its scope to candidate.scope itself (no
      Reviewer gates it); there is no pinned action list. Write the slot's request to
      research/requests/worker-request-w01.json in exactly the shape of knowledge example-worker-request.md. The
      Operator session must write before.dump and after.dump (atcs_dump_cells) in the slot's workspace
      root and may write summary.json {xtopSetupWns, xtopHoldWns, diagnosis, cones, dependencies}. A
      prediction is a hypothesis for the tool to test, never a result. When the slot's prepared package
      is parked (parked: true), write the parked envelope and no sessionPlan: the slot's operate node is
      then the parked no-op, no Team member is created for it, and its capture seals a parked no-fix.

      Where the values come from. The worker-request Reader binds the request to the package
      prepare-workers prepared, state/workers.json workers.w01.workPackage, and counts one problem for
      each difference:
        - candidate is that prepared package copied verbatim with only its schema and id keys removed:
          taskId (exactly w01), baseStateId and problem as prepared, and editDomain, targetPins, observe
          and scope copied verbatim, never edited, narrowed or widened. A parked package stays exactly
          {taskId, baseStateId, parked, problem}.
        - baseState is the whole JSON object in state/working-state.json, copied verbatim.
        - siteCapabilities is copied from research/requests/campaign-plan.json (campaignPlan).
        - sessionPlan (active slots only) is yours: the ordered typed atcs_* commands to try, each with
          its hypothesis and its falsifier.
        - An atcs_size_cell entry of sessionPlan also names toMaster, the master it sizes its object (an
          editDomain leaf cell) to: one cell of this design's libraries with the object's cell function,
          the name up to the drive digits of ecoParameters.cellNominalSizingPattern (D([0-9]+)BWP on this
          Site: SDFCNQARD1BWP35P140 is function SDFCNQARD, drive 1); the drive or the VT may change, the
          function may not (SDFCNQD2BWP35P140 drops the asynchronous reset of SDFCNQARD1BWP35P140). The
          cells are the cell (NAME) groups of the Liberty files state/xtop-context.json lists in
          libraryFiles; that file holds no cell table itself. python3
          <workspace>/hima-readers/atcs-readiness/read-atcs.py masters <workspace> <instances.json>
          <out.json> writes, for each leaf-cell path, its current master and every library cell of its
          function; the Reader writes any other toMaster as advice, never as a refusal. Any other instance or pin you name comes from the Pack's endpoint resolver
          (knowledge endpoint-resolution.md), never from your own netlist parsing.

      Build the envelope in entry.py from those files, not by typing JSON by hand, and check it before
      writing. The Pack's flow copy is importable from the workspace; entry.py can build and check the
      candidate like this:
          import json, os, sys
          workspace, slot = sys.argv[1], "w01"
          sys.path.insert(0, os.path.join(workspace, "flow"))
          from atcs import workspaces
          def load(*parts):
              with open(os.path.join(workspace, *parts)) as handle:
                  return json.load(handle)
