  - id: evaluate-next-investment
    purpose: >-
      Decide the next investment from the evidence: pre-check evidence, physical delta, final
      evaluation, pointers, residual cases, experience and remaining budget. Write one next-decision to
      research/requests/next-decision.json with stateRef, observationRef, budgetRef, question, action
      (observe, research, compose, revise, implement, earlier-apr, wait or goal-met), targets, reason,
      falsifier, costBasis and requiredArtifacts. earlier-apr is legal only when the scope is
      full-flow and must name the stage (place, cts, route or postroute) the APR task prepares and
      runs; wait names the concrete external input, scope or capability required;
      goal-met is
      legal only when the current final evaluation and accepted artifact support it. A temporarily
      degraded working state must name its follow-up and falsifier. Cite new information; never retry
      by revision alone.
    directory: research/next
    entry: entry.py
    language: python
    reads: [inputReadiness, workingState, acceptancePolicy, currentObservations, riskAtlas, contributionIndex, integrationState, precheckEvidence, physicalDelta, finalEvaluation, statePointers, residualCases, campaignExperience]
    knowledge: [method-and-benchmark.md, state-and-evidence.md, cheap-verification.md, lifecycle-and-input-modes.md, innovus-stage-interventions.md, experience-transfer.md]
