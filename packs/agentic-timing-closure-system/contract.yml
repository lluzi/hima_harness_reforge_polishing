  - id: compose-contributions
    purpose: >-
      Compose the current batch from the ready Contributions and the deterministic composition facts:
      select, order, drop duplicates and resolve each conflict locally (keep, drop, or revise with a
      re-sealed revisedContribution); defer what is not worth waiting for. Write one file,
      research/requests/integration-plan.json, as {plan: {batchId, baseStateId, select, resolutions,
      deferred, reason}, facts: <the stamped compositionFacts>}. Never split an atomic group without a record;
      an empty select needs a stated waiting-value reason.
    directory: research/compose
    entry: entry.py
    language: python
    reads: [contributionIndex, compositionFacts, integrationState, campaignPlan, campaignExperience]
    knowledge: [contribution-and-merge.md, cheap-verification.md, method-and-benchmark.md]
    produces: integrationPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: evaluate-next-investment
    purpose: >-
      Decide the next investment from the evidence: pre-check evidence, physical delta, final
      evaluation, pointers, residual cases, experience and remaining budget. Write one next-decision to
      research/requests/next-decision.json with stateRef, observationRef, budgetRef, question, action
      (observe, research, compose, revise, implement, earlier-apr, wait or goal-met), targets, reason,
      falsifier, costBasis and requiredArtifacts. stateRef is the `id` (20 lowercase hex) of state/working-state.json;
      observationRef is the `id` (20 lowercase hex) of the observation the decision cites, such as
      state/observation.json; both are plain strings, never objects or file sha256 values. budgetRef is a
      non-empty string naming the budget basis. earlier-apr is legal only when the scope is
      full-flow and must name the stage (place, cts, route or postroute) the APR task prepares and
      runs; wait names the concrete external input, scope or capability required;
      goal-met is
      legal only when the current final evaluation and accepted artifact support it. A temporarily
      degraded working state must name its follow-up and falsifier. research needs a current
      observation of the working state (the campaign-plan Reader ranks blockers from it), so after the
      working state moves choose observe first. Cite new information; never retry by revision alone.
    directory: research/next
    entry: entry.py
    language: python
    reads: [inputReadiness, workingState, acceptancePolicy, currentObservations, riskAtlas, contributionIndex, integrationState, precheckEvidence, physicalDelta, finalEvaluation, statePointers, residualCases, campaignExperience]
    knowledge: [method-and-benchmark.md, state-and-evidence.md, cheap-verification.md, lifecycle-and-input-modes.md, innovus-stage-interventions.md, experience-transfer.md]
    produces: nextDecision
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']
