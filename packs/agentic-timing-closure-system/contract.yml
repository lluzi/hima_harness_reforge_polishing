id: agentic-timing-closure-system
version: "0.2.0"
title: Agentic timing closure system
status: development
minimumHarnessVersion: 0.1.0

ontology:
  aliases:
    contribution: [ECO contribution, worker contribution]
    campaign: [closure campaign, timing closure campaign]
    batch: [integration batch, merge batch]

# SPEC "Run contract" Budget: a finite Site default the user may override; the Pack never widens it.
# The Run's budget ending is the Runtime's own (SPEC Endings); no converge block exists anywhere.
budget:
  timeBoxMs: 86400000
  closingReserveMs: 1800000
  # #64 Track B (live class C28), reshaped 2026-09-29 (ADR-0016): every generation is one batch and
  # one refresh, generation 1 included (the baseline flows straight into the first plan). #66 D9: the
  # decisive experiment is one generation and one refresh, so one generation is the floor; a Run
  # declaring two refreshes ends honestly at the refresh-budget gate or the owner's decision.
  minimumGenerations: 1

inputs:
  - name: designStateManifest
    description: >-
      JSON manifest of the recoverable Innovus starting state: top, stage, database (.enc and .enc.dat),
      netlist, DEF, per-corner SPEF, SDC list, tool versions, scenarios, and the optional full-flow
      lifecycle index. Read by bind-inputs (M1 input_readiness) and baseline (M1 design_state).
  - name: analysisContract
    description: >-
      Read-only directory of the fixed analysis contract, one JSON document per concern, read by the
      tools at fixed names: query-spec.json (final PBA/coverage query: precision, requiredScenarios,
      nworst; maxPaths comes from the Strategy), scenarios.json (C4, final review:
      `[{name, corner, libGlob, driverLibrary, originalDriverLibrary}]`, the single source of both a
      scenario's RC corner and its PT library identity -- was scenario-corners.json, a bare
      `{scenario: corner}` map with no library information at all; observe/sta/residual/presta all
      read it, and policy derives its own scenarioCorners/requiredScenarios from it), corners.json
      ({"corners": {corner: templatePath}}, each corner's own Site-provided StarRC command-file
      template, hashed and threaded into extract -- I1, final review), recheck.json, policy.json (the
      static acceptance terms only: allowDegradedWorking, degradeLimitNs, maxNewConstraintFailures;
      the policy tool refuses a file setting goal or a run-time field, or a scenarioCorners/
      requiredScenarios that disagrees with the one derived from scenarios.json).
      The starting state's own DRC/connectivity reports are no longer a Site-authored document here
      (I13, final review): physical-baseline runs this Pack's own Innovus export against the staged
      baseline database instead. The model never writes this directory.
  - name: siteCapabilities
    description: >-
      Site-owned JSON of qualified capabilities and bindings: edaShell (the Site's EDA launch prefix
      every EDA-launching subcommand runs through), design, techLef, cellLefGlob (XTop session
      inputs), pgVerification (whether PG-local edits are admissible) and the declared lifecycle
      capability. Read as siteCapabilities, siteProfile and edaProfile by atcs_cli.py.
  - name: workspaceRoot
    description: Campaign-private output root the Site Permit allows; every Campaign workspace lies under it.

outputs:
  - name: inputReadiness
    path: state/readiness.json
    reader: atcs-readiness
    description: M1 input-readiness (post-route minimum inputs, strict full-flow/post-route-only scope, lifecycle availability).
  - name: baselineState
    path: state/baseline.json
    description: M1 design-state of the starting database, fixed for the whole Campaign (policy anchor).
  - name: workingState
    path: state/working-state.json
    reader: atcs-refresh-budget
    description: >-
      The design-state every batch is based on: seeded from the baseline by baseline, rewritten by
      adopt whenever the working pointer moves to an adopted candidate.
  - name: acceptancePolicy
    path: state/policy.json
    description: >-
      Stamped acceptance policy: the Site's static terms, the Run's Goal targets, and the baseline
      state id, baseline minimum WNS and Campaign root composed by the policy tool.
  - name: currentObservations
    path: state/observation.json
    description: M1 observation-set of the latest PT observation (baseline or query); raw reports stay under research/observe/.
  - name: baselinePhysical
    path: state/baseline-physical.json
    description: Starting-state DRC/connectivity report text the final evaluation compares candidate physical checks against.
  - name: riskAtlas
    path: state/risk.json
    description: M1 check-comparison of the previous observation against the current one (fixed/remaining/entrant/regressed/missing-prior).
  - name: campaignPlan
    path: research/requests/campaign-plan.json
    reader: atcs-campaign-plan
    description: >-
      The plan Workshop's one campaign-plan document, holding every slot's work package (w01..w06, a
      parked slot's as {taskId, baseStateId, parked: true, problem}) under candidate.workPackages (with
      baseState and siteCapabilities alongside, for the Reader's own validation) and nowhere else. The campaign-plan Reader admits candidate.workPackages, and
      prepare-workers reads that exact same field; a top-level workPackages key is refused
      (ambiguous-plan) if present at all, since a second copy is never allowed to exist.
  - name: campaignPlanProblems
    path: research/requests/campaign-plan.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/campaign-plan.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerManifests
    path: state/workers.json
    description: >-
      M2 prepared private workspaces of the worker slots w01..w06 (roots, name prefixes, work packages;
      session Tcl and ops logs for active slots, `parked: true` for parked ones) and `requiredSlots`, all six.
  - name: workerSlotPolicy
    path: state/worker-slots.json
    description: >-
      The Run's workerSlots Strategy knob bound for this generation's plan: activeSlots w01..w0<n> and
      parkedSlots above it. The campaign-plan Reader refuses an active slot above the knob.
  - name: workerRequest01
    path: research/requests/worker-request-w01.json
    reader: atcs-worker-request-01
    description: Slot w01's research request in the worker-request read envelope.
  - name: workerRequest01Problems
    path: research/requests/worker-request-w01.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w01.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest02
    path: research/requests/worker-request-w02.json
    reader: atcs-worker-request-02
    description: Slot w02's research request in the worker-request read envelope.
  - name: workerRequest02Problems
    path: research/requests/worker-request-w02.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w02.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest03
    path: research/requests/worker-request-w03.json
    reader: atcs-worker-request-03
    description: Slot w03's research request in the worker-request read envelope.
  - name: workerRequest03Problems
    path: research/requests/worker-request-w03.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w03.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest04
    path: research/requests/worker-request-w04.json
    reader: atcs-worker-request-04
    description: Slot w04's research request in the worker-request read envelope.
  - name: workerRequest04Problems
    path: research/requests/worker-request-w04.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w04.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest05
    path: research/requests/worker-request-w05.json
    reader: atcs-worker-request-05
    description: Slot w05's research request in the worker-request read envelope.
  - name: workerRequest05Problems
    path: research/requests/worker-request-w05.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w05.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest06
    path: research/requests/worker-request-w06.json
    reader: atcs-worker-request-06
    description: Slot w06's research request in the worker-request read envelope.
  - name: workerRequest06Problems
    path: research/requests/worker-request-w06.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w06.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerResult01
    path: state/contribution-w01.json
    reader: atcs-worker-result-01
    description: >-
      Slot w01's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: workerResult02
    path: state/contribution-w02.json
    reader: atcs-worker-result-02
    description: >-
      Slot w02's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: workerResult03
    path: state/contribution-w03.json
    reader: atcs-worker-result-03
    description: >-
      Slot w03's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: workerResult04
    path: state/contribution-w04.json
    reader: atcs-worker-result-04
    description: >-
      Slot w04's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: workerResult05
    path: state/contribution-w05.json
    reader: atcs-worker-result-05
    description: >-
      Slot w05's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: workerResult06
    path: state/contribution-w06.json
    reader: atcs-worker-result-06
    description: >-
      Slot w06's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; value gates batch-net, the last
      reading against the session reference), a no-fix, or a parked no-fix.
  - name: contributionIndex
    path: state/contributions-collected.json
    reader: atcs-contribution-index
    description: Every sealed Contribution plus the slots still pending; a batch does not wait for all of them.
  - name: compositionFacts
    path: state/composition-facts.json
    reader: atcs-composition-facts
    description: M4 duplicates, conflicts, interactions, stale bases and replay order of the collected Contributions.
  - name: integrationPlan
    path: research/requests/integration-plan.json
    reader: atcs-integration-plan
    description: >-
      The compose Workshop's integration plan in the integration-plan read envelope ({plan, facts});
      compose-facts (second pass), replay-prepare and record-experience read this same file.
  - name: integrationPlanProblems
    path: research/requests/integration-plan.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/integration-plan.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: replayRequest
    path: state/replay-request.json
    description: M5 replay request (batch id, common base, ordered steps with their XTop Tcl).
  - name: integrationState
    path: state/integration-state.json
    reader: atcs-integration-state
    description: M5 reconciled replay (applied, failed, pending, replay mismatches, out-of-scope edits).
  - name: precheckEvidence
    path: state/presta.json
    reader: atcs-precheck-evidence
    description: Stamped cheap pre-check evidence binding the batch's new nets to the SPEF net-name source.
  - name: mergeCommit
    path: state/merge-commit.json
    description: M5 sealed batch relative to its common parent state (operations, Innovus ECO Tcl, source map).
  - name: implementation
    path: state/implement.json
    description: >-
      Implementation receipt of the current candidate (database, netlist, DEF, DRC and connectivity
      report identities, parent state), written by implement or, on the earlier-apr route, apr-run.
  - name: extraction
    path: state/extract.json
    description: StarRC SPEF identities per corner for the implemented candidate.
  - name: finalTiming
    path: state/sta.json
    description: Per-scenario PT receipts and the implemented candidate's design-state id.
  - name: refreshLedger
    path: state/refresh-ledger.json
    description: atcs.refresh ledger of completed full physical refreshes (one entry per merge commit).
  - name: physicalDelta
    path: state/physical.json
    description: Candidate DRC/connectivity report text the final evaluation compares against baselinePhysical.
  - name: finalEvaluation
    path: state/evaluation.json
    reader: atcs-evaluation
    description: M6 evaluation of one candidate; the model never writes its measurements.
  - name: statePointers
    path: state/pointers.json
    description: M7 workingState, bestVerifiedState and deliveryState pointers with their history.
  - name: acceptanceRecord
    path: accepted/latest.json
    reader: atcs-acceptance-record
    description: Envelope naming the latest M7 acceptance record and the refresh ledger by workspace path.
  - name: residualCases
    path: state/residual-cases.json
    description: >-
      Residual cases of the checks still failing (PT path-detail evidence, attempts, limits, suggested
      stage), from the current evaluation or, before any, from the current observation.
  - name: campaignExperience
    path: state/experience.json
    description: M8 append-only experience entries (hypothesis, action, conditions, predicted, measured, verdict).

environment:
  wrappers:
    - python3
    - /usr/bin/python3
    - /data/eda/project/hima_harness/operator-admin/atcs-v15/atcs-xtop-operator-v15.sh

workspace:
  source: pack
  copy:
    - atcs_cli.py
    - atcs
    - templates

tools:
  - id: bind-inputs
    file: flow/atcs_cli.py
    description: Bind and verify the declared inputs; decide full-flow or post-route-only (M1 input_readiness).
    inputs: [WORKSPACE, DESIGN_STATE_MANIFEST, SITE_CAPABILITIES]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', bind-inputs, '${WORKSPACE}', '${DESIGN_STATE_MANIFEST}', '${SITE_CAPABILITIES}']

  - id: baseline
    file: flow/atcs_cli.py
    description: Build the starting design-state from the manifest (M1 design_state).
    inputs: [WORKSPACE, DESIGN_STATE_MANIFEST]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', baseline, '${WORKSPACE}', '${DESIGN_STATE_MANIFEST}']

  - id: observe-baseline
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Run the four required PT scenarios on the starting state and capture the baseline observation.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES, MAX_PATHS]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - observe
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/query-spec.json
      - ${SITE_CAPABILITIES}
      - ${ANALYSIS_CONTRACT}/scenarios.json
      - ${MAX_PATHS}

  - id: policy
    file: flow/atcs_cli.py
    description: >-
      Compose the stamped acceptance policy from the Site's static terms, the Run's Goal targets and
      the baseline state and observation; refuses a static file that sets a Goal or run-time field.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, TARGET_SETUP_NS, TARGET_HOLD_NS]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - policy
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}
      - ${TARGET_SETUP_NS}
      - ${TARGET_HOLD_NS}

  - id: physical-baseline
    recommendedVersion: Innovus 23.14
    file: flow/atcs_cli.py
    description: >-
      Run this Pack's own Innovus export (M6-adjacent) on the Campaign baseline's staged database to
      produce its DRC/connectivity reports for the final evaluation's comparison, with the same
      verify_drc/verifyConnectivity limits a candidate's own implement/apr-run is held to (I13, final
      review: no longer a Site-authored static report of unproven provenance).
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    licences: { innovus: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - physical
      - ${WORKSPACE}
      - ${SITE_CAPABILITIES}
      - baseline

  - id: risk
    file: flow/atcs_cli.py
    description: >-
      Compare the previous observation with the current one into the risk atlas (M1 compare_checks);
      the Campaign's first observation is compared with itself.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - risk
      - ${WORKSPACE}
      - ${WORKSPACE}/state/observation-prev.json
      - ${WORKSPACE}/state/observation.json
      - ${ANALYSIS_CONTRACT}/recheck.json

  - id: worker-slots
    file: flow/atcs_cli.py
    description: >-
      Bind the Run's workerSlots Strategy knob (0..6) for this generation's campaign plan: slots up to it
      may be active, every slot above it is parked (Issue #64 Task 5); 0 parks every seat, the full-auto
      control arm (#66 D8).
    inputs: [WORKSPACE, WORKER_SLOTS]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', worker-slots, '${WORKSPACE}', '${WORKER_SLOTS}']

  - id: prepare-workers
    file: flow/atcs_cli.py
    description: >-
      Validate the six slot work packages (w01..w06) and prepare each slot's private workspace, with an
      XTop session Tcl for every active slot and none for a parked one (M2); every slot is required.
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - prepare-workers
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}
      - ${SITE_CAPABILITIES}
      - ${WORKSPACE}/research/requests/campaign-plan.json

  - id: xtop-operator
    recommendedVersion: XTop 2025.09.tmp15
    file: flow/templates/xtop-operator.tcl
    description: >-
      One worker slot's qualified XTop Operator session in its private workspace, driven only through
      the typed atcs_* XTop expert toolkit; every mutation is gated by the slot's edit domain and
      mutation budget, logged to its ops.jsonl and followed by the XTop gain in gain.jsonl; atcs_undo
      reverts the last kept mutation. An active slot runs only interactively, as its worker Team
      Operator's session. The batch path is the Pack's operate-parked no-op: it opens no XTop session,
      settles the operate node of a parked slot or of an active slot whose request is inadmissible, and
      refuses any other active slot (Issue #64 Task 5). A refused active request is revised, not parked:
      the self-driving branch's child Agent revises research-worker-NN from the Reader's itemized problems,
      which reruns that branch in the same generation (ADR-0016); past the fork's revisions the Team's
      batchWhen sends the still-refused request to this no-op.
      The xtop seat is the interactive session's (interactive.licences): the batch no-op of a parked slot
      holds no licence, only one short Site Job (#64 Track B).
    inputs: [WORKSPACE, SLOT]
    interactive:
      mode: hybrid
      adapter: hima-tcl-line-v1
      licences: { xtop: 1 }
      argv: [/data/eda/project/hima_harness/operator-admin/atcs-v15/atcs-xtop-operator-v15.sh, '${WORKSPACE}', '${SLOT}']
      commands:
        read: [atcs_ref, atcs_gain, atcs_paths, atcs_fail_reasons, atcs_candidates, atcs_point]
        mutate: [atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer, atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer, atcs_fix_hold_pins, atcs_fix_setup_pins, atcs_undo]
        save: [atcs_dump_cells, atcs_export_changes]
        close: [atcs_close]
      arguments:
        atcs_ref: []
        atcs_gain: [{ name: check, type: string, choices: [setup, hold] }, { name: topN, type: number, minimum: 1, maximum: 100 }]
        atcs_paths: [{ name: check, type: string, choices: [setup, hold] }, { name: topN, type: number, minimum: 1, maximum: 100 }, { name: endPoints, type: string }]
        atcs_fail_reasons: [{ name: pins, type: string }, { name: reasons, type: string }, { name: methods, type: string }]
        atcs_candidates: [{ name: kind, type: string, choices: [size_cell, insert_buffer, exchange_cell] }, { name: object, type: string }]
        atcs_point: [{ name: check, type: string, choices: [setup, hold] }, { name: endPoints, type: string }]
        atcs_size_cell: [{ name: instance, type: string }, { name: toMaster, type: string }, { name: planSha256, type: string }]
        atcs_exchange_cell: [{ name: instance, type: string }, { name: cells, type: string }, { name: planSha256, type: string }]
        atcs_insert_buffer: [{ name: net, type: string }, { name: loadPins, type: string }, { name: masters, type: string }, { name: newInstances, type: string }, { name: newNets, type: string }, { name: planSha256, type: string }]
        atcs_insert_dummy: [{ name: pin, type: string }, { name: master, type: string }, { name: newInstance, type: string }, { name: planSha256, type: string }]
        atcs_split_load: [{ name: net, type: string }, { name: pinGroups, type: string }, { name: master, type: string }, { name: newInstances, type: string }, { name: newNets, type: string }, { name: planSha256, type: string }]
        atcs_split_net: [{ name: net, type: string }, { name: master, type: string }, { name: rule, type: string, choices: [wire_length, cap] }, { name: segments, type: number, minimum: 2, maximum: 16 }, { name: planSha256, type: string }]
        atcs_move_cell: [{ name: instance, type: string }, { name: x, type: number, minimum: -1000000, maximum: 1000000 }, { name: y, type: number, minimum: -1000000, maximum: 1000000 }, { name: planSha256, type: string }]
        atcs_remove_buffer: [{ name: instance, type: string }, { name: planSha256, type: string }]
        atcs_fix_hold_pins: [{ name: pins, type: string }, { name: effort, type: string, choices: [omit, low, medium, high, ultra_high, extreme_high] }, { name: holdTarget, type: number, minimum: -0.2, maximum: 0.2 }, { name: setupMargin, type: number, minimum: -0.2, maximum: 0.2 }, { name: sizeCellOnly, type: boolean }, { name: useDummyCell, type: boolean }, { name: fixTimingWindow, type: boolean }, { name: maxClusterLoaderCount, type: number, minimum: 0, maximum: 6 }, { name: maxDelayCellLength, type: number, minimum: -1, maximum: 5 }, { name: delayCellList, type: string }, { name: planSha256, type: string }]
        atcs_fix_setup_pins: [{ name: pins, type: string }, { name: methods, type: string }, { name: removeBufferOnly, type: boolean }, { name: sizeDownOnly, type: boolean }, { name: effort, type: string, choices: [medium, high] }, { name: setupTarget, type: number, minimum: -0.2, maximum: 0.2 }, { name: holdMargin, type: number, minimum: -0.2, maximum: 0.2 }, { name: planSha256, type: string }]
        atcs_undo: [{ name: planSha256, type: string }]
        atcs_dump_cells: [{ name: path, type: string }]
        atcs_export_changes: [{ name: limitations, type: string }]
        atcs_close: []
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', operate-parked, '${WORKSPACE}', '${SLOT}']

  - id: capture-contribution
    file: flow/atcs_cli.py
    description: >-
      Seal one slot's actual tool work into a Contribution (M3 seal), composed from state/workers.json
      and the slot's own workspace (before.dump, after.dump, ops.jsonl, optional summary.json); a
      parked slot seals a parked no-fix and is refused if any Operator output exists in its root.
    inputs: [WORKSPACE, SLOT]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', capture-contribution, '${WORKSPACE}', '${SLOT}']

  - id: collect
    file: flow/atcs_cli.py
    description: Collect every slot's sealed Contribution (active and parked) and the slots still pending.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', collect, '${WORKSPACE}']

  - id: compose-facts
    file: flow/atcs_cli.py
    description: >-
      Deterministic composition facts over the collected Contributions (M4 analyze), first pass:
      no resolutions, before the compose Workshop writes this batch's plan. Its plan argument names
      a file nothing writes, so an earlier integration plan still on disk (refused, stale or
      malformed) is never read here (#63 failure catalogue C06, ported for #64).
    inputs: [WORKSPACE]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - compose-facts
      - ${WORKSPACE}
      - ${WORKSPACE}/state/no-integration-plan-on-the-first-pass.json

  - id: compose-facts-admitted
    file: flow/atcs_cli.py
    description: >-
      Deterministic composition facts, second pass: with the resolutions of the integration plan
      request-admissible has just admitted (it runs only behind check-integration-plan PASS).
    inputs: [WORKSPACE]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - compose-facts
      - ${WORKSPACE}
      - ${WORKSPACE}/research/requests/integration-plan.json

  - id: replay-prepare
    recommendedVersion: XTop 2025.09.tmp15
    file: flow/atcs_cli.py
    description: Validate the integration plan, prepare the replay request and replay its steps in XTop from the common base (M5).
    inputs: [WORKSPACE, SITE_CAPABILITIES, AUTO_FINISH]
    licences: { xtop: 2 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - replay-prepare
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${WORKSPACE}/research/requests/integration-plan.json
      - ${SITE_CAPABILITIES}
      - ${AUTO_FINISH}

  - id: reconcile
    file: flow/atcs_cli.py
    description: >-
      Reconcile replay receipts against expected deltas and each slot's admitted edit domain from
      state/workers.json (M5 reconcile).
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', reconcile, '${WORKSPACE}']

  - id: presta
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Cheap PT pre-check of the batch and its RC-qualification evidence for new nets.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - presta
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${ANALYSIS_CONTRACT}/scenarios.json
      - ${SITE_CAPABILITIES}

  - id: implement
    recommendedVersion: Innovus 23.14
    file: flow/atcs_cli.py
    description: Seal the merge commit and implement it once in Innovus, exporting DB, DEF and netlist.
    inputs: [WORKSPACE, SITE_CAPABILITIES]
    licences: { innovus: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - implement
      - ${WORKSPACE}
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}

  - id: extract
    recommendedVersion: StarRC X-2025.06-SP1
    file: flow/atcs_cli.py
    description: Extract every declared RC corner of the implemented DEF in a private work directory.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { starrc: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - extract
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/corners.json
      - ${SITE_CAPABILITIES}

  - id: sta
    recommendedVersion: PrimeTime X-2025.06
    file: flow/atcs_cli.py
    description: Final STA of every required scenario on the new SPEF; records one completed physical refresh.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES, MAX_PATHS]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - sta
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/query-spec.json
      - ${ANALYSIS_CONTRACT}/scenarios.json
      - ${WORKSPACE}/state/working-state.json
      - ${SITE_CAPABILITIES}
      - ${MAX_PATHS}

  - id: physical-candidate
    file: flow/atcs_cli.py
    description: >-
      Package the current candidate's DRC/connectivity reports for the final evaluation, re-hashing
      the identities state/implement.json records.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', physical, '${WORKSPACE}', candidate]

  - id: evaluate
    file: flow/atcs_cli.py
    description: Plan the required checks and assemble the candidate's evaluation (M6).
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', evaluate, '${WORKSPACE}', '${WORKSPACE}/state/policy.json']

  - id: adopt
    file: flow/atcs_cli.py
    description: >-
      Publish the evaluation against the stamped policy and the current working state, move the
      working/best/delivery pointers (M7) and, when working moves, rewrite state/working-state.json.
    inputs: [WORKSPACE]
    argv: [python3, '${WORKSPACE}/flow/atcs_cli.py', adopt, '${WORKSPACE}', '${WORKSPACE}/state/policy.json']

  - id: residual
    file: flow/atcs_cli.py
    description: >-
      Extract residual cases for the checks still failing (the evaluated candidate's, or the current
      observation's before any evaluation), with bounded PT path-detail queries on the working state.
    inputs: [WORKSPACE, ANALYSIS_CONTRACT, SITE_CAPABILITIES]
    licences: { primetime: 1 }
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - residual
      - ${WORKSPACE}
      - ${ANALYSIS_CONTRACT}/scenarios.json
      - ${SITE_CAPABILITIES}

  - id: record-experience
    file: flow/atcs_cli.py
    description: >-
      Append the evaluated candidate's predicted and measured change against its parent state to the
      Campaign experience (M8), composed from state files; the hypothesis is the reason of whatever
      produced state/implement.json (the integration plan of the batch).
    inputs: [WORKSPACE]
    argv:
      - python3
      - ${WORKSPACE}/flow/atcs_cli.py
      - record-experience
      - ${WORKSPACE}
      - ${WORKSPACE}/research/requests/integration-plan.json

rules:
  # Reshaped 2026-09-29 (ADR-0016): in-loop Judges keep identity and merge integrity and the refresh
  # cap; the final evaluation's other checks are facts the decision reads, not routes.
  - inputs-ready
  - refresh-budget
  - request-admissible
  - request-checked
  - worker-result-admissible
  - composition-ready
  - composition-checked
  - replay-consistent-mismatch
  - replay-consistent-scope
  - final-evidence-ready-identity
  - setup-goal
  - hold-goal

goal:
  # Minor (final review): max is 0, not 1. `target_setup_wns_ns`/`target_hold_wns_ns`
  # name a REQUIRED margin (setup-goal/hold-goal's own `predicate: { op: gte,
  # threshold: { parameter: ... } }`), but this Pack's own evidence can never PROVE a
  # positive one: PT's `report_global_timing` only ever reports a real WNS for a mode
  # that actually has violations ("NUM>0"); a clean mode instead prints "No violations
  # found", which `atcs.reports.parse_global_timing` can only parse as `known(0.0)`,
  # never a genuine positive slack margin (PT does not report how much positive margin
  # a clean design has this way). A Run configured with, say, `target_setup_wns_ns =
  # 0.2` could therefore never pass `setup-goal` even once every real violation was
  # fixed -- the only value this evidence can ever honestly certify is the Global
  # Constraint's own `0.0` ("no violations"), so `max: 0` makes that the only value a
  # Run can be configured with, instead of silently accepting a knob this Pack's own
  # evidence can never satisfy. See FABRIC.md's Gaps for the SPEC-consistent framing.
  target_setup_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  target_hold_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  # Issue #64 Track B (from #63): the Run's cap on completed full physical refreshes
  # (implement/apr-run -> extract -> sta). Every Explore revisit consumes a generation whether
  # or not it refreshes, so the generation limit does not bound refreshes; the refresh-budget
  # Judges before implement and apr-prepare do. A Goal value, fixed when the Run is created: no
  # next-strategy decision or revision changes it. Default 2, the two refreshes of the #64 deal.
  max_physical_refreshes: { type: number, unit: count, min: 1, max: 4, default: 2, precision: 0 }

strategy:
  maxPaths: { type: number, unit: paths, min: 100, max: 5000, default: 1000 }
  # Issue #64 Task 5: how many of the six parallel worker branches may hold an active XTop expert
  # Team; slots above it are parked. Each active branch holds one Site Job at a time. #66 D8: 0 parks
  # every seat, the qualified full-auto control arm (the same Pack, the batch runs auto-finish alone).
  workerSlots: { type: number, unit: slots, min: 0, max: 6, default: 6 }
  autoFinish: { type: number, unit: flag, min: 0, max: 1, default: 1, precision: 0 }

words:
  target_setup_wns_ns: { label: target setup WNS, unit: ns }
  target_hold_wns_ns: { label: target hold WNS, unit: ns }
  max_physical_refreshes: { label: max full physical refreshes per Run, unit: count }
  maxPaths: { label: max paths per scenario query, unit: paths }
  workerSlots: { label: "parallel worker slots (0 parks every seat: full-auto control)", unit: slots }
  autoFinish: { label: "auto-finish after the expert recipe (1 on, 0 off)", unit: flag }

knowledge:
  - file: method-and-benchmark.md
    purpose: The confirmed business scope, the B_lazy comparison and the collaborative-merge method, so the Campaign does not collapse into a linear fix loop.
  - file: state-and-evidence.md
    purpose: States, coverage, precision, working/best/delivery and unknown, and which evidence may not be mixed.
  - file: observation-strategy.md
    purpose: GBA/PBA, path breadth and diversity, Nworst/max_paths and query cost, to decide what to observe next and when to stop.
  - file: mechanisms-and-falsifiers.md
    purpose: Cell, net, clock, SI and spatial root causes with their falsifiers and joint windows, for decomposition and real trials.
  - file: xtop-capabilities.md
    purpose: The XTop queries, attributes, manual/auto modes and the typed atcs_* procedures a worker session may use.
  - file: xtop-expert-operator.md
    purpose: >-
      The XTop expert loop (reference, diagnose, trial, gain, keep or undo), the hold and setup ladders,
      target/margin pairing, the fail-reason to move table and blockers versus bulk, so plans cluster
      blockers, worker requests propose ladder moves and the worker Team's Operator trials and undoes.
  - file: contribution-and-merge.md
    purpose: Base-relative changes, dependencies and atomic groups, rebase and recovery, for composing complementary Contributions.
  - file: cheap-verification.md
    purpose: When a PT pre-check is applicable, why new nets without RC are unqualified, and when a controlled physical trial is worth it.
  - file: innovus-stage-interventions.md
    purpose: The verified stage hooks and read-backs that turn a residual case into one bounded APR stage request.
  - file: lifecycle-and-input-modes.md
    purpose: The strict full-flow/post-route-only scopes, lifecycle completeness and when an earlier APR stage is justified.
  - file: experience-transfer.md
    purpose: Success and failure conditions, predicted versus measured, and version/region applicability of recorded experience.
  # #64 Track B (from #63): one admitted example per model-written document, read by the Workshop
  # that writes it; flow/tests/test_workshop_examples.py runs each through its Reader to 0 problems.
  - file: example-campaign-plan.md
    purpose: An admitted six-slot research/requests/campaign-plan.json (six active clusters filling workerSlots 6, the parked shape in its text), to copy in shape.
  - file: example-worker-request.md
    purpose: Admitted worker requests for an active slot, an active slot with no safe move, and a parked slot, to copy in shape.
  - file: example-integration-plan.md
    purpose: An admitted research/requests/integration-plan.json with one conflict resolution, to copy in shape.
  # #64 (from #63 C22, 45257f24 and e00d06cb): the Pack's endpoint resolver, shipped with its Reader.
  - file: endpoint-resolution.md
    purpose: >-
      How a plan or worker Workshop turns PrimeTime endpoints into the leaf-cell editDomain.instances
      and targetPins the Readers admit, with read-atcs.py resolve-instances; pass the endpoint, not the
      check key.

agentTeams:
  # Issue #64, reshaped 2026-09-29 (ADR-0016): one Team per worker slot, run inside the self-driving
  # fork branch. The branch's Researcher is the branch child Agent that authors the research Workshop,
  # and its output is the request itself: the Operator is materialized with that request's exact bytes
  # embedded in its task (#64 M-T03-1) and the scope the request states (request-scope, bound to the
  # request's plan hash), so no Reviewer gates it. The Reviewer stays an optional advisory member whose
  # absence never blocks: the autopilot never waits for it. A parked slot, or a request the Reader still
  # refuses after the fork's revisions, runs the batch no-op instead (batchWhen). maxMutations 120 is
  # the recipe cap (flow/atcs/workspaces.py SCOPE_MAX_MUTATIONS), the wide default scope every plan
  # states; the Host enforces it. The Operator's schema-valid result is adopted as it arrives; one
  # repair follow-up is allowed.
  - id: atcs-worker-01
    version: "5"
    triggerNode: operate-worker-01
    batchWhen:
      - { input: workerRequest01, value: tc_slot_parked, equals: 1 }
      - { input: workerRequest01, value: tc_request_invalid_count, above: 0 }
    members:
      - id: reviewer
        role: reviewer
        optional: true
        node: operate-worker-01
        taskTemplate: 'Advisory only: nothing waits for you and nothing is gated on you. Read the exact admitted workerRequest01 for slot w01 and return the concerns and the sharpest first moves a second pair of eyes sees (a pin outside the edit domain, a master of the wrong function, a ladder rung worth trying first) as at most three limitations under 200 characters each. Reply with exactly one JSON object and nothing else: schema (atcs-worker-review/3), planSha256 (the observation content SHA-256 of workerRequest01), evidenceRefs (Runtime input record ids) and limitations. If the owner returns a refusal of your reply, answer with the corrected single JSON object only.'
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-review/3
          required: [schema, planSha256, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: candidate-only
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-01
        taskTemplate: 'You are slot w01''s XTop expert Operator, the one model of this self-driving branch after its research. Your admitted request is embedded below as Exact input workerRequest01: its candidate names your blockers (targetPins and targets), your edit domain (editDomain.instances, editDomain.nets, editDomain.regions), the cluster''s problem and your scope, and its sessionPlan names the moves research proposes with their toMaster. Work only there: a pin or instance outside candidate.editDomain is refused by the toolkit. Work only through hima_interactive in this execution''s xtop-operator session, inside the immutable scope the Host bound from that request (its candidate.scope): only its commands mutate, every mutation carries the request''s planSha256, and the Host admits at most its maxMutations mutations, undo included. Each trial is probabilistic: keep what XTop''s gain shows helps and undo what does not. The merge later ranks sessions by value, so a short, clean kept log beats many marginal edits. Run the expert loop on the request''s targetPins, the blockers; the bulk belongs to auto-finish. 1. atcs_dump_cells before.dump (exactly this file name in your slot root: the toolkit refuses any other and capture seals exactly before.dump and after.dump), then atcs_ref once. Try the sessionPlan moves first. 2. Diagnose before any change: atcs_paths (setup or hold, topN, endPoints = the target pins), the fail reasons auto-fix reported in the request''s evidence (none in the first generation: only an evaluated batch carries them), and atcs_candidates for the path cells. XTop keeps no fail reasons in the session before its first fix, so read atcs_fail_reasons on the target pins after your own fix (setup reasons after a setup fix: the batch''s auto-finish ends with hold and leaves them unread). 3. Choose one move and change one variable per trial. Hold ladder: size down (atcs_size_cell, or atcs_fix_hold_pins with sizeCellOnly 1 and effort omit); dummy (atcs_insert_dummy, or useDummyCell 1); delay or buffer chain (atcs_insert_buffer with several masters, or maxDelayCellLength with delayCellList); loader clustering (maxClusterLoaderCount, try 4); timing window (fixTimingWindow 1 at effort low, never with sizeCellOnly). Setup ladder, at effort medium or high: remove buffer (atcs_remove_buffer, or removeBufferOnly 1); size (atcs_size_cell, atcs_exchange_cell, or methods size_cell); buffer (atcs_insert_buffer, atcs_split_load, or methods insert_buffer); split net (atcs_split_net, or methods split_net); size down off-path (sizeDownOnly 1). Move a cell (atcs_move_cell, to an absolute x y in microns inside an editDomain region) only when the analysis blames distance and a region was planned. Pair every target with the opposite margin, holdTarget with setupMargin and setupTarget with holdMargin, starting at 0 and 0. Let the fail reasons steer: break_setup, a timing window or a smaller step; break_hold, holdMargin above 0 or size instead of buffer; too_large_slack, a chain or buffer rather than size; unable_fix_by_dummy_cell, a chain; sufficient_driving_strength, size or split rather than buffer; no_setup_gain or no_hold_gain, another method or pin set, never only more effort; legal_fail_no_space_on_row, smaller or fewer cells, else record it. 4. Try freely inside your domain, manual moves and targeted fixes alike: there is no wrong attempt, only an unmeasured one. XTop commits a targeted fix (atcs_fix_hold_pins, atcs_fix_setup_pins) and atcs_undo cannot revert it, so try one after the manual moves you can undo, and measure it the same way; a fix that may insert cells (hold unless sizeCellOnly without useDummyCell, setup insert_buffer or split_net) needs each pin''s net in the edit domain. 5. atcs_point on the target pins, and atcs_gain for the target check and the opposite check. 6. Keep it only if the target slack improved and the opposite check did not break; otherwise atcs_undo at once, then try the next rung of the ladder (another master, method, margin or pin set): an undo is never the end of the session. 7. Stop when the budget is spent, when every rung your scope allows has been tried on the target pins without gain, or when the blockers are clear. Then atcs_dump_cells after.dump, atcs_export_changes and atcs_close; close the session with atcs_close, or ask hima_interactive to close it, and either is a clean end. A Host refusal (outside the scope, another plan hash, the budget spent) is free, but when the toolkit refuses an admitted mutation (a pin or instance outside the domain, a point outside every region, a master already in place) the toolkit refusal costs one approved mutation; so check the domain, pins, regions and candidates with the free read procedures before sending. A master is one library cell name, a single token: the toMaster the request''s sessionPlan names for a size move, or a cell name atcs_candidates lists; never join two columns of that listing. A toolkit refusal "invalid library cell" means the name is wrong: read atcs_candidates again and never resend it. Read every refusal and choose again, and never resend a mutation. If the session is tainted, dump, close and report it; preserve uncertain outcomes. When the request states noSafeAction, mutate nothing: atcs_dump_cells before.dump, atcs_ref, atcs_dump_cells after.dump, atcs_export_changes and atcs_close, with stopReason no-safe-action. Return one JSON object with schema, planSha256, mutationReceipts (the request ids of the mutations the Host admitted), stopReason (budget, no-candidate-gains, blockers-clear, no-safe-action, tainted or refused) and limitations.'
        inputs: [workerRequest01]
        taskInputs: [{ input: workerRequest01, fields: [candidate, sessionPlan, noSafeAction, siteCapabilities] }]
        allowedTools: [hima_interactive]
        scopePolicy: site-qualified-interactive-only
        budgetShare: { maxElapsedMs: 1200000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-session/1
          required: [schema, planSha256, mutationReceipts, stopReason, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
        reviewedAction:
          mode: request-scope
          planInput: workerRequest01
          scopePath: [candidate, scope]
          commands: [atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer, atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer, atcs_fix_hold_pins, atcs_fix_setup_pins, atcs_undo]
          maxMutations: 120
          hostPlanHashArgument: planSha256
  - id: atcs-worker-02
    version: "5"
    triggerNode: operate-worker-02
    batchWhen:
      - { input: workerRequest02, value: tc_slot_parked, equals: 1 }
      - { input: workerRequest02, value: tc_request_invalid_count, above: 0 }
    members:
      - id: reviewer
        role: reviewer
        optional: true
        node: operate-worker-02
        taskTemplate: 'Advisory only: nothing waits for you and nothing is gated on you. Read the exact admitted workerRequest02 for slot w02 and return the concerns and the sharpest first moves a second pair of eyes sees (a pin outside the edit domain, a master of the wrong function, a ladder rung worth trying first) as at most three limitations under 200 characters each. Reply with exactly one JSON object and nothing else: schema (atcs-worker-review/3), planSha256 (the observation content SHA-256 of workerRequest02), evidenceRefs (Runtime input record ids) and limitations. If the owner returns a refusal of your reply, answer with the corrected single JSON object only.'
        inputs: [workerRequest02]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-review/3
          required: [schema, planSha256, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: candidate-only
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-02
        taskTemplate: 'You are slot w02''s XTop expert Operator, the one model of this self-driving branch after its research. Your admitted request is embedded below as Exact input workerRequest02: its candidate names your blockers (targetPins and targets), your edit domain (editDomain.instances, editDomain.nets, editDomain.regions), the cluster''s problem and your scope, and its sessionPlan names the moves research proposes with their toMaster. Work only there: a pin or instance outside candidate.editDomain is refused by the toolkit. Work only through hima_interactive in this execution''s xtop-operator session, inside the immutable scope the Host bound from that request (its candidate.scope): only its commands mutate, every mutation carries the request''s planSha256, and the Host admits at most its maxMutations mutations, undo included. Each trial is probabilistic: keep what XTop''s gain shows helps and undo what does not. The merge later ranks sessions by value, so a short, clean kept log beats many marginal edits. Run the expert loop on the request''s targetPins, the blockers; the bulk belongs to auto-finish. 1. atcs_dump_cells before.dump (exactly this file name in your slot root: the toolkit refuses any other and capture seals exactly before.dump and after.dump), then atcs_ref once. Try the sessionPlan moves first. 2. Diagnose before any change: atcs_paths (setup or hold, topN, endPoints = the target pins), the fail reasons auto-fix reported in the request''s evidence (none in the first generation: only an evaluated batch carries them), and atcs_candidates for the path cells. XTop keeps no fail reasons in the session before its first fix, so read atcs_fail_reasons on the target pins after your own fix (setup reasons after a setup fix: the batch''s auto-finish ends with hold and leaves them unread). 3. Choose one move and change one variable per trial. Hold ladder: size down (atcs_size_cell, or atcs_fix_hold_pins with sizeCellOnly 1 and effort omit); dummy (atc