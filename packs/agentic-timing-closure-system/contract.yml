goal:
  # Minor (final review): max is 0, not 1. `target_setup_wns_ns`/`target_hold_wns_ns`
  # name a REQUIRED margin (setup-goal/hold-goal's own `predicate: { op: gte,
  # threshold: { parameter: ... } }`), but this Pack's own evidence can never PROVE a
  # positive one: PT's `report_global_timing` only ever reports a real WNS for a mode
  # that actually has violations ("NUM>0"); a clean mode instead prints "No violations
  # found", which `atcs.reports.parse_global_timing` can only parse as `known(0.0)`,
  # never a genuine positive slack margin (PT does not report how much positive margin
  # a clean design has this way). A Run configured with, say, `target_setup_wns_ns =
  # 0.2` could therefore never pass `setup-goal` even once every real violation was
  # fixed -- the only value this evidence can ever honestly certify is the Global
  # Constraint's own `0.0` ("no violations"), so `max: 0` makes that the only value a
  # Run can be configured with, instead of silently accepting a knob this Pack's own
  # evidence can never satisfy. See FABRIC.md's Gaps for the SPEC-consistent framing.
  target_setup_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  target_hold_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  # Issue #63: caps completed Innovus+StarRC+PrimeTime refreshes for the whole Run (Judges
  # check-refresh-budget*, rule refresh-budget). Every Explore revisit consumes a Harness
  # generation whether or not it refreshes anything, so generationLimit cannot stand in for it.
  # A Goal value, not a Strategy knob: the person fixes it when the Run is created and nothing in
  # the Run changes it (an owner's next-strategy or a revision cannot reach a Goal value).
  max_physical_refreshes: { type: number, unit: count, min: 1, max: 4, default: 1, precision: 0 }

strategy:
  maxPaths: { type: number, unit: paths, min: 100, max: 5000, default: 1000 }

words:
  target_setup_wns_ns: { label: target setup WNS, unit: ns }
  target_hold_wns_ns: { label: target hold WNS, unit: ns }
  max_physical_refreshes: { label: max full physical refreshes per Run, unit: count }
  maxPaths: { label: max paths per scenario query, unit: paths }

knowledge:
  - file: method-and-benchmark.md
    purpose: The confirmed business scope, the B_lazy comparison and the collaborative-merge method, so the Campaign does not collapse into a linear fix loop.
  - file: state-and-evidence.md
    purpose: States, coverage, precision, working/best/delivery and unknown, and which evidence may not be mixed.
  - file: observation-strategy.md
    purpose: GBA/PBA, path breadth and diversity, Nworst/max_paths and query cost, to decide what to observe next and when to stop.
  - file: mechanisms-and-falsifiers.md
    purpose: Cell, net, clock, SI and spatial root causes with their falsifiers and joint windows, for decomposition and real trials.
  - file: xtop-capabilities.md
    purpose: The XTop queries, attributes, manual/auto modes and the typed atcs_* procedures a worker session may use.
  - file: contribution-and-merge.md
    purpose: Base-relative changes, dependencies and atomic groups, rebase and recovery, for composing complementary Contributions.
  - file: cheap-verification.md
    purpose: When a PT pre-check is applicable, why new nets without RC are unqualified, and when a controlled physical trial is worth it.
  - file: innovus-stage-interventions.md
    purpose: The verified stage hooks and read-backs that turn a residual case into one bounded APR stage request.
  - file: lifecycle-and-input-modes.md
    purpose: The strict full-flow/post-route-only scopes, lifecycle completeness and when an earlier APR stage is justified.
  - file: experience-transfer.md
    purpose: Success and failure conditions, predicted versus measured, and version/region applicability of recorded experience.
  - file: example-campaign-plan.md
    purpose: One campaign-plan document the campaign-plan Reader admits, for plan-campaign to copy the shape of.
  - file: example-worker-request.md
    purpose: One worker request the worker-request Reader admits, carrying the plan example's w01 package and hierarchical action instances, for the research workers to copy the shape of.
  - file: example-next-decision.md
    purpose: One next-decision the next-decision Reader admits, for evaluate-next-investment to copy the shape of.
  - file: example-observation-request.md
    purpose: One observation request the observation-request Reader admits for the examples' working state, for diagnose-and-observe to copy the shape of.
  - file: agent-team.md
    purpose: For the Run owner operating the atcs-worker-01 Team at operate-worker-01, the adoption order and the one same-child follow-up to spend on a formatting refusal before escalating.
  - file: endpoint-resolution.md
    purpose: How a plan or worker Workshop turns PrimeTime endpoints into leaf-cell instance paths with the Pack's own resolver (read-atcs.py resolve-instances), never a netlist parser of its own.
  - file: example-integration-plan.md
    purpose: One integration plan the integration-plan Reader admits against its embedded composition facts, including a conflict resolution, for compose-contributions to copy the shape of.

agentTeams:
  - id: atcs-worker-01
    version: "3"
    triggerNode: operate-worker-01
    members:
      - id: researcher
        role: researcher
        node: operate-worker-01
        taskTemplate: >-
          Read the exact admitted workerRequest01. Return bounded hypotheses and falsifiers for its
          declared actions. Do not invent or execute actions; request a Workshop revision when none is
          suitable. Return one compact schema-complete JSON object in this turn; at most one hypothesis
          per declared action, shared evidenceRefs once, and concise limitations. Do not enumerate every
          target check or repeat the input document. If the owner returns a refusal of your reply, answer
          with the corrected single JSON object only. Example reply (shape only):
          {"schema": "atcs-worker-research/1", "hypotheses": [{"instance": "u_a/reg0", "toMaster": "DFQD2BWP35P140", "mechanism": "undersized driver on the hold-critical path", "falsifier": "hold slack at X does not improve after the resize"}], "evidenceRefs": ["<a Runtime input record id>"], "limitations": ["parasitics unchanged until the next refresh"]}
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 8000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-research/1
          required: [schema, hypotheses, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: reviewer
        role: reviewer
        node: operate-worker-01
        taskTemplate: >-
          Read the adopted Researcher result and exact workerRequest01. Select one atcs_size_cell action
          from actions; return its exact instance and toMaster, the observation content SHA as planSha256,
          and limitations. Refuse if no safe action exists. Return one compact schema-complete JSON object
          in this turn, with at most three short limitations. If the owner returns a refusal of your
          reply, answer with the corrected single JSON object only. Example reply (shape only):
          {"schema": "atcs-worker-review/1", "planSha256": "<the workerRequest01 observation content SHA-256>", "command": "atcs_size_cell", "arguments": {"instance": "u_a/reg0", "toMaster": "DFQD2BWP35P140"}, "evidenceRefs": ["<a Runtime input record id>"], "limitations": ["one candidate reviewed"]}
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: [researcher]
        resultSchema:
          id: atcs-worker-review/1
          required: [schema, planSha256, command, arguments, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-01
        taskTemplate: >-
          Read the immutable Host-injected reviewed action. Dump before.dump, query the falsifier, apply
          that one action once, dump after.dump, export the route-preserving ECO pair, finalize through
          the qualified Runtime and close. Preserve uncertain outcomes and never replay a mutation. Example reply (shape only):
          {"schema": "atcs-worker-receipts/1", "planSha256": "<the immutable reviewed action's planSha256>", "mutationReceipt": "<the commandId of the one atcs_size_cell input>", "limitations": ["XTop estimate only; PT confirms after the refresh"]}
        inputs: [workerRequest01]
        allowedTools: [hima_interactive]
        scopePolicy: site-qualified-interactive-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 0, maxTokensPerTurn: 5000 }
        dependencyRoles: [reviewer]
        resultSchema:
          id: atcs-worker-receipts/1
          required: [schema, planSha256, mutationReceipt, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: forbidden
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
        reviewedAction:
          fromRole: reviewer
          planInput: workerRequest01
          actionListField: actions
          command: atcs_size_cell
          hostPlanHashArgument: planSha256
          planHashField: planSha256
          commandField: command
          argumentsField: arguments

workshops:
  - id: diagnose-and-observe
    purpose: >-
      Diagnose the current timing problem from the declared baseline state, current observation, risk
      atlas and experience: name the competing root causes and the cheapest query that separates them.
      Write the observation request to research/requests/observation-request.json as one JSON object
      {designStateId, precision (gba|pba), requiredScenarios, maxPaths, nworst} naming the working
      design-state it observes; the Run's maxPaths Strategy knob caps the value the observe tool
      uses; the tool builds every scenario's PT inputs from the working state itself. Every required scenario stays in the request; the request never
      changes frequency, exceptions or required checks. It is a plan, not a measurement.
      Read knowledge example-observation-request.md; copy its shape and change only the values.
      Before writing, read output observationRequestProblems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/diagnose
    entry: entry.py
    language: python
    reads: [workingState, inputReadiness, currentObservations, riskAtlas, campaignExperience, statePointers, observationRequestProblems]
    knowledge: [observation-strategy.md, mechanisms-and-falsifiers.md, state-and-evidence.md, experience-transfer.md, example-observation-request.md]
    produces: observationRequest
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: plan-campaign
    purpose: >-
      Decompose the current problem into exactly three bounded worker work packages (taskId w01, w02,
      w03), each against the baseline design-state: problem, target check keys, edit domain (every
      instance a leaf cell written as its full path from top, such as u_a/reg0), protected objects,
      may-affect checks, admissible actions (size_cell, insert_buffer, delete_buffer, and
      pg_local_adjust only when siteCapabilities.pgVerification is true) and budget, all against the
      working design-state (workingState). Write one document, research/requests/campaign-plan.json:
      {candidate: {workPackages: {w01, w02, w03}, reason}, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. There is exactly one copy of workPackages, under
      candidate; never repeat it at the top level. The Reader admits candidate.workPackages, and
      prepare-workers prepares that same field. Do not repeat a failed trial without new evidence; a slot with nothing
      worth researching still gets a bounded package whose diagnosis-only outcome is a valid no-fix.
      Read knowledge example-campaign-plan.md; copy its shape and change only the values.
      Turn endpoints into instances only with the Pack resolver in knowledge endpoint-resolution.md.
      Before writing, read output campaignPlanProblems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/plan
    entry: entry.py
    language: python
    reads: [workingState, inputReadiness, currentObservations, riskAtlas, contributionIndex, campaignExperience, statePointers, campaignPlanProblems]
    knowledge: [method-and-benchmark.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, xtop-capabilities.md, example-campaign-plan.md, endpoint-resolution.md]
    produces: campaignPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-01
    purpose: >-
      Research worker slot w01 inside its prepared private workspace. Read the slot's prepared
      manifest, its work package and the recorded evidence; choose the analysis, candidate-generation
      and manual/auto strategy and the typed atcs_* procedures the Operator session will run. Write the
      slot's request to research/requests/worker-request-w01.json as {candidate: <the w01 work
      package, never wider than the prepared edit domain>, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. The typed commands and the falsifier of each belong
      to the Operator session, not to this file. The Operator session must write before.dump and
      after.dump (atcs_dump_cells) in the slot's workspace root and may write summary.json {xtopSetupWns, xtopHoldWns, diagnosis, cones,
      dependencies}. A prediction is a hypothesis for the tool to test, never a result.
      Also include top-level actions with one to three objects {instance, toMaster}; each instance
      must be in candidate.editDomain.instances and each action proposes one size_cell mutation.
      Each toMaster is a cell of this design's libraries (state/xtop-context.json) with the same
      function and VT as the instance's current cell; only the drive strength changes.
      The Agent Team reviews and selects one exact action from this admitted list.
      Read knowledge example-worker-request.md; copy its shape and change only the values (and taskId to w01); every instance is a full hierarchical path such as u_a/reg0, never a bare leaf name.
      Turn endpoints into instances only with the Pack resolver in knowledge endpoint-resolution.md.
      Before writing, read output workerRequest01Problems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/worker-01
    entry: entry.py
    language: python
    reads: [workingState, workerManifests, campaignPlan, currentObservations, riskAtlas, campaignExperience, workerResult01, workerRequest01Problems]
    knowledge: [xtop-capabilities.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, cheap-verification.md, experience-transfer.md, example-worker-request.md, endpoint-resolution.md]
    produces: workerRequest01
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-02
    purpose: >-
      Research worker slot w02 inside its prepared private workspace. Read the slot's prepared
      manifest, its work package and the recorded evidence; choose the analysis, candidate-generation
      and manual/auto strategy and the typed atcs_* procedures the Operator session will run. Write the
      slot's request to research/requests/worker-request-w02.json as {candidate: <the w02 work
      package, never wider than the prepared edit domain>, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. The typed commands and the falsifier of each belong
      to the Operator session, not to this file. The Operator session must write before.dump and
      after.dump (atcs_dump_cells) in the slot's workspace root and may write summary.json {xtopSetupWns, xtopHoldWns, diagnosis, cones,
      dependencies}. A prediction is a hypothesis for the tool to test, never a result.
      Read knowledge example-worker-request.md; copy its shape and change only the values (and taskId to w02); every instance is a full hierarchical path such as u_a/reg0, never a bare leaf name.
      Turn endpoints into instances only with the Pack resolver in knowledge endpoint-resolution.md.
      Before writing, read output workerRequest02Problems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/worker-02
    entry: entry.py
    language: python
    reads: [workingState, workerManifests, campaignPlan, currentObservations, riskAtlas, campaignExperience, workerResult02, workerRequest02Problems]
    knowledge: [xtop-capabilities.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, cheap-verification.md, experience-transfer.md, example-worker-request.md, endpoint-resolution.md]
    produces: workerRequest02
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-03
    purpose: >-
      Research worker slot w03 inside its prepared private workspace. Read the slot's prepared
      manifest, its work package and the recorded evidence; choose the analysis, candidate-generation
      and manual/auto strategy and the typed atcs_* procedures the Operator session will run. Write the
      slot's request to research/requests/worker-request-w03.json as {candidate: <the w03 work
      package, never wider than the prepared edit domain>, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. The typed commands and the falsifier of each belong
      to the Operator session, not to this file. The Operator session must write before.dump and
      after.dump (atcs_dump_cells) in the slot's workspace root and may write summary.json {xtopSetupWns, xtopHoldWns, diagnosis, cones,
      dependencies}. A prediction is a hypothesis for the tool to test, never a result.
      Read knowledge example-worker-request.md; copy its shape and change only the values (and taskId to w03); every instance is a full hierarchical path such as u_a/reg0, never a bare leaf name.
      Turn endpoints into instances only with the Pack resolver in knowledge endpoint-resolution.md.
      Before writing, read output workerRequest03Problems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/worker-03
    entry: entry.py
    language: python
    reads: [workingState, workerManifests, campaignPlan, currentObservations, riskAtlas, campaignExperience, workerResult03, workerRequest03Problems]
    knowledge: [xtop-capabilities.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, cheap-verification.md, experience-transfer.md, example-worker-request.md, endpoint-resolution.md]
    produces: workerRequest03
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: compose-contributions
    purpose: >-
      Compose the current batch from the ready Contributions and the deterministic composition facts:
      select, order, drop duplicates and resolve each conflict locally (keep, drop, or revise with a
      re-sealed revisedContribution); defer what is not worth waiting for. Write one file,
      research/requests/integration-plan.json, as {plan: {batchId, baseStateId, select, resolutions,
      deferred, reason}, facts: <the stamped compositionFacts>}. Never split an atomic group without a record;
      an empty select needs a stated waiting-value reason.
      Read knowledge example-integration-plan.md; copy its shape and change only the values.
      Before writing, read output integrationPlanProblems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading).
    directory: research/compose
    entry: entry.py
    language: python
    reads: [contributionIndex, compositionFacts, integrationState, campaignPlan, campaignExperience, integrationPlanProblems]
    knowledge: [contribution-and-merge.md, cheap-verification.md, method-and-benchmark.md, example-integration-plan.md]
    produces: integrationPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: evaluate-next-investment
    purpose: >-
      Decide the next investment from the evidence: pre-check evidence, physical delta, final
      evaluation, pointers, residual cases, experience and remaining budget. Write one next-decision to
      research/requests/next-decision.json with stateRef, observationRef, budgetRef, question, action
      (observe, research, compose, revise, implement, earlier-apr, wait or goal-met), targets, reason,
      falsifier, costBasis and requiredArtifacts. stateRef is the `id` (20 lowercase hex) of state/working-state.json;
      observationRef is the `id` (20 lowercase hex) of the observation the decision cites, such as
      state/observation.json; both are plain strings, never objects or file sha256 values. budgetRef is a
      non-empty string naming the budget basis. earlier-apr is legal only when the scope is
      full-flow and must name the stage (place, cts, route or postroute) the APR task prepares and
      runs; wait names the concrete external input, scope or capability required;
      goal-met is
      legal only when the current final evaluation and accepted artifact support it. A temporarily
      degraded working state must name its follow-up and falsifier. research, compose and revise need
      state/xtop-context.json bound to the working state; after an adopted refresh it still names the
      older state until observe runs, so choose observe first. Cite new information; never retry
      by revision alone.
      Read knowledge example-next-decision.md; copy its shape and change only the values.
      Before writing, read output nextDecisionProblems: after the Reader has read an earlier document it lists every problem it found, one line each naming the field, the slot and the required format; fix every line and write the whole document again (the file is absent before the first reading). A refused campaign plan or integration plan also routes here; outputs campaignPlanProblems and integrationPlanProblems name what was wrong with it.
    directory: research/next
    entry: entry.py
    language: python
    reads: [inputReadiness, workingState, acceptancePolicy, currentObservations, riskAtlas, contributionIndex, integrationState, precheckEvidence, physicalDelta, finalEvaluation, statePointers, residualCases, campaignExperience, nextDecisionProblems, campaignPlanProblems, integrationPlanProblems]
