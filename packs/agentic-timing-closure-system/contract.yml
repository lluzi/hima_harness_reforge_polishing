goal:
  # Minor (final review): max is 0, not 1. `target_setup_wns_ns`/`target_hold_wns_ns`
  # name a REQUIRED margin (setup-goal/hold-goal's own `predicate: { op: gte,
  # threshold: { parameter: ... } }`), but this Pack's own evidence can never PROVE a
  # positive one: PT's `report_global_timing` only ever reports a real WNS for a mode
  # that actually has violations ("NUM>0"); a clean mode instead prints "No violations
  # found", which `atcs.reports.parse_global_timing` can only parse as `known(0.0)`,
  # never a genuine positive slack margin (PT does not report how much positive margin
  # a clean design has this way). A Run configured with, say, `target_setup_wns_ns =
  # 0.2` could therefore never pass `setup-goal` even once every real violation was
  # fixed -- the only value this evidence can ever honestly certify is the Global
  # Constraint's own `0.0` ("no violations"), so `max: 0` makes that the only value a
  # Run can be configured with, instead of silently accepting a knob this Pack's own
  # evidence can never satisfy. See FABRIC.md's Gaps for the SPEC-consistent framing.
  target_setup_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  target_hold_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }

strategy:
  maxPaths: { type: number, unit: paths, min: 100, max: 5000, default: 1000 }
  # Issue #64 Task 5: how many of the six parallel worker branches may hold an active XTop expert
  # Team; slots above it are parked. Each active branch holds one Site Job at a time.
  workerSlots: { type: number, unit: slots, min: 1, max: 6, default: 6 }
  autoFinish: { type: number, unit: flag, min: 0, max: 1, default: 1, precision: 0 }

words:
  target_setup_wns_ns: { label: target setup WNS, unit: ns }
  target_hold_wns_ns: { label: target hold WNS, unit: ns }
  maxPaths: { label: max paths per scenario query, unit: paths }
  workerSlots: { label: parallel worker slots, unit: slots }
  autoFinish: { label: "auto-finish after the expert recipe (1 on, 0 off)", unit: flag }

knowledge:
  - file: method-and-benchmark.md
    purpose: The confirmed business scope, the B_lazy comparison and the collaborative-merge method, so the Campaign does not collapse into a linear fix loop.
  - file: state-and-evidence.md
    purpose: States, coverage, precision, working/best/delivery and unknown, and which evidence may not be mixed.
  - file: observation-strategy.md
    purpose: GBA/PBA, path breadth and diversity, Nworst/max_paths and query cost, to decide what to observe next and when to stop.
  - file: mechanisms-and-falsifiers.md
    purpose: Cell, net, clock, SI and spatial root causes with their falsifiers and joint windows, for decomposition and real trials.
  - file: xtop-capabilities.md
    purpose: The XTop queries, attributes, manual/auto modes and the typed atcs_* procedures a worker session may use.
  - file: xtop-expert-operator.md
    purpose: >-
      The XTop expert loop (reference, diagnose, trial, gain, keep or undo), the hold and setup ladders,
      target/margin pairing, the fail-reason to move table and blockers versus bulk, so plans cluster
      blockers, worker requests propose ladder moves and the worker Team's Operator trials and undoes.
  - file: contribution-and-merge.md
    purpose: Base-relative changes, dependencies and atomic groups, rebase and recovery, for composing complementary Contributions.
  - file: cheap-verification.md
    purpose: When a PT pre-check is applicable, why new nets without RC are unqualified, and when a controlled physical trial is worth it.
  - file: innovus-stage-interventions.md
    purpose: The verified stage hooks and read-backs that turn a residual case into one bounded APR stage request.
  - file: lifecycle-and-input-modes.md
    purpose: The strict full-flow/post-route-only scopes, lifecycle completeness and when an earlier APR stage is justified.
  - file: experience-transfer.md
    purpose: Success and failure conditions, predicted versus measured, and version/region applicability of recorded experience.

agentTeams:
  # Issue #64 Task 4: one Team per worker slot, in Harness scope mode. The Reviewer approves a scope
  # (commands from the recipe list, which is the xtop-operator toolkit's mutations, and a budget up to
  # maxMutations); the Operator runs the expert loop of knowledge/xtop-expert-operator.md inside it.
  # maxMutations 120 is the recipe cap: an expert needs dozens of trials and each atcs_undo counts, so
  # it leaves room for about 60 trials with their undos, below the Harness ceiling of 200. Every work
  # package's Tcl-side scope.maxMutations equals it (flow/atcs/workspaces.py SCOPE_MAX_MUTATIONS); the
  # Reviewer's smaller budget is the one the Host enforces. The Team for a slot is Team 01 with the slot
  # number changed; a Team exists for every operate-worker node the graph declares.
  # Shares (Task 2b, six slots x two generations in a 180-min box, Site parallelJobs >= 6): Researcher and
  # Reviewer 10 min each, Operator 20 min, the Host's Operator ceiling.
  - id: atcs-worker-01
    version: "4"
    triggerNode: operate-worker-01
    members:
      - id: researcher
        role: researcher
        node: operate-worker-01
        taskTemplate: 'Read the exact admitted workerRequest01 for slot w01. Its candidate names the blockers'' targetPins, the edit domain, the widest scope the Operator may be given (candidate.scope.commands) and the Workshop''s sessionPlan and evidence. Return hypotheses for the XTop expert Operator: for each blocker cluster, the mechanism the cited paths, analyze reports and XTop fail reason evidence point to; the first move from the hold ladder (size down, dummy, delay or buffer chain, loader clustering, timing window) or the setup ladder (remove buffer, size, buffer, split net, size down off-path) with its target and opposite margin; and its falsifier, the atcs_gain reading that would make the Operator undo it. Name only pins and instances in the request, and do not execute anything; request a Workshop revision when no move is justified. Return one compact schema-complete JSON object in this turn; at most one hypothesis per blocker cluster, shared evidenceRefs once, and concise limitations. Do not repeat the input document. If the owner returns a refusal of your reply, answer with the corrected single JSON object only.'
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 8000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-research/1
          required: [schema, hypotheses, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: reviewer
        role: reviewer
        node: operate-worker-01
        taskTemplate: 'Read the adopted Researcher result and exact workerRequest01. Approve a scope for the Operator''s expert session, not one action. scope.commands lists the atcs_* mutations the adopted hypotheses need, chosen from candidate.scope.commands, and always includes atcs_undo so that every trial without gain can be undone. scope.maxMutations is a budget, from 1 to candidate.scope.maxMutations, that fits the expert loop: the planned trials, one undo for each, plus a margin for toolkit refusals, which also spend an approved mutation. A token budget of one or two cannot run the loop. Set planSha256 to the observation content SHA of workerRequest01, and return evidenceRefs and limitations. Refuse if no hypothesis is safe inside the edit domain. Return one compact schema-complete JSON object in this turn, with at most three short limitations. If the owner returns a refusal of your reply, answer with the corrected single JSON object only.'
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: [researcher]
        resultSchema:
          id: atcs-worker-review/2
          required: [schema, planSha256, scope, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-01
        taskTemplate: 'You are slot w01''s XTop expert Operator. Work only through hima_interactive in this execution''s xtop-operator session, inside the Host-injected immutable reviewed scope: only its commands mutate, every mutation carries its planSha256, and the Host admits at most its maxMutations mutations, undo included. Each trial is probabilistic: keep what XTop''s gain shows helps and undo what does not. The merge later ranks sessions by value, so a short, clean kept log beats many marginal edits. Run the expert loop on the request''s targetPins, the blockers; the bulk belongs to auto-finish. 1. atcs_dump_cells before.dump, then atcs_ref once. 2. Diagnose before any change: atcs_paths (setup or hold, topN, endPoints = the target pins), the fail reasons auto-fix reported in the request''s evidence (none in the first generation: only an evaluated batch carries them), and atcs_candidates for the path cells. XTop keeps no fail reasons in the session before its first fix, so read atcs_fail_reasons on the target pins after your own fix (setup reasons after a setup fix: the batch''s auto-finish ends with hold and leaves them unread). 3. Choose one move and change one variable per trial. Hold ladder: size down (atcs_size_cell, or atcs_fix_hold_pins with sizeCellOnly 1 and effort omit); dummy (atcs_insert_dummy, or useDummyCell 1); delay or buffer chain (atcs_insert_buffer with several masters, or maxDelayCellLength with delayCellList); loader clustering (maxClusterLoaderCount, try 4); timing window (fixTimingWindow 1 at effort low, never with sizeCellOnly). Setup ladder, at effort medium or high: remove buffer (atcs_remove_buffer, or removeBufferOnly 1); size (atcs_size_cell, atcs_exchange_cell, or methods size_cell); buffer (atcs_insert_buffer, atcs_split_load, or methods insert_buffer); split net (atcs_split_net, or methods split_net); size down off-path (sizeDownOnly 1). Pair every target with the opposite margin, holdTarget with setupMargin and setupTarget with holdMargin, starting at 0 and 0. Let the fail reasons steer: break_setup, a timing window or a smaller step; break_hold, holdMargin above 0 or size instead of buffer; too_large_slack, a chain or buffer rather than size; unable_fix_by_dummy_cell, a chain; sufficient_driving_strength, size or split rather than buffer; no_setup_gain or no_hold_gain, another method or pin set, never only more effort; legal_fail_no_space_on_row, smaller or fewer cells, else record it. 4. Trial a manual move once. XTop commits a targeted fix (atcs_fix_hold_pins, atcs_fix_setup_pins) and atcs_undo cannot revert it, so send one only as a move to keep, after the manual trials; a fix that may insert cells (hold unless sizeCellOnly without useDummyCell, setup insert_buffer or split_net) needs each pin''s net in the edit domain. 5. atcs_gain for the target check and the opposite check. 6. Keep it only if the target slack improved and the opposite check did not break; otherwise atcs_undo at once. 7. Stop when the budget is spent, when no ladder candidate gains, or when the blockers are clear. Then atcs_dump_cells after.dump, atcs_export_changes and atcs_close. A Host refusal (outside the scope, another plan hash, the budget spent) is free, but when the toolkit refuses an admitted mutation (a pin or instance outside the domain, a point outside every region, a master already in place) the toolkit refusal costs one approved mutation; so check the domain, pins, regions and candidates with the free read procedures before sending. Read every refusal and choose again, and never resend a mutation. If the session is tainted, dump, close and report it; preserve uncertain outcomes. Return one JSON object with schema, planSha256, mutationReceipts (the request ids of the mutations the Host admitted), stopReason (budget, no-candidate-gains, blockers-clear, tainted or refused) and limitations.'
        inputs: [workerRequest01]
        allowedTools: [hima_interactive]
        scopePolicy: site-qualified-interactive-only
        budgetShare: { maxElapsedMs: 1200000, maxFollowups: 0, maxTokensPerTurn: 5000 }
        dependencyRoles: [reviewer]
        resultSchema:
          id: atcs-worker-session/1
          required: [schema, planSha256, mutationReceipts, stopReason, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: forbidden
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
        reviewedAction:
          mode: scope
          fromRole: reviewer
          planInput: workerRequest01
          hostPlanHashArgument: planSha256
          planHashField: planSha256
          scopeField: scope
          commands: [atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer, atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer, atcs_fix_hold_pins, atcs_fix_setup_pins, atcs_undo]
          maxMutations: 120
