        budgetShare: { maxElapsedMs: 1200000, maxFollowups: 0, maxTokensPerTurn: 5000 }
        dependencyRoles: [reviewer]
        resultSchema:
          id: atcs-worker-session/1
          required: [schema, planSha256, mutationReceipts, stopReason, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: forbidden
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
        reviewedAction:
          mode: scope
          fromRole: reviewer
          planInput: workerRequest06
          hostPlanHashArgument: planSha256
          planHashField: planSha256
          scopeField: scope
          commands: [atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer, atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer, atcs_fix_hold_pins, atcs_fix_setup_pins, atcs_undo]
          maxMutations: 120

workshops:
  - id: diagnose-and-observe
    purpose: >-
      Diagnose the current timing problem from the declared baseline state, current observation, risk
      atlas and experience: name the competing root causes and the cheapest query that separates them.
      Write the observation request to research/requests/observation-request.json as one JSON object
      {designStateId, precision (gba|pba), requiredScenarios, maxPaths, nworst} naming the working
      design-state it observes; the Run's maxPaths Strategy knob caps the value the observe tool
      uses; the tool builds every scenario's PT inputs from the working state itself. Every required scenario stays in the request; the request never
      changes frequency, exceptions or required checks. It is a plan, not a measurement.
    directory: research/diagnose
    entry: entry.py
    language: python
    reads: [workingState, inputReadiness, currentObservations, riskAtlas, campaignExperience, statePointers]
    knowledge: [observation-strategy.md, mechanisms-and-falsifiers.md, state-and-evidence.md, experience-transfer.md]
    produces: observationRequest
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: plan-campaign
    purpose: >-
      Decompose the current problem into blocker clusters for the six worker slots w01..w06, blockers
      first, all against the working design-state (workingState). The slots run at once as parallel
      fork branches from the same base, each an XTop expert Team working one cluster. Read
      state/worker-slots.json (workerSlotPolicy): slots up to workerSlots may be active and every slot
      above workerSlots must be parked. Blockers first: the worst setup check and the worst hold check
      of every required scenario in the current observation (state/observation.json; the most negative
      known slack per scenario and mode) must each be covered by some active slot: its endpoint pin
      (the check key's, or PT's raw endpoint for a key <pin>@<group>) in the slot's targetPins, or,
      for a check ending at a top-level port, its check key in the slot's targets. The worst clusters
      take the lowest slots. Active slots share no instance: an instance in one active slot's
      editDomain.instances, or owning one of its targetPins, is in no other active slot's domain or
      target pins. Active slots also share no edit-domain net: a net in one active slot's
      editDomain.nets is in no other's. Read the prior batch's XTop fail reasons after auto-finish
      (state/residual-cases.json, batchFailReasons and each case's failReasons): the clusters plain
      auto-fix could not fix, and why, are the expert slots' work. The first generation has no evaluated batch, so it carries no batchFailReasons: plan from the observation's blockers. An active slot's package holds problem, target check keys, edit domain
      (instances, nets and regions [x1, y1, x2, y2] in microns for moves), protected objects, may-affect checks,
      admissible actions (size_cell, insert_buffer, delete_buffer, and pg_local_adjust only when
      siteCapabilities.pgVerification is true), budget, targetPins (the blockers' full hierarchical
      pin paths), scope {commands: the atcs_* toolkit mutations the slot may need, always including
      atcs_undo; maxMutations: 120, the worker Team's recipe cap} and optionally observe (fast or full).
      A slot with no cluster worth an expert session is parked: its package is exactly {taskId,
      baseStateId, parked: true, problem: <why it is parked>} and nothing else; its branch runs as a
      no-op and seals a parked no-fix. Write one document, research/requests/campaign-plan.json:
      {candidate: {workPackages: {w01, .., w06}, reason}, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>}. There is exactly one copy of workPackages, under
      candidate; never repeat it at the top level. The Reader admits candidate.workPackages, and
      prepare-workers prepares that same field. The Reader refuses a plan whose current observation is
      not of the working state, so observe again after the working state moves. Do not repeat a failed
      trial without new evidence.
    directory: research/plan
    entry: entry.py
    language: python
    reads: [workingState, workerSlotPolicy, inputReadiness, currentObservations, acceptancePolicy, riskAtlas, contributionIndex, campaignExperience, statePointers, residualCases]
    knowledge: [method-and-benchmark.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, xtop-capabilities.md, xtop-expert-operator.md]
    produces: campaignPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-01
    purpose: >-
      Research worker slot w01 inside its prepared private workspace. Read the slot's prepared
      manifest, its work package (targetPins, editDomain with regions, scope, observe) and the recorded
      evidence, including the prior generation's XTop fail reasons (the slot's own Contribution's
      failReasons, and the batch's after auto-finish in state/residual-cases.json); choose the
      ladder moves, falsifiers and typed atcs_* procedures the expert Operator session will try
      (knowledge xtop-expert-operator.md). The worker Team's Reviewer approves the Operator's scope from
      candidate.scope; there is no pinned action list. Write the
      slot's request to research/requests/worker-request-w01.json as {candidate: <the w01 work
      package exactly as prepared in state/workers.json: the same editDomain, targetPins, observe and
      scope; the Reader counts any difference>, baseState: <the stamped workingState>,
      siteCapabilities: <the Site capabilities>, sessionPlan: <ordered typed commands and the falsifier
      of each>}. The Operator session must write before.dump and after.dump (atcs_dump_cells) in the
      slot's workspace root and may write summary.json {xtopSetupWns, xtopHoldWns, diagnosis, cones,
      dependencies}. A prediction is a hypothesis for the tool to test, never a result. When the slot's
      prepared package is parked (parked: true), write {candidate: <that parked package exactly as
      prepared>, baseState, siteCapabilities} and no sessionPlan: the slot's operate node is then the
      parked no-op, no Team member is created for it, and its capture seals a parked no-fix.
    directory: research/worker-01
    entry: entry.py
    language: python
    reads: [workingState, workerManifests, campaignPlan, currentObservations, riskAtlas, campaignExperience, workerResult01, residualCases]
    knowledge: [xtop-capabilities.md, xtop-expert-operator.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, cheap-verification.md, experience-transfer.md]
    produces: workerRequest01
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

