  - name: workerResult05
    path: state/contribution-w05.json
    reader: atcs-worker-result-05
    description: >-
      Slot w05's sealed M3 Contribution: an xtop-session batch (commands, each with its own
      measured gain and the blockers it improved; effectiveDomain, attempted, aggregateGain,
      oppositeEffects, physicalRisk, undone, reads, limitations; advisories: the batch-net value
      findings, never a refusal; only corrupt data or an out-of-scope edit refuses), a no-fix, or a parked no-fix.
  - name: workerResult06
    path: state/contribution-w06.json
    reader: atcs-worker-result-06
    description: >-
