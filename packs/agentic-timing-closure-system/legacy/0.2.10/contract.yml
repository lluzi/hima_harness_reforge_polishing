        taskTemplate: "Advisory only: nothing waits for you and nothing is gated on you. Read the exact admitted workerRequest02 for slot w02 and return the concerns and the sharpest first moves a second pair of eyes sees (a pin outside the edit domain, a master of the wrong function, a ladder rung worth trying first) as at most three limitations under 200 characters each. Reply with exactly one JSON object and nothing else: schema (atcs-worker-review/3), planSha256 (the observation content SHA-256 of workerRequest02), evidenceRefs (Runtime input record ids) and limitations. If the owner returns a refusal of your reply, answer with the corrected single JSON object only."
        inputs: [workerRequest02]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-review/3
          required: [schema, planSha256, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: candidate-only
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-02
        taskTemplate: "You are w02's DeepSeek timing specialist. Expertise prior: output or branch-split insertion; your actual unique cluster is the CURRENT admitted work package. You are the Owner's tool hand. Use only granted input windows and typed interactive commands; no raw shell or source search. Read only operatorBrief, the focused assignment, strategyRisk/commonResidual and needed sessionPlan fields. Preserve exact planSha256, namePrefix, scope and regions.\n\nShared playbook: start at actual common R1, verify automatic before.dump, atcs_ref and both checks. Analyze native Path/GBA and fail reasons; atcs_path_pin_rank supports hold input for min-delay hold paths or setup output for max-delay setup paths; cross pairs are refused without state changes. Never switch the intended check merely to obtain another pin side. Choose a current high-setup-margin legal insertion point and state one root-cause hypothesis. Input margin rank measures setup margin; output rank measures hold margin, so confirm setup evidence before using an output pin. A fix point outside the declared domain requires the planner's existing preparation/revision, never a scope bypass.\n\nTry one coherent topology/placement batch: delay/buffer or branch insertion; split_load/split_net when appropriate. If setup/driver margin blocks hold insertion, first create margin with a bounded paired action. If no site is legal, enable strict atcs_legalization_range, then widen ECO tracks 150/300/600/1000 or use scoped neighbor moves/far placement. Original-cell automatic displacement stays zero. Compensate detour transition/drive with an appropriate buffer or inverter pair/chain. Size/exchange is only an enabling margin/transition action inside an insert/split/move batch, never standalone expert evidence.\n\nMeasure HOLD WNS first plus hold TNS, setup, transition and legalization after each coherent batch; keep or undo. Re-rank after ECO. Both rank and range commands change session state, require planSha