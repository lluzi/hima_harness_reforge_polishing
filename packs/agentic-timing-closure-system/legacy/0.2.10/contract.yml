workshops:
  - id: plan-campaign
    purpose: >-
      You are the Campaign Owner. Analyze the commonStage saved native XTop R1, produced by the common
      initial AutoFix. Use only post-auto residuals for seating. Baseline PrimeTime paths remain R0
      context and do not prove a violation survived. Write ONE concise research/fix-strategy-risk.md:
      residual clusters, mechanism hypotheses, unique ownership, merge/rebase order, setup/hold and
      placement risks, and what measurement would disprove each intended fix.
      First run the existing seat-clusters helper using the verified workspace:
      python3 <workspace>/hima-readers/atcs-readiness/read-atcs.py seat-clusters <workspace> <out.json>.
      In this method it uses commonStage.nativeChecks and the native worklistId, resolves endpoints
      using the existing netlist helper, and produces at most six unique disjoint work packages. Raw
      analysisboard reports retain the source evidence; native timing is prediction, never the final
      referee. A shared-startpoint annotation from R0 is only a hypothesis until checked in R1.
      Write research/requests/campaign-plan.json in the existing example-campaign-plan.md envelope:
      {candidate: {workPackages: <exact six slots w01..w06>, reason}, baseState: <complete state/working-state.json>,
      siteCapabilities: {pgVerification: false}}. Every baseStateId is the physical parent R0 identity;
      prepare-workers adds the explicit common R1 seed identity to each private manifest. Copy the
      helper's packages, identify the report section in each active package's problem, and refine only
      necessary local targets/regions using endpoint-resolution.md. Preserve disjoint cluster ownership.
      Every slot above workerSlots is parked; workerSlots 0 is the strong repeated-default-GBA control.
      If fewer than six unique clusters exist, park remaining seats with the reason; never duplicate a
      cluster to fill a seat. A large shared-startpoint cluster may be divided into distinct disjoint
      leaf/hierarchy subclusters with the same mechanism; keep unique instance ownership and explain
      the split in the one report. Include every toolkit mutation and atcs_undo in active scope with maxMutations
      600. The Operator uses the full qualified toolkit in its private R1 clone. Validate each package with
      flow.atcs.workspaces.validate_work_package against the complete physical baseState before writing.
      The request Workshops embed this same report and common residuals into their existing admitted
      worker-request envelope. Do not invent another report schema, Reader, Judge or review stage.
    directory: research/plan
    entry: entry.py
    language: python
    reads: [workingState, workerSlotPolicy, inputReadiness, currentObservations, acceptancePolicy, riskAtlas, contributionIndex, campaignExperience, statePointers, residualCases, campaignPlanProblems, commonStage]
    knowledge: [method-and-benchmark.md, mechanisms-and-falsifiers.md, contribution-and-merge.md, xtop-capabilities.md, xtop-expert-operator.md, example-campaign-plan.md, endpoint-resolution.md]
    produces: campaignPlan
    argv: [python3, '${ENTRY}', '${WORKSPACE}', '${WORKSHOP}']

  - id: research-worker-01
    purpose: >-
      Read only your cluster section of the shared fixStrategyRisk report and commonStage residuals.
      This private trial session clones the common R1; preserve each kept measured command for the
      Owner's persistent Timing Lead. Cleared R0 violations are not work targets.
      Research slot w01. This first task is to write one small entry.py that reads argv[1] as the Campaign workspace and writes the exact declared request file; it is not a general repository investigation. Start like this:

        import json, os, sys
        workspace, slot = sys.argv[1], "w01"
        sys.path.insert(0, os.path.join(workspace, "flow"))
        from atcs import workspaces
        def load(*parts):
            with open(os.path.join(workspace, *parts)) as handle: return json.load(handle)
        working = load("state", "working-state.json")
        prepared = load("state", "workers.json")["workers"][slot]["workPackage"]
        candidate = {key: value for key, value in prepared.items() if key not in ("schema", "id")}
        site = load("research", "requests", "campaign-plan.json")["siteCapabilities"]
