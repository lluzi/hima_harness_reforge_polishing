id: agentic-timing-closure-system
version: "0.2.10"
title: Agentic timing closure system
status: development
minimumHarnessVersion: 0.2.1

ontology:
  aliases:
    contribution: [ECO contribution, worker contribution]
    campaign: [closure campaign, timing closure campaign]
    batch: [integration batch, merge batch]

# SPEC "Run contract" Budget: a finite Site default the user may override; the Pack never widens it.
# The Run's budget ending is the Runtime's own (SPEC Endings); no converge block exists anywhere.
budget:
  timeBoxMs: 7200000
  closingReserveMs: 1800000
  # #64 Track B (live class C28), reshaped 2026-09-29 (ADR-0016): every generation is one batch and
  # one refresh, generation 1 included (the baseline flows straight into the first plan). #66 D9: the
  # decisive experiment is one generation and one refresh, so one generation is the floor; a Run
  # declaring two refreshes ends honestly at the refresh-budget gate or the owner's decision.
  minimumGenerations: 1

inputs:
  - name: designStateManifest
    description: >-
      JSON manifest of the recoverable Innovus starting state: top, stage, database (.enc and .enc.dat),
      netlist, DEF, per-corner SPEF, SDC list, tool versions, scenarios, and the optional full-flow
      lifecycle index. Read by bind-inputs (M1 input_readiness) and baseline (M1 design_state).
  - name: analysisContract
    description: >-
      Read-only directory of the fixed analysis contract, one JSON document per concern, read by the
      tools at fixed names: query-spec.json (final PBA/coverage query: precision, requiredScenarios,
      nworst; maxPaths comes from the Strategy), scenarios.json (C4, final review:
      `[{name, corner, libGlob, driverLibrary, originalDriverLibrary}]`, the single source of both a
      scenario's RC corner and its PT library identity -- was scenario-corners.json, a bare
      `{scenario: corner}` map with no library information at all; observe/sta/residual/presta all
      read it, and policy derives its own scenarioCorners/requiredScenarios from it), corners.json
      ({"corners": {corner: templatePath}}, each corner's own Site-provided StarRC command-file
      template, hashed and threaded into extract -- I1, final review), recheck.json, policy.json (the
      static acceptance terms only: allowDegradedWorking, degradeLimitNs, maxNewConstraintFailures;
      the policy tool refuses a file setting goal or a run-time field, or a scenarioCorners/
      requiredScenarios that disagrees with the one derived from scenarios.json).
      The starting state's own DRC/connectivity reports are no longer a Site-authored document here
      (I13, final review): physical-baseline runs this Pack's own Innovus export against the staged
      baseline database instead. The model never writes this directory.
  - name: siteCapabilities
    description: >-
      Site-owned JSON of qualified capabilities and bindings: edaShell (the Site's EDA launch prefix
      every EDA-launching subcommand runs through), design, techLef, cellLefGlob (XTop session
      inputs), pgVerification (whether PG-local edits are admissible) and the declared lifecycle
      capability. Read as siteCapabilities, siteProfile and edaProfile by atcs_cli.py.
  - name: workspaceRoot
    description: Campaign-private output root the Site Permit allows; every Campaign workspace lies under it.

outputs:
  - name: commonStage
    path: state/common-stage.json
    description: Common native R1 seed, semantic state/worklist identities, residual summaries/endpoints and analysisboard; XTop prediction only.
  - name: fixStrategyRisk
    path: research/fix-strategy-risk.md
    description: One concise Owner strategy and risk report from post-auto native residuals, shared with six trial Operators and the Timing Lead.
  - name: timingLeadBrief
    path: state/lead-brief.json
    description: Owner-directed lead session's R1, strategy and Contribution identities; control uses repeated default GBA.
  - name: timingLeadFinal
    path: state/lead-final.json
    description: Final exported cumulative ECO and mergeCommit identity; direct Innovus input, no final global AutoFinish.
  - name: inputReadiness
    path: state/readiness.json
    reader: atcs-readiness
    description: M1 input-readiness (post-route minimum inputs, strict full-flow/post-route-only scope, lifecycle availability).
  - name: baselineState
    path: state/baseline.json
    description: M1 design-state of the starting database, fixed for the whole Campaign (policy anchor).
  - name: workingState
    path: state/working-state.json
    reader: atcs-refresh-budget
    description: >-
      The design-state every batch is based on: seeded from the baseline by baseline, rewritten by
      adopt whenever the working pointer moves to an adopted candidate.
  - name: acceptancePolicy
    path: state/policy.json
    description: >-
      Stamped acceptance policy: the Site's static terms, the Run's Goal targets, and the baseline
      state id, baseline minimum WNS and Campaign root composed by the policy tool.
  - name: currentObservations
    path: state/observation.json
    description: M1 observation-set of the latest PT observation (baseline or query); raw reports stay under research/observe/.
  - name: baselinePhysical
    path: state/baseline-physical.json
    description: Starting-state DRC/connectivity report text the final evaluation compares candidate physical checks against.
  - name: riskAtlas
    path: state/risk.json
    description: M1 check-comparison of the previous observation against the current one (fixed/remaining/entrant/regressed/missing-prior).
  - name: campaignPlan
    path: research/requests/campaign-plan.json
    reader: atcs-campaign-plan
    description: >-
      The plan Workshop's one campaign-plan document, holding every slot's work package (w01..w06, a
      parked slot's as {taskId, baseStateId, parked: true, problem}) under candidate.workPackages (with
      baseState and siteCapabilities alongside, for the Reader's own validation) and nowhere else. The campaign-plan Reader admits candidate.workPackages, and
      prepare-workers reads that exact same field; a top-level workPackages key is refused
      (ambiguous-plan) if present at all, since a second copy is never allowed to exist.
  - name: campaignPlanProblems
    path: research/requests/campaign-plan.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/campaign-plan.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerManifests
    path: state/workers.json
    description: >-
      M2 prepared private workspaces of the worker slots w01..w06 (roots, name prefixes, work packages;
      session Tcl and ops logs for active slots, `parked: true` for parked ones) and `requiredSlots`, all six.
  - name: workerSlotPolicy
    path: state/worker-slots.json
    description: >-
      The Run's workerSlots Strategy knob bound for this generation's plan: activeSlots w01..w0<n> and
      parkedSlots above it. The campaign-plan Reader refuses an active slot above the knob.
  - name: workerRequest01
    path: research/requests/worker-request-w01.json
    reader: atcs-worker-request-01
    description: Slot w01's research request in the worker-request read envelope.
  - name: workerRequest01Problems
    path: research/requests/worker-request-w01.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w01.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest02
    path: research/requests/worker-request-w02.json
    reader: atcs-worker-request-02
    description: Slot w02's research request in the worker-request read envelope.
  - name: workerRequest02Problems
    path: research/requests/worker-request-w02.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w02.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest03
    path: research/requests/worker-request-w03.json
    reader: atcs-worker-request-03
    description: Slot w03's research request in the worker-request read envelope.
  - name: workerRequest03Problems
    path: research/requests/worker-request-w03.problems.txt
    description: >-
      The Reader's itemized refusal of research/requests/worker-request-w03.json: one line per problem, each naming its field and the
      format it needs, written beside the document by tools/read-atcs.py on every reading ("0 problems"
      once admitted). No reader: the producing Workshop reads it after a refusal.
  - name: workerRequest04
    path: research/requests/worker-request-w04.json
