rules:
  # Reshaped 2026-09-29 (ADR-0016): in-loop Judges keep identity and merge integrity and the refresh
  # cap; the final evaluation's other checks are facts the decision reads, not routes.
  - inputs-ready
  - refresh-budget
  - request-admissible
  - request-checked
  - worker-result-admissible
  - composition-ready
  - composition-checked
  - replay-consistent-mismatch
  - replay-consistent-scope
  - final-evidence-ready-identity
  - setup-goal
  - hold-goal

goal:
  # Minor (final review): max is 0, not 1. `target_setup_wns_ns`/`target_hold_wns_ns`
  # name a REQUIRED margin (setup-goal/hold-goal's own `predicate: { op: gte,
  # threshold: { parameter: ... } }`), but this Pack's own evidence can never PROVE a
  # positive one: PT's `report_global_timing` only ever reports a real WNS for a mode
  # that actually has violations ("NUM>0"); a clean mode instead prints "No violations
  # found", which `atcs.reports.parse_global_timing` can only parse as `known(0.0)`,
  # never a genuine positive slack margin (PT does not report how much positive margin
  # a clean design has this way). A Run configured with, say, `target_setup_wns_ns =
  # 0.2` could therefore never pass `setup-goal` even once every real violation was
  # fixed -- the only value this evidence can ever honestly certify is the Global
  # Constraint's own `0.0` ("no violations"), so `max: 0` makes that the only value a
  # Run can be configured with, instead of silently accepting a knob this Pack's own
  # evidence can never satisfy. See FABRIC.md's Gaps for the SPEC-consistent framing.
  target_setup_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  target_hold_wns_ns: { type: number, unit: ns, min: 0, max: 0, default: 0 }
  # Issue #64 Track B (from #63): the Run's cap on completed full physical refreshes
  # (implement/apr-run -> extract -> sta). Every Explore revisit consumes a generation whether
  # or not it refreshes, so the generation limit does not bound refreshes; the refresh-budget
  # Judges before implement and apr-prepare do. A Goal value, fixed when the Run is created: no
  # next-strategy decision or revision changes it. Default 2, the two refreshes of the #64 deal.
  max_physical_refreshes: { type: number, unit: count, min: 1, max: 4, default: 2, precision: 0 }

strategy:
  maxPaths: { type: number, unit: paths, min: 100, max: 5000, default: 1000 }
  # Issue #64 Task 5: how many of the six parallel worker branches may hold an active XTop expert
  # Team; slots above it are parked. Each active branch holds one Site Job at a time. #66 D8: 0 parks
  # every seat, the qualified full-auto control arm (the same Pack, the batch runs auto-finish alone).
  workerSlots: { type: number, unit: slots, min: 0, max: 6, default: 6 }
  autoFinish: { type: number, unit: flag, min: 0, max: 0, default: 0, precision: 0 }

words:
  target_setup_wns_ns: { label: target setup WNS, unit: ns }
  target_hold_wns_ns: { label: target hold WNS, unit: ns }
  max_physical_refreshes: { label: max full physical refreshes per Run, unit: count }
  maxPaths: { label: max paths per scenario query, unit: paths }
  workerSlots: { label: "parallel worker slots (0 parks every seat: full-auto control)", unit: slots }
  autoFinish: { label: "final global AutoFinish disabled; initial common AutoFix is mandatory", unit: flag }

knowledge:
  - file: method-and-benchmark.md
    purpose: The confirmed business scope, the B_lazy comparison and the collaborative-merge method, so the Campaign does not collapse into a linear fix loop.
  - file: state-and-evidence.md
    purpose: States, coverage, precision, working/best/delivery and unknown, and which evidence may not be mixed.
  - file: observation-strategy.md
    purpose: GBA/PBA, path breadth and diversity, Nworst/max_paths and query cost, to decide what to observe next and when to stop.
  - file: mechanisms-and-falsifiers.md
    purpose: Cell, net, clock, SI and spatial root causes with their falsifiers and joint windows, for decomposition and real trials.
  - file: xtop-capabilities.md
    purpose: The XTop queries, attributes, manual/auto modes and the typed atcs_* procedures a worker session may use.
  - file: xtop-expert-operator.md
    purpose: >-
      The XTop expert loop (reference, diagnose, trial, gain, keep or undo), the hold and setup ladders,
      target/margin pairing, the fail-reason to move table and blockers versus bulk, so plans cluster
      blockers, worker requests propose ladder moves and the worker Team's Operator trials and undoes.
  - file: contribution-and-merge.md
    purpose: Base-relative changes, dependencies and atomic groups, rebase and recovery, for composing complementary Contributions.
  - file: cheap-verification.md
    purpose: When a PT pre-check is applicable, why new nets without RC are unqualified, and when a controlled physical trial is worth it.
  - file: innovus-stage-interventions.md
    purpose: The verified stage hooks and read-backs that turn a residual case into one bounded APR stage request.
  - file: lifecycle-and-input-modes.md
    purpose: The strict full-flow/post-route-only scopes, lifecycle completeness and when an earlier APR stage is justified.
  - file: experience-transfer.md
    purpose: Success and failure conditions, predicted versus measured, and version/region applicability of recorded experience.
  # #64 Track B (from #63): one admitted example per model-written document, read by the Workshop
  # that writes it; flow/tests/test_workshop_examples.py runs each through its Reader to 0 problems.
  - file: example-campaign-plan.md
    purpose: An admitted six-slot research/requests/campaign-plan.json (six active clusters filling workerSlots 6, the parked shape in its text), to copy in shape.
  - file: example-worker-request.md
    purpose: Admitted worker requests for an active slot, an active slot with no safe move, and a parked slot, to copy in shape.
  - file: example-integration-plan.md
    purpose: An admitted research/requests/integration-plan.json with one conflict resolution, to copy in shape.
  # #64 (from #63 C22, 45257f24 and e00d06cb): the Pack's endpoint resolver, shipped with its Reader.
  - file: endpoint-resolution.md
    purpose: >-
      How a plan or worker Workshop turns PrimeTime endpoints into the leaf-cell editDomain.instances
      and targetPins the Readers admit, with read-atcs.py resolve-instances; pass the endpoint, not the
      check key.

agentTeams:
  # Issue #64, reshaped 2026-09-29 (ADR-0016): one Team per worker slot, run inside the self-driving
  # fork branch. The branch's Researcher is the branch child Agent that authors the research Workshop,
  # and its output is the request itself: the Operator is materialized with that request's exact bytes
  # embedded in its task (#64 M-T03-1) and the scope the request states (request-scope, bound to the
  # request's plan hash), so no Reviewer gates it. The Reviewer stays an optional advisory member whose
  # absence never blocks: the autopilot never waits for it. A parked slot, or a request the Reader still
  # refuses after the fork's revisions, runs the batch no-op instead (batchWhen). maxMutations 600 is
  # the recipe cap (flow/atcs/workspaces.py SCOPE_MAX_MUTATIONS), the wide default scope every plan
  # states; the Host enforces it. The Operator's schema-valid result is adopted as it arrives.
  # Version 6 (#66 D7): the Operator owns its seat's blocker cluster, risk-assesses first, then works
  # it point to point hardest first, keeps every measured gain, undoes every regression at once and
  # hands over one batch; its share is 40 minutes, four follow-ups and 12000 tokens a turn, and a
  # batch is tens to hundreds of edits (600 mutations, undo included; Harness H1/H2).
  - id: atcs-worker-01
    version: "6"
    triggerNode: operate-worker-01
    batchWhen:
      - { input: workerRequest01, value: tc_slot_parked, equals: 1 }
      - { input: workerRequest01, value: tc_request_invalid_count, above: 0 }
    members:
      - id: reviewer
        role: reviewer
        optional: true
        node: operate-worker-01
        taskTemplate: "Advisory only: nothing waits for you and nothing is gated on you. Read the exact admitted workerRequest01 for slot w01 and return the concerns and the sharpest first moves a second pair of eyes sees (a pin outside the edit domain, a master of the wrong function, a ladder rung worth trying first) as at most three limitations under 200 characters each. Reply with exactly one JSON object and nothing else: schema (atcs-worker-review/3), planSha256 (the observation content SHA-256 of workerRequest01), evidenceRefs (Runtime input record ids) and limitations. If the owner returns a refusal of your reply, answer with the corrected single JSON object only."
        inputs: [workerRequest01]
        allowedTools: [hima_delegation_input]
        scopePolicy: declared-inputs-only
        budgetShare: { maxElapsedMs: 600000, maxFollowups: 1, maxTokensPerTurn: 5000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-review/3
          required: [schema, planSha256, evidenceRefs, limitations]
        recipient: run-owner
        ownerAdoption: candidate-only
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
      - id: operator
        role: operator
        node: operate-worker-01
        taskTemplate: "You are w01's DeepSeek timing specialist. Expertise prior: high-margin input insertion; your actual unique cluster is the CURRENT admitted work package. You are the Owner's tool hand. Use only granted input windows and typed interactive commands; no raw shell or source search. Read only operatorBrief, the focused assignment, strategyRisk/commonResidual and needed sessionPlan fields. Preserve exact planSha256, namePrefix, scope and regions.\n\nShared playbook: start at actual common R1, verify automatic before.dump, atcs_ref and both checks. Analyze native Path/GBA and fail reasons; atcs_path_pin_rank supports hold input for min-delay hold paths or setup output for max-delay setup paths; cross pairs are refused without state changes. Never switch the intended check merely to obtain another pin side. Choose a current high-setup-margin legal insertion point and state one root-cause hypothesis. Input margin rank measures setup margin; output rank measures hold margin, so confirm setup evidence before using an output pin. A fix point outside the declared domain requires the planner's existing preparation/revision, never a scope bypass.\n\nTry one coherent topology/placement batch: delay/buffer or branch insertion; split_load/split_net when appropriate. If setup/driver margin blocks hold insertion, first create margin with a bounded paired action. If no site is legal, enable strict atcs_legalization_range, then widen ECO tracks 150/300/600/1000 or use scoped neighbor moves/far placement. Original-cell automatic displacement stays zero. Compensate detour transition/drive with an appropriate buffer or inverter pair/chain. Size/exchange is only an enabling margin/transition action inside an insert/split/move batch, never standalone expert evidence.\n\nMeasure HOLD WNS first plus hold TNS, setup, transition and legalization after each coherent batch; keep or undo. Re-rank after ECO. Both rank and range commands change session state, require planSha256 and spend allowance; they create no physical ECO themselves, and physical undo does not restore their settings. Carry their exact script in the handoff so a fresh integrator can reapply it. Use native library candidates, never guessed masters; keep output short rather than repeat large tables.\n\nOne operation or undo is not completion. Try the next distinct mechanism/range while the actual Host budget remains. Stop only on cluster clear/material improvement, evidenced exhaustion of useful ladders, or actual Host budget closing; report missing capability precisely. Finish after.dump, current export with physical-risk limitations and typed atcs_close; wait for completed. Return exactly atcs-worker-session/1 with planSha256, every admitted mutation request id, stopReason and limitations. Deliver exact script, before/after metrics, legal state, failed mechanisms and next recommendation. Native timing/legality is not refreshed physical signoff."
        inputs: [workerRequest01]
        taskInputs: [{ input: workerRequest01, fields: [operatorBrief, sessionPlan, siteCapabilities] }]
        allowedTools: [hima_interactive, hima_delegation_input]
        scopePolicy: site-qualified-interactive-only
        budgetShare: { maxElapsedMs: 2400000, maxFollowups: 4, maxTokensPerTurn: 12000 }
        dependencyRoles: []
        resultSchema:
          id: atcs-worker-session/1
          required: [schema, planSha256, mutationReceipts, stopReason, limitations]
        recipient: run-owner
        ownerAdoption: required
        identity: one-child-per-role-per-execution
        followup: reuse-same-child
        cancellation: request-stop-preserve-unknown
        terminal: [completed, cancelled, expired, uncertain, refused]
        refusalConditions: [missing-current-evidence, unsafe-action, stale-execution, outcome-unknown]
        reviewedAction:
          mode: request-scope
          planInput: workerRequest01
          scopePath: [candidate, scope]
          commands: [atcs_size_cell, atcs_exchange_cell, atcs_insert_buffer, atcs_insert_dummy, atcs_split_load, atcs_split_net, atcs_move_cell, atcs_remove_buffer, atcs_fix_hold_pins, atcs_fix_setup_pins, atcs_undo, atcs_path_pin_rank, atcs_legalization_range]
          maxMutations: 600
          hostPlanHashArgument: planSha256
  - id: atcs-worker-02
    version: "6"
    triggerNode: operate-worker-02
    batchWhen:
      - { input: workerRequest02, value: tc_slot_parked, equals: 1 }
      - { input: workerRequest02, value: tc_request_invalid_count, above: 0 }
