# HimaHarness privacy overlay: the profile's own patch layer, applied after every bundle.
# Plugin names and versions are not reported to the DeepSeek API, and session telemetry is off.
# An anonymous user id and a user-agent still accompany every model request; see docs/product-idea.md §6.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  disabled: true

# HimaHarness managed model catalog: begin
# DeepSeek's current product name is DeepSeek-V4.1-Flash; its official API advertises and accepts
# `deepseek-flash` as the wire id. dsh-base 0.1.5 still defaults to the retired
# `deepseek-v4-flash`, so the Hima profile corrects the deployment choice without changing dsh.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
# HimaHarness managed model catalog: end

# The web-app auto chooser selects the renderless native backend for every
# loopback macOS Host. HimaHarness is already a native window around that Host,
# so pin the vendor's paired in-app browse backend and client surface instead.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
