# The contract suite's fixture for a chooser that sets a knob of each kind (#58): it tightens a
# number knob when the constraint passes, and sets a choice knob to one of its own declared words
# when the constraint fails — so one Run shows both kinds of knob changing, which is what the suite
# has to be able to drive.
#
# It ships here, beside `timing-push`, and not in the test pack variant that names it, because
# choosers resolve from this directory alone: `shippedChoosersDir` is fixed beside `lib/`, and a
# seeded home cannot point it elsewhere. Pack-local choosers are #57's. **When #57 lands, this file
# moves into the variant's own `choosers/` folder** (`test/contract/support/pack.ts`), where a
# fixture belongs — nothing else references it, so moving it is a rename and a line in that support.
#
# The push is deliberately past what is achievable rather than short of it: `period − slack − guardBand`
# walks the period *in* by the whole guard band on a met constraint, and the variant that names this
# chooser binds a band wide enough to overshoot the stand-in's headroom in one move (#54, #58), so a
# campaign that passes once fails next — which is what lets one short Run show a number knob moving
# and then a choice knob moving. Reading `slack` at all is what makes this a chooser and not a
# counter: on a flow that reports a real margin for a met period it takes the margin back too.
# `timing-push` is the rule a real pack wants; this is the shape a test wants.
id: test-profile-by-outcome
version: '1'
title: Tighten the period on a met constraint, and change profile on a violated one

parameter:
  name: guardBandNs
  unit: ns

reads:
  period: { type: clock_period, unit: ns }
  slack: { type: setup_wns, unit: ns }

decide:
  - when: { constraint: PASS, goal: PASS }
    goalMet: true
  # Passed: push past what was measured by the guard band, and leave the profile where it is.
  - when: { constraint: PASS }
    next:
      periodNs: { sum: [period, { neg: slack }, { neg: guardBandNs }] }
  # Violated: the period stays and the profile changes, which is the knob a literal sets.
  - when: { constraint: FAIL }
    next:
      profile: dense
